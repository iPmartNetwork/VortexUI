  :root{
    --font-sans: "Vazirmatn", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Tahoma, Arial, "Noto Sans", "Noto Sans Arabic", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "Courier New", "Vazirmatn", monospace;

    /* Canonical Nova dark tokens (matched to the panel) */
    --bg: #070809;
    --panel: #0c0e12;
    --card: #101319;
    --card2: #0b0d11;
    --bd: #1c2027;
    --bd2: #262b34;
    --tx: #e9edf4;
    --tx2: #aeb6c4;
    --mu: #7c8698;

    --ac: #22d3ee;
    --ac2: #7c5cff;

    /* Brand gradient requested for this page: purple -> cyan */
    --b1: #9d4efb;
    --b2: #02cdf3;
    --brand: linear-gradient(120deg, #9d4efb 0%, #02cdf3 100%);
    --brand-soft: linear-gradient(120deg, rgba(157,78,251,0.16), rgba(2,205,243,0.16));

    --ok: #34d399;
    --wn: #f5b042;
    --dg: #f87171;

    --ac-soft: color-mix(in srgb, var(--ac) 14%, transparent);
    --ok-soft: color-mix(in srgb, var(--ok) 15%, transparent);
    --wn-soft: color-mix(in srgb, var(--wn) 16%, transparent);
    --dg-soft: color-mix(in srgb, var(--dg) 15%, transparent);
    --br-soft: color-mix(in srgb, var(--b1) 15%, transparent);

    /* Elevation surfaces */
    --surface-1: var(--card);
    --surface-2: #151a21;
    --surface-3: #1c222b;
    --input-bg: var(--card2);

    --ring: 0 0 0 3px color-mix(in srgb, var(--b2) 40%, transparent);
    --shadow-card: 0 1px 0 rgba(255,255,255,0.02), 0 12px 30px -16px rgba(0,0,0,0.75);
    --shadow-card-hover: 0 1px 0 rgba(255,255,255,0.03), 0 16px 36px -14px rgba(0,0,0,0.80);
    --shadow-pop: 0 0 0 1px rgba(255,255,255,0.08), 0 14px 40px -10px rgba(0,0,0,0.7);

    --r-xs: 8px;
    --r-sm: 10px;
    --r-md: 14px;
    --r-lg: 18px;
    --r-xl: 22px;

    --sp: 4px;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-io: cubic-bezier(0.77, 0, 0.175, 1);
  }

  *,*::before,*::after{ box-sizing: border-box; }

  html{ -webkit-text-size-adjust: 100%; }

  body{
    margin: 0;
    background: var(--bg);
    color: var(--tx);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  /* Ambient brand glow behind the page, pure CSS, no image */
  body::before{
    content:"";
    position: fixed;
    inset: -20% -10% auto -10%;
    height: 60vh;
    background:
      radial-gradient(60% 70% at 22% 0%, rgba(157,78,251,0.20), transparent 70%),
      radial-gradient(60% 70% at 82% 6%, rgba(2,205,243,0.16), transparent 70%);
    filter: blur(8px);
    pointer-events: none;
    z-index: 0;
  }

  .wrap{
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 16px 56px;
  }

  @media (min-width: 560px){
    .wrap{ padding: 32px 24px 72px; }
    body{ font-size: 15.5px; }
  }

  /* ---------- Top bar ---------- */
  .topbar{
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    row-gap: 12px;
    margin-bottom: 22px;
  }
  .brandmark{
    display: inline-flex;
    align-items: center;
    gap: 11px;
    min-width: 0;
  }
  .brandmark svg{ width: 38px; height: 38px; display: block; flex: 0 0 auto; }
  .wordmark{
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: var(--brand);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    line-height: 1;
  }
  .brandtag{
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--mu);
    padding-top: 3px;
  }

  /* Language toggle (segmented) */
  .langtoggle{
    display: inline-flex;
    padding: 3px;
    gap: 2px;
    background: var(--surface-2);
    border: 1px solid var(--bd);
    border-radius: 999px;
    flex: 0 0 auto;
    margin-inline-start: auto;
  }
  .langtoggle button{
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--tx2);
    background: transparent;
    border: 0;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: color .18s var(--ease-out), background .18s var(--ease-out);
    min-height: 32px;
  }
  .langtoggle button[aria-pressed="true"]{
    color: #0a0d12;
    background: var(--brand);
  }
  .langtoggle button:hover:not([aria-pressed="true"]){ color: var(--tx); }

  /* ---------- Cards ---------- */
  .card{
    background: var(--card);
    border: 1px solid var(--bd);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-card);
  }
  /* Single column that can shrink below its content: without minmax(0,1fr) the
     implicit grid track defaults to min-width:auto, so a long non-breaking config
     URL blows every card out past the viewport on narrow phones. */
  .stack{ display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }

  /* ---------- Identity / hero ---------- */
  .hero{ padding: 20px; }
  @media (min-width: 560px){ .hero{ padding: 26px 28px; } }

  .hero-head{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
  }
  .hello{
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--mu);
    margin: 0 0 4px;
  }
  .username{
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin: 0;
    text-wrap: balance;
  }
  @media (min-width: 560px){ .username{ font-size: 30px; } }

  .pill{
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    font-weight: 600;
    padding: 7px 13px 7px 11px;
    border-radius: 999px;
    border: 1px solid transparent;
    white-space: nowrap;
    flex: 0 0 auto;
  }
  .pill .dot{ width: 8px; height: 8px; border-radius: 50%; flex:0 0 auto; }
  .pill.active{ color: var(--ok); background: var(--ok-soft); border-color: color-mix(in srgb,var(--ok) 32%,transparent); }
  .pill.active .dot{ background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb,var(--ok) 22%,transparent); }
  .pill.expired{ color: var(--wn); background: var(--wn-soft); border-color: color-mix(in srgb,var(--wn) 34%,transparent); }
  .pill.expired .dot{ background: var(--wn); }
  .pill.quota{ color: var(--dg); background: var(--dg-soft); border-color: color-mix(in srgb,var(--dg) 34%,transparent); }
  .pill.quota .dot{ background: var(--dg); }
  .pill.disabled{ color: var(--mu); background: color-mix(in srgb,var(--mu) 14%,transparent); border-color: color-mix(in srgb,var(--mu) 30%,transparent); }
  .pill.disabled .dot{ background: var(--mu); }

  /* ---------- Usage meter (focal) ---------- */
  .usage{
    margin-top: 22px;
    padding-top: 20px;
    border-top: 1px solid var(--bd);
  }
  .usage-top{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }
  .usage-label{
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--mu);
  }
  .usage-pct{
    font-size: 13px;
    font-weight: 600;
    color: var(--tx2);
    font-variant-numeric: tabular-nums;
  }
  .usage-figures{
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .usage-used{
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  @media (min-width: 560px){ .usage-used{ font-size: 34px; } }
  .usage-total{ font-size: 15px; font-weight: 500; color: var(--mu); font-variant-numeric: tabular-nums; }
  .usage-unlimited{
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 22px; font-weight: 700; letter-spacing: -0.01em;
  }
  .usage-unlimited .inf{
    background: var(--brand); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 26px;
  }

  .track{
    position: relative;
    height: 12px;
    border-radius: 999px;
    background: var(--card2);
    border: 1px solid var(--bd);
    overflow: hidden;
  }
  .track-fill{
    position: absolute;
    inset: 0 auto 0 0;
    width: 0;
    border-radius: 999px;
    background: var(--brand);
    transition: width 1s var(--ease-out);
  }
  [dir="rtl"] .track-fill{ inset: 0 0 0 auto; }
  .track-fill.warn{ background: linear-gradient(120deg, var(--wn), #f7c66b); }
  .track-fill.full{ background: linear-gradient(120deg, var(--dg), #ff9a9a); }
  .usage-remain{
    margin-top: 10px;
    font-size: 13px;
    color: var(--tx2);
    font-variant-numeric: tabular-nums;
  }
  .usage-remain b{ color: var(--tx); font-weight: 600; }

  /* ---------- Stat grid ---------- */
  .stats{
    display: grid;
    grid-template-columns: repeat(2, minmax(0,1fr));
    gap: 12px;
    margin-top: 20px;
  }
  @media (min-width: 620px){ .stats{ grid-template-columns: repeat(4, minmax(0,1fr)); } }

  .stat{
    background: var(--surface-2);
    border: 1px solid var(--bd);
    border-radius: var(--r-md);
    padding: 14px 14px 13px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }
  .stat-ico{
    width: 30px; height: 30px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 9px;
    margin-bottom: 6px;
    color: var(--b2);
    background: var(--br-soft);
  }
  .stat-ico svg{ width: 16px; height: 16px; }
  .stat-ico.up{ color: var(--ac2); background: color-mix(in srgb,var(--ac2) 15%,transparent); }
  .stat-ico.down{ color: var(--b2); background: color-mix(in srgb,var(--b2) 15%,transparent); }
  .stat-ico.time{ color: var(--wn); background: var(--wn-soft); }
  .stat-ico.dev{ color: var(--ok); background: var(--ok-soft); }
  .stat-k{
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--mu);
  }
  .stat-v{
    font-size: 18px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2;
    font-variant-numeric: tabular-nums;
  }
  .stat-v small{ font-size: 12px; font-weight: 500; color: var(--mu); }
  .stat-sub{ font-size: 11.5px; color: var(--tx2); font-variant-numeric: tabular-nums; }

  /* ---------- Section heading ---------- */
  .sec-head{
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin: 6px 2px 0;
  }
  .sec-title{ font-size: 16px; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
  .sec-count{
    font-size: 12px; font-weight: 600; color: var(--tx2);
    background: var(--surface-2); border: 1px solid var(--bd);
    padding: 3px 9px; border-radius: 999px; font-variant-numeric: tabular-nums;
  }

  /* ---------- Subscription block ---------- */
  .sub{ padding: 20px; }
  @media (min-width: 560px){ .sub{ padding: 24px; } }
  .sub-grid{ display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
  @media (min-width: 520px){ .sub-grid{ grid-template-columns: minmax(0, 1fr) auto; align-items: center; } }

  .sub-title{ font-size: 15px; font-weight: 700; margin: 0 0 4px; }
  .sub-hint{ font-size: 13px; color: var(--tx2); margin: 0 0 14px; text-wrap: pretty; }

  .copyfield{
    display: flex; align-items: stretch; gap: 8px;
    min-width: 0;
    margin-bottom: 16px;
  }
  .copyfield .val{
    flex: 1 1 auto; min-width: 0;
    background: var(--input-bg);
    border: 1px solid var(--bd);
    border-radius: var(--r-sm);
    padding: 10px 12px;
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--tx2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex; align-items: center;
    direction: ltr;
    text-align: left;
    unicode-bidi: plaintext;
  }

  .btn{
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--bd);
    background: var(--surface-2);
    color: var(--tx);
    border-radius: var(--r-sm);
    padding: 10px 14px;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    min-height: 42px;
    white-space: nowrap;
    transition: transform .12s var(--ease-out), background .16s var(--ease-out), border-color .16s var(--ease-out);
  }
  .btn svg{ width: 15px; height: 15px; flex: 0 0 auto; }
  .btn:hover{ background: var(--surface-3); border-color: var(--bd2); }
  .btn:active{ transform: scale(0.97); }
  .btn.primary{
    background: var(--brand);
    border-color: transparent;
    color: #08111a;
  }
  .btn.primary:hover{ filter: brightness(1.06); background: var(--brand); }
  .btn.copy{ flex: 0 0 auto; }

  .imports{
    display: grid;
    grid-template-columns: repeat(3, minmax(0,1fr));
    gap: 10px;
  }
  .imp{
    text-decoration: none;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 13px 8px;
    background: var(--surface-2);
    border: 1px solid var(--bd);
    border-radius: var(--r-md);
    color: var(--tx);
    transition: transform .12s var(--ease-out), background .16s var(--ease-out), border-color .16s var(--ease-out);
  }
  .imp:hover{ background: var(--surface-3); border-color: var(--bd2); }
  .imp:active{ transform: scale(0.97); }
  .imp .glyph{
    width: 34px; height: 34px; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; color: #08111a;
    letter-spacing: -0.02em;
  }
  .imp .glyph.clash{ background: linear-gradient(135deg,#7c5cff,#9d4efb); }
  .imp .glyph.singbox{ background: linear-gradient(135deg,#22d3ee,#02cdf3); }
  .imp .glyph.v2ray{ background: linear-gradient(135deg,#34d399,#22d3ee); }
  .imp .imp-name{ font-size: 12.5px; font-weight: 600; }
  .imp .imp-sub{ font-size: 10.5px; color: var(--mu); }

  /* QR tile (shared) */
  .qrtile{
    background: #f7f9fc;
    border-radius: var(--r-md);
    padding: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
    line-height: 0;
  }
  .qrtile canvas{ display: block; border-radius: 4px; image-rendering: pixelated; image-rendering: crisp-edges; }
  .qr-sub{ justify-self: center; }
  @media (min-width: 520px){ .qr-sub{ justify-self: end; } }

  /* ---------- Configs grid ---------- */
  .configs{
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 14px;
    margin-top: 4px;
  }
  @media (min-width: 560px){ .configs{ grid-template-columns: repeat(2, minmax(0,1fr)); } }
  @media (min-width: 860px){ .configs{ grid-template-columns: repeat(3, minmax(0,1fr)); } }

  .cfg{
    display: flex; flex-direction: column; gap: 12px;
    padding: 16px;
    background: var(--card);
    border: 1px solid var(--bd);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-card);
    transition: transform .16s var(--ease-out), border-color .16s var(--ease-out), box-shadow .16s var(--ease-out);
  }
  .cfg:hover{ transform: translateY(-2px); border-color: var(--bd2); box-shadow: var(--shadow-card-hover); }
  /* Badge on its own line above the title, so the name and country subtitle
     get the full card width and never get squeezed into a narrow column that
     forces mid-word breaks. */
  .cfg-head{ display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-width: 0; }
  .badge{
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 4px 8px; border-radius: 7px; flex: 0 0 auto; align-self: flex-start;
    border: 1px solid transparent;
  }
  /* Title block: primary name plus an optional country / variant subtitle.
     Takes the full card width and can grow to two lines so the exit country is
     never sacrificed to a single truncated line. */
  .cfg-titles{
    display: flex; flex-direction: column; gap: 2px;
    min-width: 0; width: 100%;
  }
  .cfg-name{
    font-size: 13.5px; font-weight: 600; color: var(--tx); line-height: 1.3;
    /* Wrap up to two lines, then ellipsize, instead of a hard one-line cut.
       Break only at spaces or hyphens, never in the middle of a word. */
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; overflow-wrap: break-word; word-break: normal;
  }
  /* The country / variant line. Never clipped: it wraps fully so the flag and
     country name always stay readable. Breaks at spaces or hyphens only, so a
     token like "shadowsocks-tcp" splits after the hyphen, never mid-word.
     Flag emoji renders at the font size. */
  .cfg-sub{
    font-size: 12.5px; font-weight: 500; color: var(--tx2); line-height: 1.35;
    overflow-wrap: break-word; word-break: normal; min-width: 0;
  }
  .cfg-sub bdi, .cfg-name bdi{ unicode-bidi: isolate; }
  /* Fill the space between the title block and the footer so the QR stays
     vertically centered and copy buttons line up across every card in a row. */
  .cfg-qr{ display: flex; align-items: center; justify-content: center; padding: 2px 0; flex: 1 1 auto; }
  .cfg-foot{ display: flex; gap: 8px; }
  .cfg-foot .btn{ flex: 1 1 auto; min-height: 40px; padding: 9px 12px; font-size: 13.5px; }

  /* ---------- Footer ---------- */
  .foot{
    margin-top: 34px;
    text-align: center;
    color: var(--mu);
  }
  .foot .fmark{ display: inline-flex; align-items: center; gap: 8px; justify-content: center; margin-bottom: 8px; }
  .foot .fmark svg{ width: 20px; height: 20px; }
  .foot .fword{ font-weight: 700; font-size: 14px; background: var(--brand); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .foot .ftag{ font-size: 12px; letter-spacing: 0.02em; }

  /* Social row: stays centered and LTR even under dir="rtl" */
  .fsocial{ display: flex; justify-content: center; gap: 12px; margin-top: 14px; direction: ltr; }
  .fsocial a{ display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border: 1px solid var(--bd); border-radius: 9px; color: var(--mu); transition: border-color .12s, transform .12s; }
  .fsocial a:hover{ border-color: var(--bd2); transform: translateY(-1px); }
  .fsocial svg{ width: 18px; height: 18px; }
  .fsocial a .tg{ color: #229ED9; }
  .fsocial a .ig{ color: #E1306C; }

  /* ---------- Empty state ---------- */
  .empty{
    padding: 40px 24px;
    text-align: center;
  }
  .empty svg{ width: 44px; height: 44px; margin-bottom: 14px; color: var(--mu); }
  .empty h2{ font-size: 18px; margin: 0 0 6px; }
  .empty p{ color: var(--tx2); margin: 0; font-size: 14px; }

  /* ---------- Toast ---------- */
  .toast{
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translate(-50%, 20px);
    background: var(--surface-3);
    color: var(--tx);
    border: 1px solid var(--bd2);
    box-shadow: var(--shadow-pop);
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 13.5px;
    font-weight: 600;
    display: inline-flex; align-items: center; gap: 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s var(--ease-out), transform .2s var(--ease-out);
    z-index: 50;
  }
  .toast.show{ opacity: 1; transform: translate(-50%, 0); }
  .toast svg{ width: 16px; height: 16px; color: var(--ok); }

  /* ---------- Focus + a11y ---------- */
  :focus-visible{ outline: none; box-shadow: var(--ring); border-radius: var(--r-sm); }
  .langtoggle button:focus-visible,
  .imp:focus-visible{ box-shadow: var(--ring); }

  /* Touch devices: grow the small secondary controls (language switch, social
     links) to a comfortable ~40px target. Primary actions are already >=40px. */
  @media (pointer: coarse){
    .langtoggle button{ min-height: 40px; }
    .fsocial a{ width: 40px; height: 40px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition-duration: 0.001ms !important; animation-duration: 0.001ms !important; }
    .track-fill{ transition: none; }
  }
</style>
</head>
