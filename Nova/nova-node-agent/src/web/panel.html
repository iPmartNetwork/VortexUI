/* Rail (collapsed) mode: hide group labels, always show items */
.app.nav-collapsed .nav-group-label { display: none; }
.app.nav-collapsed .nav-toggle .chev { display: none; }
.app.nav-collapsed .nav-toggle > span:not(.chev) { display: none; }
.app.nav-collapsed .nav-toggle { justify-content: center; padding-inline: 0; }
.app.nav-collapsed .nav-group.collapsible .nav-group-body { grid-template-rows: 1fr; opacity: 1; margin-top: 2px; pointer-events: auto; }
@media (prefers-reduced-motion: reduce) {
  .nav-group-body { transition: none; }
}

/* ---- Card head + save footer (network cards) ----------------------------- */
.card-head { padding: 16px 18px 6px; }
.card-head h3 { font-size: 15px; letter-spacing: -.01em; }
.card-head p { color: var(--text-3); font-size: 12.5px; margin-top: 3px; line-height: 1.5; }
.card-foot { padding: 12px 18px 16px; display: flex; }
.card-foot .btn { margin-inline-start: auto; }
.net-body { display: flex; flex-direction: column; }
.net-body > .toggle-row + .toggle-row { border-top: 1px solid var(--border); }
.net-pad { padding: 14px 18px 2px; }
.net-pad .field:last-child { margin-bottom: 8px; }
.net-body > .card-head + .toggle-row,
.net-body > .card-head + .net-pad { border-top: 1px solid var(--border); }
.net-body > .toggle-row + .net-pad,
.net-body > .net-pad + .toggle-row,
.net-body > .net-pad + .net-pad { border-top: 1px solid var(--border); }

/* ---- Select (styled, theme-aware) ---------------------------------------- */
.selwrap { position: relative; }
.selwrap select { width: 100%; min-height: 42px; padding: 10px 34px 10px 12px;
  font: inherit; font-size: 14px; color: var(--text); background: var(--input-bg);
  border: 1px solid var(--border); border-radius: var(--r-sm); appearance: none; cursor: pointer;
  transition: border-color .14s var(--ease-out), box-shadow .14s var(--ease-out); }
.selwrap select:hover:not(:focus) { border-color: var(--border-strong); }
.selwrap select:focus { outline: none; border-color: var(--accent-line); box-shadow: var(--ring); }
.selwrap .selchev { position: absolute; inset-inline-end: 12px; top: 50%; transform: translateY(-50%);
  pointer-events: none; color: var(--text-3); width: 15px; height: 15px; }
html[dir="rtl"] .selwrap select { padding: 10px 12px 10px 34px; }

/* ---- Dashboard KPIs + quick actions -------------------------------------- */
.kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.kpi { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 128px;
  background:
    linear-gradient(180deg, color-mix(in srgb, var(--tile, var(--accent)) 7%, transparent), transparent 58%),
    var(--surface-1);
  border: 1px solid var(--border); border-radius: var(--r-md); padding: 15px 16px 16px;
  box-shadow: var(--shadow-card); overflow: hidden; }
.kpi::before { content: ""; position: absolute; inset-inline: 0; top: 0; height: 3px;
  background: linear-gradient(90deg, var(--tile, var(--accent)),
    color-mix(in srgb, var(--tile, var(--accent)) 35%, transparent)); }
.kpi.span2 { grid-column: span 2; }
.kpi-top { display: flex; align-items: center; gap: 10px; }
.kpi-ic { width: 32px; height: 32px; flex: none; display: grid; place-items: center;
  border-radius: 9px; background: color-mix(in srgb, var(--tile, var(--accent)) 15%, transparent);
  color: var(--tile, var(--accent)); }
.kpi-ic svg { width: 17px; height: 17px; }
.kpi-lbl { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi-body { margin-top: auto; padding-top: 14px; min-width: 0; }
.kpi-val { font-size: 24px; font-weight: 650; letter-spacing: -.02em; line-height: 1.12; color: var(--text);
  font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 9px; min-width: 0; }
.kpi-val .flag { font-size: 21px; line-height: 1; flex: none; }
.kpi-val .kpi-place { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kpi-sub { margin-top: 5px; font-size: 12px; color: var(--text-3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kpi-ip { margin-top: 7px; font-family: var(--font-mono); font-size: 11.5px; color: var(--text-2);
  direction: ltr; word-break: break-all; font-variant-numeric: tabular-nums; }
.kpi .meter { height: 5px; border-radius: 999px; background: var(--surface-3); overflow: hidden; margin-top: 12px; }
.kpi .meter > i { display: block; height: 100%; border-radius: 999px; background: var(--accent); transition: width .6s var(--ease-out); }
.kpi .meter > i.warn { background: var(--warn); }
.kpi .meter > i.bad { background: var(--bad); }
/* Compact variant (Users summary): tiles carry only a label + value, so tighten
   the height and let the value sit right under the label instead of being pinned
   to the bottom of a tall card, which left an empty middle. */
.kpi-grid.compact { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kpi-grid.compact .kpi { min-height: 0; }
.kpi-grid.compact .kpi-body { margin-top: 12px; padding-top: 0; }
@media (max-width: 940px) { .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpi-grid.compact { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpi.span2 { grid-column: auto; } }
@media (max-width: 500px) { .kpi-grid { grid-template-columns: 1fr; } .kpi-grid.compact { grid-template-columns: 1fr; } }
.sec-h { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text-2);
  margin: 26px 2px 12px; }
.qa-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.qa { display: flex; align-items: center; gap: 13px; text-align: start; padding: 15px 16px;
  background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--r-md);
  cursor: pointer; font: inherit; color: var(--text); width: 100%; box-shadow: var(--shadow-card);
  transition: border-color .14s var(--ease-out), background .14s var(--ease-out), box-shadow .14s var(--ease-out), transform .14s var(--ease-out); }
.qa:hover { border-color: var(--border-strong); background: var(--surface-2); box-shadow: var(--shadow-card-hover); transform: translateY(-1px); }
.qa:active { transform: translateY(0); }
.qa .qa-ic { width: 38px; height: 38px; flex: none; display: grid; place-items: center;
  border-radius: 10px; background: color-mix(in srgb, var(--tile, var(--accent)) 15%, transparent);
  color: var(--tile, var(--accent)); }
.qa .qa-ic svg { width: 18px; height: 18px; }
.qa .qa-t { font-weight: 600; font-size: 14px; }
.qa .qa-d { font-size: 12px; color: var(--text-3); margin-top: 2px; line-height: 1.45; }

/* Built-in outbounds: a responsive card grid. Each reserved exit is its own
   elevated tile that carries its hue via --tile (set inline per outbound): a
   glowing medallion, the mono name, a refined BUILT-IN pill, and a one-line
   description. Tiles reflow from three columns to one and lift gently on hover,
   borrowing the inbound-card visual language so the section reads as a premium
   component rather than a bulleted list. */
.bi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(258px, 1fr)); gap: 14px; align-items: stretch; }
.bi-card { position: relative; display: flex; align-items: flex-start; gap: 13px; min-width: 0; height: 100%;
  padding: 16px 17px 16px 19px; border: 1px solid var(--border); border-radius: var(--r-md);
  background:
    radial-gradient(135% 130% at 0% 0%, color-mix(in srgb, var(--tile, var(--accent)) 10%, transparent) 0%, transparent 60%),
    var(--surface-1);
  box-shadow: var(--shadow-card); overflow: hidden;
  transition: transform .18s var(--ease-out), border-color .18s var(--ease-out), box-shadow .18s var(--ease-out); }
.bi-card::before { content: ""; position: absolute; inset-block: 0; inset-inline-start: 0; width: 3px;
  background: linear-gradient(to bottom, var(--tile, var(--accent)), color-mix(in srgb, var(--tile, var(--accent)) 35%, transparent)); }
.bi-card::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  box-shadow: inset 0 1px 0 color-mix(in srgb, #fff 7%, transparent); }
.bi-card:hover { transform: translateY(-2px);
  border-color: color-mix(in srgb, var(--tile, var(--accent)) 40%, var(--border));
  box-shadow: var(--shadow-card-hover), 0 12px 30px -14px color-mix(in srgb, var(--tile, var(--accent)) 52%, transparent); }
@media (prefers-reduced-motion: reduce) { .bi-card:hover { transform: none; } }
.bi-ic { width: 40px; height: 40px; flex: none; display: grid; place-items: center;
  border-radius: 11px; color: var(--tile, var(--accent));
  background: linear-gradient(160deg, color-mix(in srgb, var(--tile, var(--accent)) 26%, transparent), color-mix(in srgb, var(--tile, var(--accent)) 12%, transparent));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tile, var(--accent)) 34%, transparent),
    0 6px 16px -6px color-mix(in srgb, var(--tile, var(--accent)) 46%, transparent); }
.bi-ic svg { width: 18px; height: 18px; }
.bi-card .bi-ic { width: 38px; height: 38px; }
.bi-item-txt { min-width: 0; flex: 1; padding-top: 1px; }
.bi-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.bi-name { font-weight: 600; font-size: 14px; letter-spacing: .01em; color: var(--text); }
.bi-tag { font-size: 9.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; line-height: 1.5;
  color: color-mix(in srgb, var(--tile, var(--accent)) 72%, var(--text-2));
  background: color-mix(in srgb, var(--tile, var(--accent)) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--tile, var(--accent)) 24%, transparent);
  padding: 2px 8px; border-radius: 999px; }
.bi-desc { font-size: 12.5px; color: var(--text-3); margin-top: 4px; line-height: 1.5; text-wrap: pretty; }

/* Custom-outbounds empty state: an on-brand hue chip, title, helper line, and a
   call-to-action that opens the same Add-outbound flow as the header button. */
.out-empty { padding: 34px 22px 30px; }
.out-empty .out-empty-ic { width: 56px; height: 56px; margin: 0 auto 15px; display: grid; place-items: center;
  border-radius: 16px; color: var(--tile, var(--accent));
  background: linear-gradient(160deg, color-mix(in srgb, var(--tile, var(--accent)) 24%, transparent), color-mix(in srgb, var(--tile, var(--accent)) 9%, transparent));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tile, var(--accent)) 30%, transparent),
    0 12px 26px -12px color-mix(in srgb, var(--tile, var(--accent)) 55%, transparent); }
.out-empty .out-empty-ic svg { width: 25px; height: 25px; }

/* Inbound cards: a responsive grid that borrows the built-in-outbound visual
   language (per-hue wash, left hue bar, glowing icon chip, hover lift), adapted
   to carry the enable toggle, edit/delete, and an optional collapsible key/peers
   reveal. Each card sets its own hue via --tile (keyed off protocol/security). */
.inb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; align-items: stretch; }
.inb-card { position: relative; display: flex; flex-direction: column; min-width: 0; height: 100%;
  padding: 15px 17px 13px 19px; border: 1px solid var(--border); border-radius: var(--r-md);
  background:
    radial-gradient(135% 130% at 0% 0%, color-mix(in srgb, var(--tile, var(--accent)) 10%, transparent) 0%, transparent 60%),
    var(--surface-1);
  box-shadow: var(--shadow-card); overflow: hidden;
  transition: transform .18s var(--ease-out), border-color .18s var(--ease-out), box-shadow .18s var(--ease-out); }
.inb-card::before { content: ""; position: absolute; inset-block: 0; inset-inline-start: 0; width: 3px;
  background: linear-gradient(to bottom, var(--tile, var(--accent)), color-mix(in srgb, var(--tile, var(--accent)) 35%, transparent)); }
.inb-card::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  box-shadow: inset 0 1px 0 color-mix(in srgb, #fff 7%, transparent); }
.inb-card:hover { transform: translateY(-2px);
  border-color: color-mix(in srgb, var(--tile, var(--accent)) 40%, var(--border));
  box-shadow: var(--shadow-card-hover), 0 12px 30px -14px color-mix(in srgb, var(--tile, var(--accent)) 52%, transparent); }

.inb-head { display: flex; align-items: flex-start; gap: 13px; flex: none; }
.inb-head .bi-ic { width: 38px; height: 38px; }
.inb-id { min-width: 0; flex: 1; padding-top: 1px; }
.inb-cname { display: flex; align-items: center; gap: 8px; min-width: 0; }
.inb-cname .dot { flex: none; }
.inb-cname .inb-nm { font-weight: 600; font-size: 14px; letter-spacing: .01em; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.inb-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 9px; }
.inb-badge { font-size: 9.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; line-height: 1.5;
  color: color-mix(in srgb, var(--tile, var(--accent)) 72%, var(--text-2));
  background: color-mix(in srgb, var(--tile, var(--accent)) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--tile, var(--accent)) 24%, transparent);
  padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.inb-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; line-height: 1.5;
  color: var(--text-3); background: var(--surface-2); border: 1px solid var(--border);
  padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.inb-chip .k { text-transform: uppercase; letter-spacing: .05em; font-size: 9.5px; color: var(--text-3); }
.inb-chip b { color: var(--text-2); font-weight: 600; }
.inb-chip.mono { text-transform: uppercase; letter-spacing: .03em; }
.inb-frontnote { margin-top: 11px; font-size: 11.5px; line-height: 1.5; color: var(--text-3); }

/* Collapsible key / peers area so Reality and WireGuard cards stay compact. */
.inb-reveal { margin-top: 12px; border-top: 1px solid var(--border); }
.inb-reveal > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px;
  padding: 10px 2px 2px; font-size: 11.5px; font-weight: 600; color: var(--text-2);
  transition: color .15s var(--ease-out); }
.inb-reveal > summary::-webkit-details-marker { display: none; }
.inb-reveal > summary:hover { color: var(--text); }
.inb-reveal > summary:focus-visible { outline: none; box-shadow: var(--ring); border-radius: var(--r-sm); }
.inb-reveal .inb-rv-ic { width: 14px; height: 14px; flex: none; color: color-mix(in srgb, var(--tile, var(--accent)) 78%, var(--text-2)); }
.inb-reveal .inb-rv-ic svg { width: 14px; height: 14px; display: block; }
.inb-reveal .inb-rv-chev { margin-inline-start: auto; display: inline-flex; color: var(--text-3);
  transition: transform .18s var(--ease-out); }
.inb-reveal .inb-rv-chev svg { width: 15px; height: 15px; display: block; }
.inb-reveal[open] > summary .inb-rv-chev { transform: rotate(180deg); }
[dir="rtl"] .inb-reveal .inb-rv-chev { transform: scaleX(-1); }
[dir="rtl"] .inb-reveal[open] > summary .inb-rv-chev { transform: rotate(180deg); }
.inb-rv-body { padding-top: 10px; max-width: 100%; overflow-x: auto; }
.inb-rv-body .inb-wg { padding: 0; }
.inb-rv-body .inb-wg-peer { min-width: 0; }
@media (prefers-reduced-motion: reduce) { .inb-card:hover { transform: none; } .inb-reveal .inb-rv-chev { transition: none; } }

/* Footer: enable toggle on the start side, edit/delete on the end side. */
/* Footer is pinned to the bottom of the (row-stretched) card so the toggle +
   edit/delete bar sits at the same place on every card, reveal or not, and the
   fixed regions never shrink (guards the meta/icon squish). */
.inb-foot { display: flex; align-items: center; gap: 10px; flex: none; margin-top: auto; padding-top: 13px;
  border-top: 1px solid var(--border); }
.inb-foot .switch { margin-inline-end: auto; }

/* ---- Censorship resistance / IP protection ------------------------------- */
/* Verdict pill: reachable (good), blocked (bad), unknown (neutral). Shares the
   op-pill shape but carries its own status colour so it reads at a glance. */
.cr-pill { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 600;
  padding: 4px 11px 4px 9px; border-radius: 999px; border: 1px solid var(--border); white-space: nowrap; flex: none; }
.cr-pill .dot { width: 8px; height: 8px; }
.cr-pill.good { color: var(--good); background: var(--good-soft); border-color: color-mix(in srgb, var(--good) 30%, transparent); }
.cr-pill.good .dot { background: var(--good); }
.cr-pill.bad { color: var(--bad); background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 32%, transparent); }
.cr-pill.bad .dot { background: var(--bad); }
.cr-pill.neutral { color: var(--text-3); background: var(--surface-2); border-color: var(--border); }
.cr-pill.neutral .dot { background: var(--text-3); }

/* Big verdict block on the page: coloured glyph chip + name/description on the
   start side, tested IP and measured time on the end side. */
#cr-result:not(:empty) { border-top: 1px solid var(--border); }
.cr-verdict { display: flex; align-items: center; gap: 14px; padding: 16px 18px; }
.cr-vic { width: 42px; height: 42px; flex: none; display: grid; place-items: center; border-radius: 12px; }
.cr-vic svg { width: 20px; height: 20px; }
.cr-verdict.good .cr-vic { color: var(--good); background: var(--good-soft); }
.cr-verdict.bad .cr-vic { color: var(--bad); background: var(--bad-soft); }
.cr-verdict.neutral .cr-vic { color: var(--text-3); background: var(--surface-2); }
.cr-vmeta { min-width: 0; margin-inline-end: auto; }
.cr-vname { font-weight: 650; font-size: 15px; letter-spacing: -.01em; }
.cr-vdesc { color: var(--text-3); font-size: 12.5px; margin-top: 3px; line-height: 1.5; text-wrap: pretty; }
.cr-vsub { flex: none; text-align: end; font-size: 11.5px; color: var(--text-3); line-height: 1.5; }
.cr-vsub .mono { color: var(--text-2); font-size: 12px; }
.cr-sum { padding: 2px 18px 4px; font-size: 12px; color: var(--text-3); }

/* Explainer items: a soft hue chip, a title and a scannable line of body copy. */
.cr-why { display: grid; gap: 13px; padding: 4px 18px 16px; }
.cr-why-item { display: flex; gap: 12px; }
.cr-why-ic { width: 30px; height: 30px; flex: none; display: grid; place-items: center; border-radius: 9px;
  color: var(--tile, var(--accent)); background: color-mix(in srgb, var(--tile, var(--accent)) 14%, transparent); }
.cr-why-ic svg { width: 16px; height: 16px; }
.cr-why-t { font-weight: 600; font-size: 13.5px; }
.cr-why-b { color: var(--text-3); font-size: 12.5px; margin-top: 2px; line-height: 1.55; text-wrap: pretty; }

/* Guided 3-step checklist. Each step: a numbered (or ticked) badge, copy, a CTA. */
.cr-steps { display: flex; flex-direction: column; }
.cr-step { display: flex; align-items: flex-start; gap: 13px; padding: 15px 18px; }
.cr-step + .cr-step { border-top: 1px solid var(--border); }
.cr-step-num { width: 26px; height: 26px; flex: none; display: grid; place-items: center; border-radius: 50%;
  font-size: 12.5px; font-weight: 700; color: var(--tile, var(--accent));
  background: color-mix(in srgb, var(--tile, var(--accent)) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--tile, var(--accent)) 26%, transparent); }
.cr-step-num svg { width: 15px; height: 15px; }
.cr-step.done .cr-step-num { color: var(--good); background: var(--good-soft); border-color: color-mix(in srgb, var(--good) 30%, transparent); }
.cr-step-body { min-width: 0; margin-inline-end: auto; }
.cr-step-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.cr-step-t { font-weight: 600; font-size: 13.5px; }
.cr-step-b { color: var(--text-3); font-size: 12.5px; margin-top: 3px; line-height: 1.5; text-wrap: pretty; }
.cr-step-cta { flex: none; align-self: center; }
.cr-badge { font-size: 9.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; line-height: 1.6;
  color: var(--good); background: var(--good-soft); border: 1px solid color-mix(in srgb, var(--good) 30%, transparent);
  padding: 2px 8px; border-radius: 999px; }

/* Iran test-point rows in the probe result. */
.cr-nodes { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; padding: 4px 18px 16px; }
.cr-node { display: flex; align-items: center; gap: 9px; padding: 9px 11px; border: 1px solid var(--border);
  border-radius: var(--r-sm); background: var(--surface-1); font-size: 12px; }
.cr-node .dot { width: 8px; height: 8px; }
.cr-node .dot.up { background: var(--good); }
.cr-node .dot.down { background: var(--bad); }
.cr-node .dot.pending { background: var(--text-3); }
.cr-node-name { font-weight: 600; }
.cr-node-detail { margin-inline-start: auto; color: var(--text-3); font-size: 11.5px; }

/* Wizard Reality nudge and dashboard-card body. */
.wiz-rec { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; padding: 11px 13px;
  border-radius: var(--r-sm); font-size: 12.5px; color: var(--text-2);
  background: var(--good-soft); border: 1px solid color-mix(in srgb, var(--good) 28%, transparent); }
.cr-dash-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-3); padding: 2px 18px 6px; }
.cr-dash-row .mono { color: var(--text-2); }
.cr-dash-foot { display: flex; align-items: center; gap: 12px; padding: 12px 18px 16px; }
.cr-dash-hint { margin-inline-end: auto; display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-3); }
.cr-dash-hint svg { width: 15px; height: 15px; flex: none; color: var(--h-violet); }
@media (max-width: 560px) { .cr-verdict { flex-wrap: wrap; } .cr-vsub { text-align: start; } .cr-step-cta { align-self: flex-start; } }

/* ---- Rotate-IP card ------------------------------------------------------ */
.cr-rot-meta { display: grid; gap: 9px; padding: 6px 18px 14px; }
.cr-rot-meta-row { display: flex; align-items: baseline; gap: 12px; font-size: 12.5px; }
.cr-rot-meta-k { color: var(--text-3); flex: none; min-width: 118px; }
.cr-rot-meta-v { color: var(--text-1); font-weight: 600; min-width: 0; word-break: break-all; }
.cr-rot-chk { display: inline-flex; align-items: center; gap: 9px; margin: 10px 0 4px; font-size: 12.5px; color: var(--text-2); cursor: pointer; }
.cr-rot-chk input { width: 16px; height: 16px; flex: none; accent-color: var(--accent); cursor: pointer; }
.cr-rot-result:not(:empty) { border-top: 1px solid var(--border); }
.cr-rot-last { display: flex; align-items: center; gap: 7px; padding: 12px 18px; font-size: 12px; color: var(--text-3); border-top: 1px solid var(--border); }
.cr-rot-last[hidden] { display: none; }
.cr-rot-last svg { width: 14px; height: 14px; flex: none; color: var(--text-3); }
.cr-rot-guide { display: grid; gap: 13px; padding: 14px 18px 6px; border-top: 1px solid var(--border); }
.cr-rot-guide .cr-why-ic { font-size: 13px; font-weight: 700; }

/* ---- Distribution client-app cards --------------------------------------- */
.app-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; align-items: stretch; }
.app-card { display: flex; flex-direction: column; padding: 15px 16px; background: var(--surface-1);
  border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow-card); }
.app-card .ac-t { font-weight: 600; font-size: 14px; }
.app-card .ac-plat { align-self: flex-start; max-width: 100%; margin-top: 8px; font-size: 10.5px; font-weight: 500;
  color: var(--text-3); border: 1px solid var(--border); border-radius: 999px; padding: 3px 9px; line-height: 1.35; }
.app-card .ac-d { font-size: 12.5px; color: var(--text-3); margin-top: 9px; line-height: 1.55; }

/* ---- Guide steps --------------------------------------------------------- */
.guide-step { display: flex; gap: 14px; padding: 16px 18px; }
.guide-step + .guide-step { border-top: 1px solid var(--border); }
.guide-num { width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center;
  font-size: 12px; font-weight: 700; background: var(--accent-soft); color: var(--accent); }
.guide-step h4 { font-size: 14px; font-weight: 600; }
.guide-step p { font-size: 12.5px; color: var(--text-3); margin-top: 4px; line-height: 1.6; }

/* ---- Manual / full guide view ------------------------------------------- */
.gman { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 22px; align-items: start; }
.gman-side { position: sticky; top: 6px; display: flex; flex-direction: column; gap: 12px; }
.gman-search { position: relative; }
.gman-search > svg { position: absolute; inset-inline-start: 12px; top: 50%; transform: translateY(-50%);
  width: 15px; height: 15px; color: var(--text-3); pointer-events: none; }
.gman-search input { width: 100%; height: 38px; padding-inline: 34px 12px; border: 1px solid var(--border);
  border-radius: var(--r-sm); background: var(--input-bg); color: var(--text); font: inherit; font-size: 13px; }
.gman-search input::placeholder { color: var(--text-3); }
.gman-search input:focus-visible { border-color: var(--accent-line); box-shadow: var(--ring); }
.gman-toc { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--r-md);
  box-shadow: var(--shadow-card); padding: 8px; max-height: calc(100vh - 128px); overflow-y: auto;
  scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
.gman-toc-label { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: var(--text-3); padding: 6px 8px 8px; }
.gman-toc button { display: flex; align-items: center; gap: 9px; width: 100%; text-align: start;
  padding: 7px 9px; border: 0; background: none; border-radius: var(--r-sm); color: var(--text-2);
  font: inherit; font-size: 12.5px; font-weight: 500; line-height: 1.35; cursor: pointer; }
.gman-toc button > svg { width: 15px; height: 15px; flex: none; color: var(--text-3); }
.gman-toc button:hover { background: var(--surface-2); color: var(--text); }
.gman-toc button.active { background: var(--accent-soft); color: var(--text); }
.gman-toc button.active > svg { color: var(--accent); }
.gman-main { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.gman-main[hidden] { display: none; }
.gsec { scroll-margin-top: 10px; padding: 20px 22px; }
.gsec-head { display: flex; align-items: center; gap: 12px; margin-bottom: 13px; }
.gsec-ic { width: 34px; height: 34px; flex: none; border-radius: 10px; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent); }
.gsec-ic svg { width: 17px; height: 17px; }
.gsec h3 { font-size: 16px; font-weight: 620; letter-spacing: -0.01em; line-height: 1.25; }
.gsec-body > * + * { margin-top: 11px; }
.gsec-body p { font-size: 13px; line-height: 1.72; color: var(--text-2); max-width: 74ch; }
.gsec-body ul { list-style: none; display: flex; flex-direction: column; gap: 8px; max-width: 74ch; }
.gsec-body li { position: relative; padding-inline-start: 18px; font-size: 13px; line-height: 1.66; color: var(--text-2); }
.gsec-body li::before { content: ""; position: absolute; inset-inline-start: 3px; top: 9px;
  width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.gsec-body b { color: var(--text); font-weight: 620; }
.gman-code { display: flex; align-items: center; gap: 10px; margin-top: 9px; background: var(--surface-2);
  border: 1px solid var(--border); border-radius: var(--r-sm); padding: 8px 8px 8px 12px; }
.gman-code code { flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 12.5px; color: var(--text);
  direction: ltr; unicode-bidi: plaintext; text-align: start; overflow-x: auto; white-space: pre;
  scrollbar-width: thin; }
.gman-code button { flex: none; display: inline-grid; place-items: center; width: 30px; height: 30px;
  border: 1px solid var(--border); background: var(--input-bg); color: var(--text-2); border-radius: var(--r-xs); cursor: pointer; }
.gman-code button svg { width: 14px; height: 14px; }
.gman-code button:hover { color: var(--text); border-color: var(--border-strong); }
.gman-empty { padding: 34px 20px; text-align: center; color: var(--text-3); font-size: 13px; }
@media (max-width: 860px) {
  .gman { grid-template-columns: 1fr; gap: 14px; }
  .gman-side { position: static; }
  .gman-toc { max-height: none; }
}

/* ---- WARP status line ---------------------------------------------------- */
.warp-status { display: flex; align-items: center; gap: 10px; padding: 15px 18px; font-size: 14px; }
.warp-status .dot { width: 9px; height: 9px; }
.warp-actions { padding: 4px 18px 16px; display: flex; gap: 10px; flex-wrap: wrap; }
.warp-actions .btn { flex: 1; min-width: 150px; }

/* ---- WARP+ plan / license -------------------------------------------------- */
.warp-plan { padding: 14px 18px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; }
.warp-plan-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.warp-plan-row .wp-lbl { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--text-2); }
.warp-plan-row .btn { margin-inline-start: auto; }
.warp-plan-meta { display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 12.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.warp-plan-meta span { display: inline-flex; align-items: center; gap: 6px; }
.warp-plan-meta b { color: var(--text-2); font-weight: 600; }
.warp-plan-meta .wp-warn { color: var(--warn); font-weight: 600; }
.warp-lic-err { font-size: 12px; color: var(--bad); }
.warp-lic-note { font-size: 12px; line-height: 1.55; color: var(--text-3); }

/* ---- Tor / Psiphon service status, test and install ------------------------ */
.svc-ctl { display: flex; flex-direction: column; gap: 8px; }
.svc-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.svc-light { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--text-3); }
.svc-light i { width: 9px; height: 9px; border-radius: 50%; background: var(--text-3); flex: none; }
.svc-light[data-state="on"] { color: var(--good); }
.svc-light[data-state="on"] i { background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); }
.svc-light[data-state="warn"] { color: var(--warn); }
.svc-light[data-state="warn"] i { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.svc-light[data-state="off"] { color: var(--text-2); }
.svc-light[data-state="off"] i { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
.svc-actions { display: inline-flex; gap: 8px; margin-inline-start: auto; flex-wrap: wrap; }
.svc-result { font-size: 12.5px; line-height: 1.5; padding: 8px 11px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--surface-2); }
.svc-result.ok { color: var(--good); border-color: color-mix(in srgb, var(--good) 30%, transparent); background: var(--good-soft); }
.svc-result.err { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 30%, transparent); background: var(--bad-soft); }

/* ---- Per-country exits (one exit instance per country) -------------------- */
.geo-sec { border-top: 1px solid var(--border); margin-top: 6px; padding: 15px 18px 16px; }

/* Add bar: an inviting composer, inset into the section so it reads as a control */
.geo-add {
  display: grid;
  grid-template-columns: minmax(120px, .7fr) minmax(170px, 1.3fr) auto;
  gap: 10px; align-items: end;
  padding: 12px; border: 1px solid var(--border); border-radius: var(--r-md);
  background: var(--surface-2);
}
.geo-add .field { margin: 0; }
.geo-add .geo-add-btn { height: 42px; align-self: end; white-space: nowrap; }
.geo-hint { display: flex; align-items: flex-start; gap: 8px; color: var(--text-3); font-size: 12px; line-height: 1.5; margin-top: 12px; }
.geo-hint svg { width: 15px; height: 15px; flex: none; margin-top: 1px; opacity: .8; }

/* Tile grid: evenly sized country tiles that reflow to one column on mobile */
.geo-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(244px, 1fr)); gap: 14px; margin-top: 14px; }

/* Country tile */
.geo-card {
  position: relative;
  display: flex; flex-direction: column;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-card);
  overflow: hidden;
  transition: border-color .16s var(--ease-out), box-shadow .16s var(--ease-out), transform .16s var(--ease-out);
}
.geo-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-card-hover); transform: translateY(-1px); }
.geo-card.is-off { opacity: .82; }

/* Hero: flag medallion + name, with a whisper of service-hue identity */
.geo-hero { display: flex; align-items: flex-start; gap: 12px; padding: 15px 15px 13px; position: relative; }
.geo-hero::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(168deg, var(--geo-tint, transparent), transparent 60%);
}
.geo-card[data-svc="tor"]     { --geo-tint: color-mix(in srgb, var(--h-violet) 12%, transparent); }
.geo-card[data-svc="psiphon"] { --geo-tint: color-mix(in srgb, var(--h-blue) 12%, transparent); }
.geo-card.is-off { --geo-tint: transparent; }

.geo-flag {
  position: relative; flex: none;
  width: 52px; height: 52px; border-radius: var(--r-sm);
  display: grid; place-items: center;
  font-size: 30px; line-height: 1;
  background: var(--surface-3);
  border: 1px solid var(--border);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
}
.geo-flag svg { width: 23px; height: 23px; color: var(--text-3); }
.geo-card.is-off .geo-flag { filter: grayscale(.7); opacity: .78; }

.geo-headline { position: relative; min-width: 0; flex: 1 1 auto; padding-top: 3px; }
.geo-name {
  font-size: 15px; font-weight: 600; color: var(--text); letter-spacing: -.01em;
  line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.geo-sub { display: flex; align-items: center; gap: 7px; margin-top: 7px; flex-wrap: wrap; }
.geo-code { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; color: var(--text-3); font-family: var(--font-mono); }
.geo-port { font-size: 11px; color: var(--text-3); font-family: var(--font-mono); }

/* Service badge (Tor violet, Psiphon blue) */
.geo-badge { display: inline-flex; align-items: center; font-size: 10px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; border: 1px solid transparent; }
.geo-badge.tor { color: var(--h-violet); background: color-mix(in srgb, var(--h-violet) 15%, transparent); border-color: color-mix(in srgb, var(--h-violet) 34%, transparent); }
.geo-badge.psiphon { color: var(--h-blue); background: color-mix(in srgb, var(--h-blue) 15%, transparent); border-color: color-mix(in srgb, var(--h-blue) 34%, transparent); }

/* Status pill: colored dot + label, sits top-right of the hero */
.geo-pill {
  position: relative; flex: none; align-self: flex-start; margin-top: 3px;
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 10.5px; font-weight: 600; white-space: nowrap;
  padding: 3px 9px 3px 7px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface-1); color: var(--text-3);
}
.geo-pill .dot { width: 7px; height: 7px; }
.geo-pill.on   { color: var(--good); border-color: color-mix(in srgb, var(--good) 30%, transparent); background: var(--good-soft); }
.geo-pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 30%, transparent); background: var(--warn-soft); }
.geo-pill .dot.warn { background: var(--warn); }
.geo-pill .dot.off  { background: var(--text-3); }

/* Inline exit-IP test result, framed neatly inside the tile */
.geo-card .svc-result { margin: 0 15px 13px; }

/* Footer: enable toggle on the left, Test / Remove on the right, uncramped */
.geo-foot {
  display: flex; align-items: center; gap: 10px;
  margin-top: auto; padding: 11px 13px 11px 15px;
  border-top: 1px solid var(--border); background: var(--card2);
}
.geo-foot .switch { flex: none; }
.geo-acts { display: inline-flex; align-items: center; gap: 6px; margin-inline-start: auto; }
.geo-acts .geo-test { white-space: nowrap; }

/* Empty state: a friendly framed prompt, never a bare gap */
.geo-empty {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  gap: 3px; padding: 30px 20px; margin-top: 14px;
  border: 1px dashed var(--border-strong); border-radius: var(--r-md);
  background: var(--surface-2);
}
.geo-empty .geo-empty-ic { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: var(--card2); border: 1px solid var(--border); color: var(--text-3); margin-bottom: 8px; }
.geo-empty .geo-empty-ic svg { width: 18px; height: 18px; }
.geo-empty .geo-empty-t { font-size: 13.5px; font-weight: 600; color: var(--text-2); }
.geo-empty .geo-empty-d { font-size: 12.5px; color: var(--text-3); line-height: 1.5; max-width: 44ch; text-wrap: pretty; }

@media (max-width: 560px) {
  .geo-add { grid-template-columns: 1fr 1fr; }
  .geo-add .geo-add-btn { grid-column: 1 / -1; }
  .geo-list { grid-template-columns: 1fr; }
}

/* ---- AmneziaWG server card ----------------------------------------------- */
.awg-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; padding-bottom: 4px; }
.awg-peers { border-top: 1px solid var(--border); margin-top: 4px; padding: 4px 18px 16px; }
.awg-peers-head { display: flex; align-items: center; gap: 8px; padding: 13px 0 5px; }
.awg-peers-head .flabel { margin: 0; }
.awg-count { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--surface-3); color: var(--text-2); font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.awg-empty { color: var(--text-3); font-size: 12.5px; padding: 6px 0 2px; }
.awg-peer { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 0; }
.awg-peer + .awg-peer { border-top: 1px solid var(--border); }
.awg-peer-main { min-width: 0; }
.awg-peer-name { font-size: 13.5px; font-weight: 500; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.awg-peer-meta { display: flex; align-items: center; gap: 7px; margin-top: 3px; }
.awg-peer-meta .mono { font-size: 12px; color: var(--text-3); }
.awg-peer-meta .dot { width: 7px; height: 7px; }
.awg-peer-hs { font-size: 11.5px; color: var(--text-3); }
.awg-peer-act { display: flex; gap: 6px; flex: none; }
.awg-add { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
.awg-add .input { flex: 1; min-width: 0; }
.awg-add .btn { flex: none; }

/* ---- Dashboard AmneziaWG: per-client QR cards ---------------------------- */
.dash-awg-grid {
  border-top: 1px solid var(--border);
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 14px;
  padding: 16px 18px 18px;
}
.dash-awg-empty { border-top: 1px solid var(--border); padding: 16px 18px 18px; }
.dash-awg-empty p { color: var(--text-3); font-size: 12.5px; margin-bottom: 12px; }

.dash-awg-item {
  display: flex; flex-direction: column;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 13px;
}
.dash-awg-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.dash-awg-badge {
  flex: none; width: 34px; height: 34px; border-radius: var(--r-sm);
  display: grid; place-items: center;
  font-size: 15px; font-weight: 600; line-height: 1; text-transform: uppercase;
  color: var(--awgb);
  background: color-mix(in srgb, var(--awgb) 16%, transparent);
}
.dash-awg-id { min-width: 0; }
.dash-awg-name {
  font-size: 13.5px; font-weight: 600; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.dash-awg-meta { display: flex; align-items: center; gap: 7px; margin-top: 3px; min-width: 0; }
.dash-awg-meta .mono { font-size: 11.5px; color: var(--text-3); flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.dash-awg-meta .dot { width: 7px; height: 7px; flex: none; }
.dash-awg-hs { font-size: 11px; color: var(--text-3); white-space: nowrap; flex: none; }

.dash-awg-qr {
  margin: 13px 0;
  background: #ffffff;
  border-radius: var(--r-sm);
  padding: 12px;
  aspect-ratio: 1 / 1;
  display: grid; place-items: center;
}
.dash-awg-qr svg { width: 100%; height: 100%; display: block; }
.dash-awg-qr p { color: #6b7280; font-size: 11.5px; text-align: center; padding: 10px; margin: 0; }

.dash-awg-act { display: flex; flex-direction: column; gap: 8px; }
.dash-awg-act .btn { width: 100%; }

.dash-awg-help {
  margin-top: 11px; align-self: center;
  background: none; border: 0; padding: 4px 6px;
  font: inherit; font-size: 11.5px; color: var(--text-3);
  cursor: pointer;
  transition: color .12s var(--ease-out);
}
.dash-awg-help:hover { color: var(--accent); }

/* ---- Sidebar social row (Nova admin footer) ------------------------------ */
/* Icons keep LTR order and centering even under [dir="rtl"]. */
.social { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; direction: ltr; }
.social a, .social button { display: grid; place-items: center; height: 34px; padding: 0; border-radius: var(--r-sm);
  border: 1px solid var(--border); background: var(--card2); color: var(--text-2); cursor: pointer; font: inherit;
  transition: color .12s var(--ease-out), border-color .12s var(--ease-out), transform .12s var(--ease-out); }
.social a:hover, .social button:hover { border-color: var(--bd2); transform: translateY(-1px); }
.social a svg, .social button svg { width: 18px; height: 18px; }
.social a.s-tg { color: #229ED9; }
.social a.s-ig { color: #E1306C; }
.app.nav-collapsed .social { grid-template-columns: 1fr 1fr; }

/* ---- Dashboard: status pill ---------------------------------------------- */
.op-pill { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 600;
  letter-spacing: .02em; color: var(--good); background: var(--good-soft);
  border: 1px solid color-mix(in srgb, var(--good) 30%, transparent); padding: 5px 12px; border-radius: 999px; }
.op-pill .dot { width: 8px; height: 8px; }
.op-pill.off { color: var(--text-3); background: var(--surface-2); border-color: var(--border); }

/* ---- Dashboard: two-column grid ------------------------------------------ */
.dash-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 14px; align-items: stretch; margin-top: 14px; }
/* Both columns flex to equal height, so whichever card has less content fills
 * its own surface instead of leaving a bare page void beside the taller card. */
.dash-grid > .card { margin-top: 0; min-width: 0; display: flex; flex-direction: column; }
.dash-grid > .card > #act-mini { flex: 1 1 auto; }
@media (max-width: 760px) { .dash-grid { grid-template-columns: 1fr; align-items: start; } }

/* ---- Dashboard: policy footer -------------------------------------------- */
.policy-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 13px 18px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-3); }
.policy-foot .btn { flex: none; }

/* ---- Dashboard: activity feed -------------------------------------------- */
.activity { display: flex; gap: 12px; padding: 13px 18px; }
.activity + .activity { border-top: 1px solid var(--border); }
.activity .ai { width: 32px; height: 32px; flex: none; border-radius: 9px; display: grid; place-items: center;
  background: var(--card2); border: 1px solid var(--border); color: var(--accent); }
.activity .ai svg { width: 15px; height: 15px; }
.activity .ab { min-width: 0; flex: 1; }
.activity .ab .ttl { font-size: 12.5px; font-weight: 600; }
.activity .ab .mt { font-size: 11px; color: var(--text-3); margin-top: 2px; direction: ltr; unicode-bidi: plaintext;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
html[dir="rtl"] .activity .ab .mt { text-align: start; }
.activity .tm { font-size: 11px; color: var(--text-3); white-space: nowrap; flex: none; }

/* ---- Dashboard: traffic chart -------------------------------------------- */
.chart-card .card-head { display: flex; align-items: flex-end; gap: 10px; }
.chart-wrap { padding: 10px 14px 12px; }
.chart-wrap canvas { display: block; width: 100%; height: 168px; }
.chart-x { display: flex; justify-content: space-between; padding: 8px 4px 0; font-size: 10.5px; color: var(--text-3);
  font-variant-numeric: tabular-nums; direction: ltr; }

/* ---- Dashboard: resource gauges (CPU / RAM / Disk) ----------------------- *
 * Three radial 270-degree arc gauges in one responsive row. Each is a small
 * card: a ring that fills to the current percent, the number in its center,
 * then a label and the raw used/total detail beneath. Colour follows the same
 * calm-accent / amber / red thresholds the KPI meters used. */
.gauge-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
/* Grid gap handles spacing; cancel the global `.card + .card` top margin so the
 * second and third gauges stay aligned with the first. */
.gauge-row > .card { margin-top: 0; }
.gauge-card { position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; text-align: center;
  padding: 18px 16px 16px;
  background:
    radial-gradient(120% 80% at 50% -10%, color-mix(in srgb, var(--g-hue, var(--accent)) 9%, transparent), transparent 60%),
    var(--surface-1); }
.gauge-card::before { content: ""; position: absolute; inset-inline: 0; top: 0; height: 3px;
  background: linear-gradient(90deg, var(--g-hue, var(--accent)),
    color-mix(in srgb, var(--g-hue, var(--accent)) 30%, transparent)); }
.gauge { position: relative; width: 128px; height: 128px; flex: none; }
.gauge .gauge-skel { position: absolute; inset: 8px; border-radius: 50%; }
.gauge-svg { width: 100%; height: 100%; display: block; }
.gauge-svg .g-track, .gauge-svg .g-fill { fill: none; stroke-width: 11; }
.gauge-svg .g-track { stroke: var(--surface-3); }
.gauge-svg .g-fill { stroke: var(--g-hue, var(--accent)); transition: stroke-dasharray .6s var(--ease-out); }
.gauge-svg.warn .g-fill { stroke: var(--warn); }
.gauge-svg.bad .g-fill { stroke: var(--bad); }
.gauge-svg.na .g-fill { stroke: transparent; }
.gauge-center { position: absolute; inset: 0; display: grid; place-items: center; }
.gauge-pct { font-size: 27px; font-weight: 650; letter-spacing: -.02em; color: var(--text);
  font-variant-numeric: tabular-nums; line-height: 1; }
.gauge-pct i { font-style: normal; font-size: 15px; font-weight: 600; color: var(--text-3); margin-inline-start: 1px; }
.gauge-pct.na { font-size: 16px; color: var(--text-3); font-weight: 600; }
.gauge-meta { margin-top: 14px; min-width: 0; width: 100%; }
.gauge-label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); }
.gauge-detail { margin-top: 4px; font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 620px) { .gauge-row { grid-template-columns: 1fr; } }

/* ---- Dashboard: server uptime stat --------------------------------------- */
.uptime-card { display: flex; align-items: center; gap: 14px; padding: 16px 18px; }
.uptime-card .kpi-ic { width: 34px; height: 34px; flex: none; display: grid; place-items: center;
  border-radius: 10px; background: var(--card2); border: 1px solid var(--border); color: var(--accent); }
.uptime-card .kpi-ic svg { width: 17px; height: 17px; }
.uptime-meta { margin-inline-end: auto; min-width: 0; }
.uptime-meta .kpi-lbl { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); }
.uptime-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.uptime-val { font-size: 22px; font-weight: 650; letter-spacing: -.01em; color: var(--text);
  font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---- Dashboard: compact system status tiles + management shortcuts -------- *
 * A tidy grid of small stat tiles (xray, uptimes, load, connections, host) that
 * sits under the gauges. Reuses the same icon-chip + label/value language as the
 * uptime card, so it reads as one system rather than a new component. */
.stat-card .card-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.stat-card .card-head h3 { margin-inline-end: auto; }
.dash-mgmt { display: flex; gap: 8px; flex-wrap: wrap; }
.stat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 12px 18px 18px; }
.stat { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-width: 0;
  border: 1px solid var(--border); border-radius: var(--r-md);
  background:
    linear-gradient(180deg, color-mix(in srgb, var(--tile, var(--accent)) 6%, transparent), transparent 72%),
    var(--surface-1); }
.stat-ic { width: 32px; height: 32px; flex: none; display: grid; place-items: center; border-radius: 10px;
  background: color-mix(in srgb, var(--tile, var(--accent)) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--tile, var(--accent)) 26%, transparent);
  color: var(--tile, var(--accent)); }
.stat-ic svg { width: 16px; height: 16px; }
.stat-body { min-width: 0; }
.stat-lbl { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); }
.stat-val { font-size: 15px; font-weight: 600; color: var(--text); margin-top: 3px; letter-spacing: -.01em;
  font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-val.good { color: var(--good); }
.stat-val.bad { color: var(--bad); }
@media (max-width: 780px) { .stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 460px) { .stat-grid { grid-template-columns: 1fr; } }

/* ---- Network: compact anti-censorship toggle grid + Advanced disclosure --- */
.rt-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 14px 18px; }
.rt-grid .toggle-row { border: 1px solid var(--border); border-radius: var(--r-sm); padding: 11px 13px; gap: 10px; }
.net-body > .card-head + .rt-grid { border-top: 1px solid var(--border); }
@media (max-width: 560px) { .rt-grid { grid-template-columns: 1fr; } }
.rt-adv { border-top: 1px solid var(--border); }
.rt-adv .rt-grid { padding-top: 12px; }
.rt-adv > summary { list-style: none; cursor: pointer; padding: 13px 18px; font-size: 13px; font-weight: 600;
  color: var(--text-2); display: flex; align-items: center; gap: 8px; user-select: none; }
.rt-adv > summary::-webkit-details-marker { display: none; }
.rt-adv > summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid currentColor;
  border-bottom: 2px solid currentColor; transform: rotate(-45deg); transition: transform .18s var(--ease-out); flex: none; }
.rt-adv[open] > summary { color: var(--text); }
.rt-adv[open] > summary::before { transform: rotate(45deg); }
/* Anti-censorship master switch and the block it gates */
.rt-master.toggle-row { padding: 15px 18px; }
.rt-master .tr-name { font-weight: 600; }
.rt-gran { display: flex; flex-direction: column; border-top: 1px solid var(--border); transition: opacity .18s var(--ease-out); }
.rt-gran.is-off { opacity: .45; }
.rt-gran.is-off .toggle-row,
.rt-gran.is-off .rt-adv { pointer-events: none; }
.rt-gran-note { display: flex; align-items: center; gap: 8px; padding: 11px 18px; font-size: 12px; color: var(--text-3);
  border-top: 1px solid var(--border); background: var(--surface-2); }
.rt-gran-note svg { width: 15px; height: 15px; flex: none; color: var(--text-3); }
/* Maintenance: version + update-check state */
.m-ver { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-bottom: 15px; }
.m-ver-info { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-inline-end: auto; }
.m-ver-label { color: var(--text-3); font-size: 12.5px; }
.m-ver-num { font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--text); }
.m-ver-status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--text-2); }
.m-ver-status svg { width: 14px; height: 14px; }
.m-ver-status.ok, .m-ver-status.ok svg { color: var(--good); }
.m-ver-status.muted { color: var(--text-3); font-weight: 500; }
.m-ver-status.muted svg { color: var(--text-3); }
.m-ver-status .spinner { width: 13px; height: 13px; }
.m-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; letter-spacing: .02em;
  color: var(--accent); background: var(--accent-soft); border: 1px solid var(--accent-line); padding: 3px 9px; border-radius: 999px; }
.m-badge svg { width: 12px; height: 12px; }
.m-ver-latest { font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; color: var(--accent); }

/* ---- Dashboard: open-in-app QR ------------------------------------------- */
.openapp { display: flex; align-items: center; gap: 18px; padding: 16px 18px; flex-wrap: wrap; }
.openapp .qr { background: #fff; border-radius: var(--r-md); padding: 10px; line-height: 0; flex: none; border: 1px solid var(--border); }
.openapp .qr svg { width: 120px; height: 120px; display: block; }
.openapp .oa-body { flex: 1; min-width: 200px; }
.openapp .oa-body .oa-t { font-size: 14px; font-weight: 600; }
.openapp .oa-body .oa-d { font-size: 12.5px; color: var(--text-3); margin-top: 3px; line-height: 1.5; }
.openapp .oa-body .copyfield { margin-top: 12px; }

/* ---- Dashboard: open-in-app multi-format QR cards ------------------------ *
 * One card per subscription format (Auto / Base64 / Clash), mirroring the
 * main Nova panel: letter badge, name, recommended pill, muted hint, a QR on
 * a fixed-white panel, a full-width primary button and a slim secondary.
 * Built entirely on the panel tokens so light/dark and RTL come for free; the
 * QR panel keeps a fixed light background on purpose (QR needs dark-on-light). */
.oa-fmt-wrap { padding: 16px 18px 18px; }
.oa-lead { font-size: 12.5px; color: var(--text-3); line-height: 1.5; margin-bottom: 14px; max-width: 640px; text-wrap: pretty; }
.oa-fmt-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.oa-fmt { display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface-1); box-shadow: var(--shadow-card); }
.oa-fmt.rec { border-color: var(--ac-line); }
.oa-fmt-h { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.oa-fmt-badge { flex: none; width: 30px; height: 30px; border-radius: var(--r-sm); display: grid; place-items: center; color: #fff; font-size: 14px; font-weight: 700; line-height: 1; }
.oa-fmt-name { font-size: 14px; font-weight: 600; color: var(--text); margin-inline-end: auto; }
.oa-fmt-pill { flex: none; font-size: 9.5px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--ac); background: var(--ac-soft); border: 1px solid var(--ac-line); padding: 2px 7px; border-radius: 999px; line-height: 1.5; }
.oa-fmt-hint { font-size: 11.5px; color: var(--text-3); margin-top: -3px; }
.oa-fmt-qr { background: #fff; border-radius: var(--r-sm); padding: 10px; line-height: 0; border: 1px solid var(--border); display: grid; place-items: center; }
.oa-fmt-qr svg { width: 100%; max-width: 148px; height: auto; display: block; }
.oa-fmt-qrerr { font-size: 11px; color: #333; text-align: center; padding: 20px 8px; line-height: 1.4; }
.oa-fmt-acts { display: flex; gap: 8px; margin-top: auto; }
.oa-fmt-primary { flex: 1 1 auto; min-width: 0; }
.oa-fmt-copy { flex: none; }

/* ---- Dashboard balance: compact Resistance Policy rows -------------------- *
 * The two-column area holds only Resistance Policy (left) and Recent activity
 * (right); Quick actions is a full-width row below. Tightening the policy toggle
 * rows into a compact settings list keeps the left card close in height to the
 * activity card so the two columns end near each other, not one far shorter. */
.policy-compact .toggle-row { padding-top: 9px; padding-bottom: 10px; }
.policy-compact .tr-desc { margin-top: 1px; }
.policy-compact .policy-foot { padding-top: 11px; padding-bottom: 11px; }

/* Automation card: an indented sub-toggle that dims and locks while its parent
 * switch is off, so the dependency reads at a glance. */
.auto-sub.toggle-row { padding-inline-start: 44px; transition: opacity .18s var(--ease-out); }
.auto-sub .tr-name { font-weight: 450; }
.auto-sub.is-off { opacity: .42; }
.auto-sub.is-off .switch { pointer-events: none; }

/* ---- Traffic chart: up/down legend + Down/Up/Total summary ---------------- */
.chart-legend { margin-inline-start: auto; display: flex; align-items: center; gap: 14px; }
.chart-legend .lg { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-3); white-space: nowrap; }
.chart-legend .lg i { width: 9px; height: 9px; border-radius: 2px; flex: none; }
.chart-legend .lg-down i { background: var(--ac); }
.chart-legend .lg-up i { background: var(--ac2); }
.chart-summary { display: flex; flex-wrap: wrap; gap: 5px 18px; padding: 4px 14px 12px; font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.chart-summary span { display: inline-flex; align-items: center; gap: 6px; }
.chart-summary b { color: var(--text); font-weight: 600; }
@media (max-width: 480px) { .chart-legend { gap: 10px; } }

/* ---- Online-device pill on a user row ------------------------------------ */
.uname-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.uname-row .uname-main { min-width: 0; }
.online-pill { display: inline-flex; align-items: center; gap: 5px; flex: none; font-size: 11px; font-weight: 600;
  color: var(--ok); background: var(--ok-soft); border: 1px solid color-mix(in srgb, var(--ok) 30%, transparent);
  padding: 1px 8px; border-radius: 999px; }
.online-pill i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex: none; }

/* ---- Backup & maintenance actions + form footer (Notifications) ---------- */
.maint-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.form-foot { padding: 12px 18px 16px; display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--border); flex-wrap: wrap; }

/* --- Data table (API tokens, admins, nodes, fleet users) ------------------ *
 * A light, token-scoped table that reads as part of the same card language:
 * quiet header row, hairline separators, mono for machine values, a trailing
 * actions column. It scrolls horizontally inside its own wrapper so the page
 * body never does. */
.dtable-wrap { overflow-x: auto; }
.dtable { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.dtable th { text-align: start; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.dtable td { padding: 12px 14px; border-top: 1px solid var(--border); color: var(--text-2); vertical-align: middle; }
.dtable tbody tr:first-child td { border-top: 0; }
.dtable .t-name { color: var(--text); font-weight: 500; }
.dtable .t-sub { color: var(--text-3); font-size: 11.5px; margin-top: 2px; }
.dtable .mono { font-family: var(--font-mono); font-size: 11.5px; direction: ltr; unicode-bidi: plaintext; }
.dtable .t-actions { text-align: end; white-space: nowrap; }
.dtable .t-actions .btn { vertical-align: middle; }
.dtable .t-actions .btn + .btn { margin-inline-start: 4px; }
.dtable tr.is-muted td { color: var(--text-3); }

/* Status / role badge, built from the same recipe as .dtls-pill. */
.tbadge { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; white-space: nowrap; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--border); }
.tbadge.is-good { color: var(--good); background: var(--good-soft); border-color: color-mix(in srgb, var(--good) 30%, transparent); }
.tbadge.is-bad { color: var(--bad); background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
.tbadge.is-warn { color: var(--warn); background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.tbadge.is-accent { color: var(--accent); background: var(--accent-soft); border-color: var(--accent-line); }
.tbadge.is-mgr { color: var(--h-blue); background: color-mix(in srgb, var(--h-blue) 14%, transparent); border-color: color-mix(in srgb, var(--h-blue) 34%, transparent); }
.tbadge i { width: 6px; height: 6px; border-radius: 999px; background: currentColor; flex: none; }

/* Role segmented control with a description under each option (Tunnel). */
.role-seg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px; }
.role-seg button { text-align: start; padding: 12px 14px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--input-bg); color: var(--text-2); cursor: pointer; transition: border-color .12s var(--ease-out), background .12s var(--ease-out); }
.role-seg button:hover { border-color: var(--border-strong); }
.role-seg button[aria-checked="true"] { border-color: var(--accent-line); background: var(--accent-soft); }
.role-seg .rs-name { font-weight: 600; font-size: 13px; color: var(--text); }
.role-seg button[aria-checked="true"] .rs-name { color: var(--accent); }
.role-seg .rs-desc { font-size: 11.5px; color: var(--text-3); margin-top: 3px; line-height: 1.45; }
@media (max-width: 560px) { .role-seg { grid-template-columns: 1fr; } }

/* Generate-secret row: text input plus an inline generate button (Tunnel, tokens). */
.gen-row { display: flex; gap: 8px; align-items: stretch; }
.gen-row .input { flex: 1; min-width: 0; }
.gen-row .btn { flex: none; }

/* Grouped form subheading + paired fields (tunnel setup and similar). */
.fg-h { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  color: var(--text-3); margin: 2px 0 14px; }
.field-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 6px 14px; }
.field-row > .field { margin-bottom: 14px; }

/* --- Hysteria2 UDP port (Protocols view) --- */
.hy2-port { padding: 14px 18px 16px; border-top: 1px solid var(--border); }
.card > .hy2-port:first-child { border-top: 0; }
.hy2-port-main { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.hy2-port-main label { font-size: 12.5px; font-weight: 500; color: var(--text-2); }
.hy2-port-main input.input { width: 120px; min-width: 96px; flex: none; }
.hy2-port.is-off { opacity: .55; }
.hy2-port + .toggle-row { border-top: 1px solid var(--border); }

/* --- Per-ISP client optimization editor (Settings view) --- */
.isp-loading { display: flex; align-items: center; gap: 9px; color: var(--text-3); font-size: 13px; padding: 6px 0 10px; }
.isp-sub { border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--card2); padding: 14px; margin-bottom: 12px; }
.isp-sub-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.isp-sub-title { font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); }
.isp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.isp-grid .field { margin-bottom: 0; }
.isp-grid .span2 { grid-column: 1 / -1; }
.isp-toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.isp-toggle > label:first-child { margin-bottom: 0; }
.isp-actions { display: flex; margin: 2px 0 4px; }
.isp-foot { display: flex; justify-content: space-between; gap: 8px; padding: 12px 18px 16px; border-top: 1px solid var(--border); flex-wrap: wrap; }
@media (max-width: 560px) { .isp-grid { grid-template-columns: 1fr; } }

/* ---- Focus consistency: keyboard rings win over component elevation ------- *
 * Interactive cards, chips, presets and nav items carry their own box-shadows,
 * which would otherwise outrank the global :focus-visible ring. Re-assert the
 * ring on them (source-last, matching specificity) so keyboard focus is always
 * visible. Also lets the lifted primary button keep its glow at rest but show a
 * clean ring on focus. */
.btn:focus-visible,
.qa:focus-visible,
.inb-preset:focus-visible,
.sni-chip:focus-visible,
.nav-item:focus-visible,
.nav-collapse:focus-visible,
.side-logout:focus-visible,
.social a:focus-visible,
.social button:focus-visible,
.dash-awg-help:focus-visible,
.uname.clickable:focus-visible { outline: none; box-shadow: var(--ring); }

/* ---- Cloudflare "Get a token" helper (Domain & TLS card) ----------------- */
.cf-token-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 6px; }
.cf-token-row label { margin-bottom: 0; }
.cf-getlink { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; color: var(--accent); text-decoration: none; padding: 3px 7px; border-radius: 999px; border: 1px solid var(--accent-line); background: var(--accent-soft); white-space: nowrap; transition: background .12s var(--ease-out); }
.cf-getlink:hover { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.cf-getlink svg { width: 13px; height: 13px; }
.cf-steps { list-style: none; counter-reset: cfstep; margin: 10px 0 12px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.cf-steps li { counter-increment: cfstep; display: flex; gap: 10px; align-items: flex-start; font-size: 12px; color: var(--text-2); line-height: 1.5; }
.cf-steps li::before { content: counter(cfstep); flex: none; width: 19px; height: 19px; border-radius: 50%; display: grid; place-items: center; font-size: 10.5px; font-weight: 700; background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-line); margin-top: 1px; }

/* ---- Setup wizard -------------------------------------------------------- */
.wiz-modal { max-width: 560px; }
.wiz-steps { display: flex; align-items: center; gap: 7px; padding: 14px 18px 0; }
.wiz-dot { height: 4px; flex: 1; border-radius: 999px; background: var(--border-strong); transition: background .2s var(--ease-out); }
.wiz-dot.done { background: color-mix(in srgb, var(--accent) 55%, transparent); }
.wiz-dot.active { background: var(--accent); }
.wiz-stepno { padding: 12px 18px 0; font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); }
.wiz-body { padding: 8px 18px 18px; overflow-y: auto; }
.wiz-icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); border: 1px solid var(--accent-line); color: var(--accent); margin-bottom: 14px; }
.wiz-icon svg { width: 23px; height: 23px; }
.wiz-body h4 { font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
.wiz-lead { font-size: 13px; color: var(--text-3); line-height: 1.6; margin-top: 8px; }
.wiz-note { display: flex; gap: 8px; align-items: flex-start; font-size: 11.5px; color: var(--text-3); line-height: 1.55; margin-top: 14px; padding: 10px 12px; background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--r-sm); }
.wiz-note svg { width: 15px; height: 15px; flex: none; color: var(--h-blue); margin-top: 1px; }
.wiz-choices { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.wiz-result { display: flex; gap: 9px; align-items: flex-start; font-size: 12.5px; line-height: 1.5; margin-top: 14px; padding: 11px 13px; border-radius: var(--r-sm); border: 1px solid var(--border); }
.wiz-result svg { width: 16px; height: 16px; flex: none; margin-top: 1px; }
.wiz-result.ok { color: var(--good); background: var(--good-soft); border-color: color-mix(in srgb, var(--good) 28%, transparent); }
.wiz-result.bad { color: var(--bad); background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 28%, transparent); }
.wiz-sub { margin-top: 16px; }
.wiz-sub .qr-wrap { margin-bottom: 12px; }
.wiz-sub .qr-wrap svg { width: 150px; height: 150px; }
.wiz-sum { list-style: none; margin: 16px 0 0; padding: 0; border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; }
.wiz-sum li { display: flex; align-items: center; gap: 11px; padding: 12px 14px; }
.wiz-sum li + li { border-top: 1px solid var(--border); }
.wiz-sum .ws-dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.wiz-sum .ws-dot svg { width: 13px; height: 13px; }
.wiz-sum .ws-dot.ok { color: var(--good); background: var(--good-soft); }
.wiz-sum .ws-dot.skip { color: var(--text-3); background: var(--surface-1); }
.wiz-sum .ws-txt { min-width: 0; flex: 1; }
.wiz-sum .ws-k { display: block; font-size: 12.5px; font-weight: 600; color: var(--text); }
.wiz-sum .ws-v { display: block; font-size: 11.5px; color: var(--text-3); margin-top: 2px; }
.wiz-foot { display: flex; align-items: center; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--border); }
.wiz-foot .wf-spacer { flex: 1; }
@media (max-width: 480px) { .wiz-foot { flex-wrap: wrap; } .wiz-foot .btn { flex: 1; } .wiz-foot .wf-spacer { display: none; } }

/* Dashboard "finish setup" banner (shows on an unconfigured node). */
.setup-banner { display: flex; align-items: center; gap: 14px; padding: 15px 18px; margin-bottom: 16px; border-radius: var(--r-md); border: 1px solid var(--accent-line); background: linear-gradient(120deg, var(--accent-soft), color-mix(in srgb, var(--accent) 5%, transparent)); }
.setup-banner .sb-ic { width: 38px; height: 38px; flex: none; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.setup-banner .sb-ic svg { width: 20px; height: 20px; }
.setup-banner .sb-txt { min-width: 0; flex: 1; }
.setup-banner .sb-t { font-size: 13.5px; font-weight: 650; color: var(--text); }
.setup-banner .sb-d { font-size: 12px; color: var(--text-2); margin-top: 2px; line-height: 1.5; }
.setup-banner .sb-act { display: flex; align-items: center; gap: 6px; flex: none; }
@media (max-width: 620px) { .setup-banner { flex-wrap: wrap; } .setup-banner .sb-act { width: 100%; } .setup-banner .sb-act .btn:first-child { flex: 1; } }

/* ---- Health check (diagnostics) modal ------------------------------------ */
.hc-loading { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 34px 20px; color: var(--text-3); font-size: 13px; }
.hc-loading .spinner { width: 22px; height: 22px; color: var(--accent); }
.hc-overall { display: flex; align-items: center; gap: 11px; padding: 13px 15px; border-radius: var(--r-md); border: 1px solid var(--border); margin-bottom: 14px; }
.hc-overall .hc-ov-ic { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; }
.hc-overall .hc-ov-ic svg { width: 17px; height: 17px; }
.hc-overall .hc-ov-t { font-size: 14px; font-weight: 650; }
.hc-overall .hc-ov-d { font-size: 11.5px; color: var(--text-3); margin-top: 1px; }
.hc-overall.ok { background: var(--good-soft); border-color: color-mix(in srgb, var(--good) 26%, transparent); }
.hc-overall.ok .hc-ov-ic { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.hc-overall.ok .hc-ov-t { color: var(--good); }
.hc-overall.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 26%, transparent); }
.hc-overall.warn .hc-ov-ic { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.hc-overall.warn .hc-ov-t { color: var(--warn); }
.hc-overall.fail { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 26%, transparent); }
.hc-overall.fail .hc-ov-ic { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.hc-overall.fail .hc-ov-t { color: var(--bad); }
.hc-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; }
.hc-check { display: flex; align-items: flex-start; gap: 11px; padding: 12px 14px; }
.hc-check + .hc-check { border-top: 1px solid var(--border); }
.hc-check .hc-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; margin-top: 5px; }
.hc-check .hc-dot.ok { background: var(--good); }
.hc-check .hc-dot.warn { background: var(--warn); }
.hc-check .hc-dot.fail { background: var(--bad); }
.hc-check .hc-name { font-size: 13px; font-weight: 600; color: var(--text); }
.hc-check .hc-detail { font-size: 11.5px; color: var(--text-3); margin-top: 2px; line-height: 1.5; }
/* Configs & ports (health-check section + Firewall & ports card) */
.hc-sech { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 20px 0 8px; }
.hc-sech .hc-secl { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 650; color: var(--text); }
.hc-sech .hc-secl svg { width: 16px; height: 16px; flex: none; color: var(--text-3); }
.hc-sech .hc-sum { font-size: 11.5px; color: var(--text-3); flex: none; }
.hc-fw { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border: 1px solid var(--border); border-radius: var(--r-md); margin-bottom: 10px; font-size: 12.5px; color: var(--text-2); }
.hc-fw .hc-fw-ic { width: 28px; height: 28px; flex: none; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); color: var(--text-3); }
.hc-fw .hc-fw-ic svg { width: 15px; height: 15px; }
.hc-fw .hc-fw-txt { min-width: 0; }
.hc-fw b { color: var(--text); font-weight: 600; }
.hc-fw .hc-fw-note { display: block; font-size: 11px; color: var(--text-3); margin-top: 2px; line-height: 1.45; }
.hc-fw .hc-fw-state { font-weight: 600; }
.hc-fw .hc-fw-state.on { color: var(--good); }
.hc-fw .hc-fw-state.off { color: var(--text-3); }
.hc-prow { display: flex; align-items: flex-start; gap: 11px; padding: 12px 14px; flex-wrap: wrap; }
.hc-prow + .hc-prow { border-top: 1px solid var(--border); }
.hc-prow .hc-pdot { width: 9px; height: 9px; border-radius: 50%; flex: none; margin-top: 5px; }
.hc-prow .hc-pdot.ok { background: var(--good); }
.hc-prow .hc-pdot.warn { background: var(--warn); }
.hc-prow .hc-pdot.fail { background: var(--bad); }
.hc-prow .hc-pmain { flex: 1 1 190px; min-width: 0; }
.hc-prow .hc-pname { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; font-weight: 600; color: var(--text); }
.hc-prow .hc-preason { font-size: 11.5px; color: var(--text-3); margin-top: 3px; line-height: 1.5; }
.hc-port { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .02em; color: var(--text-2);
  background: var(--surface-2); border: 1px solid var(--border); padding: 1px 7px; border-radius: 999px;
  white-space: nowrap; direction: ltr; unicode-bidi: plaintext; }
.hc-pill { font-size: 9.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 999px; white-space: nowrap; flex: none; align-self: center; }
.hc-pill.ok { color: var(--good); background: var(--good-soft); border: 1px solid color-mix(in srgb, var(--good) 26%, transparent); }
.hc-pill.warn { color: var(--warn); background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 26%, transparent); }
.hc-pill.fail { color: var(--bad); background: var(--bad-soft); border: 1px solid color-mix(in srgb, var(--bad) 26%, transparent); }
.hc-pfix { flex-basis: 100%; margin-top: 2px; }
.fwp-res { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 7px; }
.fwp-res li { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--text-2);
  background: var(--surface-2); border: 1px solid var(--border); padding: 4px 10px; border-radius: 999px; }
.fwp-res .fwp-port { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-3); direction: ltr; unicode-bidi: plaintext; }
.fwp-inuse { font-size: 9px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--warn);
  background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 26%, transparent); padding: 1px 6px; border-radius: 999px; }
.fwp-body { padding: 14px 18px 18px; }
.fwp-callout { display: flex; align-items: center; gap: 11px; flex-wrap: wrap; margin-top: 12px; padding: 11px 14px;
  border-radius: var(--r-sm); background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); font-size: 12.5px; color: var(--text-2); }
.fwp-callout svg { width: 16px; height: 16px; flex: none; color: var(--warn); }
.fwp-callout .fwp-co-txt { flex: 1 1 160px; min-width: 0; }
.fwp-reshead { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--text-3); margin-top: 16px; }
</style>
