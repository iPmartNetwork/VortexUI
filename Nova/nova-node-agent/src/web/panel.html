нные минуты.","Самый быстрый путь - мастер настройки на панели управления (плитка «Мастер настройки»). Он проведёт вас через необязательный домен, рекомендуемый протокол и первого пользователя, а затем выдаст ссылку на подписку. Всё, что делает мастер, можно сделать и вручную в разделах ниже.","Совет: нажмите Cmd/Ctrl+K в любом месте панели, чтобы открыть поиск и перейти на любую страницу."]}},{id:"dashboard",icon:"dash",title:{en:"Dashboard",fa:"داشبورد",ru:"Панель управления"},body:{en:["The live status of your node: CPU, memory and disk gauges, uptime, active connections, the running Xray version, and a traffic chart.",'Quick actions let you jump straight to creating an inbound, adding a user, opening settings, or the Setup wizard. Use "Run health check" here to verify everything is working. If a service is down or the certificate is expiring, this is where you notice.'],fa:["وضعیت زندهٔ نود شما: نمودارهای پردازنده، حافظه و دیسک، مدت روشن‌بودن، اتصال‌های فعال، نسخهٔ در حال اجرای Xray و نمودار ترافیک.","کارهای سریع به شما اجازه می‌دهند مستقیم به ساخت ورودی، افزودن کاربر، باز کردن تنظیمات یا دستیار راه‌اندازی بروید. از دکمهٔ «اجرای بررسی سلامت» همین‌جا استفاده کنید تا مطمئن شوید همه‌چیز کار می‌کند. اگر سرویسی از کار بیفتد یا گواهی رو به انقضا باشد، همین‌جا متوجه می‌شوید."],ru:["Текущее состояние узла: индикаторы процессора, памяти и диска, время работы, активные подключения, запущенная версия Xray и график трафика.","Быстрые действия позволяют сразу перейти к созданию входящего подключения, добавлению пользователя, открытию настроек или мастеру настройки. Кнопка «Запустить проверку состояния» здесь же подтверждает, что всё работает. Если служба остановлена или истекает срок сертификата, вы заметите это именно здесь."]}},{id:"users",icon:"users",title:{en:"Users",fa:"کاربران",ru:"Пользователи"},body:{en:['Each user is a person or device that can connect. Add a user with the "Add user" button and set:',{ul:["**Name.**","**Volume (GB):** the total data cap. 0 means unlimited.","**Expiry (days after first connection):** the clock starts when they first connect; leave 0 for no expiry.","**Upload limit / Download limit (GB):** optional per-direction caps.","**Device limit:** how many devices (distinct IPs) may connect at once. 0 means no limit. Turn on IP-limit enforcement in settings for it to be enforced.","**Data reset:** no reset, or reset the used data every day, week, or month.","**Inbounds this user may use:** pick which protocols and inbounds are included in the user's subscription. By default a new user gets everything."]},"Each row has four icons: Edit, Delete, Link (copies the user's subscription link), and QR (shows it as a QR code). Share the link or QR with the user; they import it once into their client (v2rayNG, Clash Meta, sing-box, Streisand, and similar) and it auto-updates. When the user opens the same link in a browser they see a friendly page with their usage and every config."],fa:["هر کاربر یک شخص یا دستگاه است که می‌تواند متصل شود. با دکمهٔ «افزودن کاربر» یک کاربر بسازید و این‌ها را تنظیم کنید:",{ul:["**نام.**","**حجم (گیگابایت):** سقف کل داده. مقدار ۰ یعنی نامحدود.","**انقضا (روز پس از اولین اتصال):** شمارش از نخستین اتصال کاربر آغاز می‌شود؛ برای بدون انقضا مقدار ۰ بگذارید.","**سقف آپلود / سقف دانلود (گیگابایت):** محدودیت اختیاری برای هر جهت.","**محدودیت دستگاه:** چند دستگاه (IP مجزا) هم‌زمان می‌توانند متصل شوند. مقدار ۰ یعنی بدون محدودیت. برای اعمال آن، اعمال محدودیت IP را در تنظیمات روشن کنید.","**بازنشانی داده:** بدون بازنشانی، یا بازنشانی دادهٔ مصرف‌شده به‌صورت روزانه، هفتگی یا ماهانه.","**ورودی‌های مجاز این کاربر:** انتخاب کنید کدام پروتکل‌ها و ورودی‌ها در اشتراک کاربر گنجانده شوند. به‌صورت پیش‌فرض، کاربر جدید همه را دریافت می‌کند."]},"هر ردیف چهار آیکون دارد: ویرایش، حذف، لینک (لینک اشتراک کاربر را کپی می‌کند) و QR (آن را به‌صورت کد QR نشان می‌دهد). لینک یا QR را با کاربر به اشتراک بگذارید؛ او یک‌بار آن را در کلاینت خود (v2rayNG، Clash Meta، sing-box، Streisand و مانند آن) وارد می‌کند و به‌صورت خودکار به‌روزرسانی می‌شود. وقتی کاربر همان لینک را در مرورگر باز کند، صفحه‌ای ساده با میزان مصرف و همهٔ کانفیگ‌هایش می‌بیند."],ru:["Каждый пользователь - это человек или устройство, которое может подключаться. Добавьте пользователя кнопкой «Добавить пользователя» и задайте:",{ul:["**Имя.**","**Объём (ГБ):** общий лимит трафика. 0 означает без ограничений.","**Срок действия (дней после первого подключения):** отсчёт начинается с первого подключения; оставьте 0, чтобы срок не истекал.","**Лимит отдачи / загрузки (ГБ):** необязательные ограничения по каждому направлению.","**Лимит устройств:** сколько устройств (разных IP) могут подключаться одновременно. 0 означает без ограничений. Чтобы он действовал, включите контроль лимита IP в настройках.","**Сброс трафика:** без сброса либо сброс израсходованных данных каждый день, неделю или месяц.","**Разрешённые входящие подключения:** выберите, какие протоколы и входящие подключения войдут в подписку пользователя. По умолчанию новый пользователь получает все."]},"В каждой строке четыре значка: изменить, удалить, ссылка (копирует ссылку подписки пользователя) и QR (показывает её в виде QR-кода). Поделитесь ссылкой или QR с пользователем; он один раз импортирует её в свой клиент (v2rayNG, Clash Meta, sing-box, Streisand и подобные), и она обновляется автоматически. Когда пользователь откроет ту же ссылку в браузере, он увидит удобную страницу со своим расходом и всеми конфигурациями."]}},{id:"inbounds",icon:"inbounds",title:{en:"Inbounds",fa:"ورودی‌ها",ru:"Входящие подключения"},body:{en:["Inbounds are the entry points clients connect to. The front protocols (VLESS, VMess and Trojan on 443, and Hysteria2) are always available. Add a standalone inbound for anything else, each on its own port:",{ul:["**VLESS-Reality:** the best default for Iran. It borrows a real site's TLS handshake (the SNI you pick, for example www.cloudflare.com) so it resists deep packet inspection, and it needs no domain or certificate.","**gRPC, XHTTP, HTTPUpgrade and WebSocket** transports, over TLS or Reality.","**Shadowsocks-2022.**","**WireGuard:** a native WireGuard inbound (different from WARP and from AmneziaWG). Set a UDP port and add peers by name; the panel generates each peer's keys and a ready-to-import .conf you can download or show as a QR. Do not put it on a port another service already uses (for example the AmneziaWG port).","**Hysteria2** on extra UDP ports (for port-hopping)."]},"Each inbound also has an Outbound (egress) selector: choose where its traffic leaves (Direct, WARP, Tor, Psiphon, or a custom outbound). Reality keys and Shadowsocks passwords are generated for you. Assign an inbound to all users or a chosen few."],fa:["ورودی‌ها نقاط ورودی هستند که کلاینت‌ها به آن‌ها متصل می‌شوند. پروتکل‌های اصلی (VLESS، VMess و Trojan روی پورت ۴۴۳ و Hysteria2) همیشه در دسترس‌اند. برای هر چیز دیگری یک ورودی مستقل، هرکدام روی پورت خودش، اضافه کنید:",{ul:["**VLESS-Reality:** بهترین گزینهٔ پیش‌فرض برای ایران. دست‌دادن TLS یک سایت واقعی را قرض می‌گیرد (همان SNI که انتخاب می‌کنید، مثلاً www.cloudflare.com) تا در برابر بازرسی عمیق بسته‌ها مقاوم باشد و به دامنه یا گواهی نیاز ندارد.","**ترنسپورت‌های gRPC، XHTTP، HTTPUpgrade و WebSocket** روی TLS یا Reality.","**Shadowsocks-2022.**","**WireGuard:** یک ورودی بومی WireGuard (متفاوت از WARP و از AmneziaWG). یک پورت UDP تعیین کنید و همتاها را با نام اضافه کنید؛ پنل کلیدهای هر همتا و یک فایل .conf آمادهٔ ورود می‌سازد که می‌توانید دانلود کنید یا به‌صورت QR نشان دهید. آن را روی پورتی که سرویس دیگری از آن استفاده می‌کند نگذارید (برای مثال پورت AmneziaWG).","**Hysteria2** روی پورت‌های UDP اضافی (برای پرش پورت)."]},"هر ورودی یک انتخابگر خروجی هم دارد: انتخاب کنید ترافیکش از کجا خارج شود (مستقیم، WARP، Tor، Psiphon یا یک خروجی سفارشی). کلیدهای Reality و رمزهای Shadowsocks برای شما ساخته می‌شوند. یک ورودی را به همهٔ کاربران یا تعدادی منتخب اختصاص دهید."],ru:["Входящие подключения - это точки входа, к которым подключаются клиенты. Основные протоколы (VLESS, VMess и Trojan на 443 и Hysteria2) доступны всегда. Для всего остального добавьте отдельное входящее подключение, каждое на своём порту:",{ul:["**VLESS-Reality:** лучший вариант по умолчанию для Ирана. Он заимствует TLS-рукопожатие настоящего сайта (выбранный вами SNI, например www.cloudflare.com), поэтому устойчив к глубокой проверке пакетов и не требует домена или сертификата.","**Транспорты gRPC, XHTTP, HTTPUpgrade и WebSocket** поверх TLS или Reality.","**Shadowsocks-2022.**","**WireGuard:** нативное входящее подключение WireGuard (отличается от WARP и от AmneziaWG). Задайте UDP-порт и добавьте пиров по имени; панель создаёт ключи каждого пира и готовый к импорту файл .conf, который можно скачать или показать в виде QR. Не размещайте его на порту, который уже занят другой службой (например, портом AmneziaWG).","**Hysteria2** на дополнительных UDP-портах (для прыжков по портам)."]},"У каждого входящего подключения есть также выбор исходящего пути: укажите, откуда выходит его трафик (напрямую, WARP, Tor, Psiphon или пользовательский исходящий). Ключи Reality и пароли Shadowsocks создаются за вас. Назначьте входящее подключение всем пользователям или выбранным."]}},{id:"outbounds",icon:"outbound",title:{en:"Outbounds",fa:"خروجی‌ها",ru:"Исходящие подключения"},body:{en:["Outbounds are the paths traffic can leave the node through. The built-ins are Direct (straight out), Block (drop), WARP, Tor, and Psiphon.","On this page you can also create custom outbounds: a SOCKS or HTTP upstream (to chain through another server), Freedom, Blackhole, or a raw Xray outbound object for anything advanced. Once created, a custom outbound can be assigned to an inbound (in the inbound editor) or targeted by a routing rule.","Example: send one inbound out through Tor for a changing exit IP while the rest go direct."],fa:["خروجی‌ها مسیرهایی هستند که ترافیک می‌تواند از نود خارج شود. خروجی‌های آماده عبارت‌اند از مستقیم (خروج مستقیم)، مسدود (حذف)، WARP، Tor و Psiphon.","در این صفحه می‌توانید خروجی‌های سفارشی هم بسازید: یک upstream از نوع SOCKS یا HTTP (برای زنجیره‌کردن از طریق سرور دیگر)، Freedom، Blackhole، یا یک شیء خام خروجی Xray برای موارد پیشرفته. پس از ساخت، یک خروجی سفارشی را می‌توان به یک ورودی (در ویرایشگر ورودی) اختصاص داد یا در یک قانون مسیریابی هدف قرار داد.","مثال: یک ورودی را از طریق Tor خارج کنید تا IP خروج متغیر داشته باشد، در حالی که بقیه مستقیم می‌روند."],ru:["Исходящие подключения - это пути, по которым трафик покидает узел. Встроенные: напрямую (прямой выход), блокировка (сброс), WARP, Tor и Psiphon.","На этой странице можно также создавать пользовательские исходящие: восходящий SOCKS или HTTP (чтобы связать цепочкой через другой сервер), Freedom, Blackhole или сырой объект исходящего Xray для чего-то продвинутого. После создания пользовательский исходящий можно назначить входящему подключению (в редакторе входящих) или указать в правиле маршрутизации.","Пример: направьте одно входящее подключение через Tor для меняющегося исходящего IP, а остальные пусть идут напрямую."]}},{id:"routing",icon:"route",title:{en:"Routing",fa:"مسیریابی",ru:"Маршрутизация"},body:{en:["Routing decides where each kind of traffic goes. The anti-censorship toggles cover the common cases:",{ul:["**Direct Iran / domestic bypass:** .ir sites and Iranian IPs go direct on the user's client, so they keep their real Iranian IP for domestic sites while everything else goes through Nova. These rules are delivered to the client's config.","**Bypass China or Russia, block ads, block porn, block BitTorrent, block QUIC.**","**Extra exits:** WARP (Cloudflare egress), Tor, and Psiphon. Enabling one adds the outbound; to actually route traffic through it, either turn on its toggle or set an inbound's Outbound to it. Tor and Psiphon must be installed and running on the server (use the Test and Install buttons here to check and set them up).",'**Custom rules:** one rule per line, in the form "matcher outbound", where the matcher is a domain, geosite:category, geoip:country, an IP or CIDR, or protocol:bittorrent.',"**Secure DNS** (resolve on the node) and **anti-sanction DNS** (reach filtered sites)."]}],fa:["مسیریابی تعیین می‌کند هر نوع ترافیک به کجا برود. کلیدهای ضدسانسور موارد رایج را پوشش می‌دهند:",{ul:["**عبور مستقیم ایران / دور زدن داخلی:** سایت‌های .ir و IPهای ایران روی کلاینت کاربر به‌صورت مستقیم می‌روند، بنابراین برای سایت‌های داخلی IP واقعی ایرانی خود را حفظ می‌کنند و بقیهٔ ترافیک از Nova عبور می‌کند. این قوانین به کانفیگ کلاینت تحویل داده می‌شوند.","**دور زدن چین یا روسیه، مسدودکردن تبلیغات، مسدودکردن محتوای مستهجن، مسدودکردن BitTorrent، مسدودکردن QUIC.**","**خروج‌های اضافی:** WARP (خروج از Cloudflare)، Tor و Psiphon. روشن‌کردن هرکدام خروجی مربوطه را اضافه می‌کند؛ برای اینکه ترافیک واقعاً از آن عبور کند، یا کلیدش را روشن کنید یا خروجی یک ورودی را روی آن بگذارید. Tor و Psiphon باید روی سرور نصب و در حال اجرا باشند (از دکمه‌های آزمایش و نصب همین‌جا برای بررسی و راه‌اندازی استفاده کنید).","**قوانین سفارشی:** هر خط یک قانون، به شکل «matcher outbound»، که در آن matcher می‌تواند یک دامنه، geosite:category، geoip:country، یک IP یا CIDR، یا protocol:bittorrent باشد.","**DNS امن** (تفکیک نام روی نود) و **DNS ضدتحریم** (دسترسی به سایت‌های فیلترشده)."]}],ru:["Маршрутизация определяет, куда идёт каждый вид трафика. Переключатели обхода цензуры покрывают типовые случаи:",{ul:["**Прямой доступ для Ирана / внутренний обход:** сайты .ir и иранские IP идут напрямую на клиенте пользователя, поэтому для внутренних сайтов сохраняется реальный иранский IP, а всё остальное идёт через Nova. Эти правила передаются в конфигурацию клиента.","**Обход Китая или России, блокировка рекламы, блокировка порно, блокировка BitTorrent, блокировка QUIC.**","**Дополнительные выходы:** WARP (выход через Cloudflare), Tor и Psiphon. Включение любого из них добавляет исходящий; чтобы трафик действительно шёл через него, включите его переключатель или укажите его как исходящий для входящего подключения. Tor и Psiphon должны быть установлены и запущены на сервере (используйте здесь кнопки «Проверить» и «Установить» для проверки и настройки).","**Пользовательские правила:** одно правило на строку, в виде «matcher outbound», где matcher - это домен, geosite:category, geoip:country, IP или CIDR либо protocol:bittorrent.","**Безопасный DNS** (разрешение имён на узле) и **DNS против санкций** (доступ к заблокированным сайтам)."]}]}},{id:"network",icon:"globe",title:{en:"Network and IPs (Domain and SSL)",fa:"شبکه و IPها (دامنه و SSL)",ru:"Сеть и IP (домен и SSL)"},body:{en:["This is where you add a custom domain and get a free SSL certificate. A fresh node runs on its IP with a self-signed certificate (clients use allowInsecure). Add a domain for a trusted certificate:",{ul:["**Let's Encrypt:** point your domain's DNS at the server's IP, type the domain, and click Set up domain. Xray steps aside automatically during issuance, so you do not need to free port 80 yourself. Renews automatically.",'**Cloudflare (recommended):** connect Cloudflare once by pasting a scoped API token (use the "Get a token" helper: it opens Cloudflare, you pick the "Edit zone DNS" template and your zone). Then Nova creates the DNS record and issues the certificate for you, with no port 80 and with wildcard support. Fully automatic and hands-off on renewal.',"**Origin certificate:** paste a Cloudflare Origin certificate and key."]},"When a domain is set, it applies across the board: every user's subscription link and all TLS inbounds use the new certificate. This page also holds Secure DNS, anti-censorship, clean IPs, and per-node limits."],fa:["اینجا جایی است که یک دامنهٔ سفارشی اضافه می‌کنید و یک گواهی SSL رایگان می‌گیرید. یک نود تازه روی IP خود با یک گواهی خودامضا اجرا می‌شود (کلاینت‌ها از allowInsecure استفاده می‌کنند). برای یک گواهی مورد اعتماد یک دامنه اضافه کنید:",{ul:["**Let's Encrypt:** DNS دامنهٔ خود را به IP سرور اشاره دهید، دامنه را وارد کنید و روی «راه‌اندازی دامنه» بزنید. Xray هنگام صدور گواهی به‌صورت خودکار کنار می‌رود، پس لازم نیست خودتان پورت ۸۰ را آزاد کنید. تمدید به‌صورت خودکار انجام می‌شود.","**Cloudflare (پیشنهادی):** یک‌بار با چسباندن یک توکن API با دسترسی محدود، Cloudflare را متصل کنید (از دستیار «دریافت توکن» استفاده کنید: Cloudflare را باز می‌کند، شما قالب «Edit zone DNS» و zone خود را انتخاب می‌کنید). سپس Nova رکورد DNS را می‌سازد و گواهی را برای شما صادر می‌کند، بدون نیاز به پورت ۸۰ و با پشتیبانی از wildcard. کاملاً خودکار و بدون دخالت در تمدید.","**گواهی Origin:** یک گواهی و کلید Origin از Cloudflare را بچسبانید."]},"وقتی یک دامنه تنظیم شود، همه‌جا اعمال می‌شود: لینک اشتراک هر کاربر و همهٔ ورودی‌های TLS از گواهی جدید استفاده می‌کنند. این صفحه DNS امن، ضدسانسور، IPهای تمیز و محدودیت‌های هر نود را هم در خود دارد."],ru:["Здесь вы добавляете собственный домен и получаете бесплатный сертификат SSL. Новый узел работает на своём IP с самоподписанным сертификатом (клиенты используют allowInsecure). Добавьте домен для доверенного сертификата:",{ul:["**Let's Encrypt:** направьте DNS вашего домена на IP сервера, введите домен и нажмите «Настроить домен». Xray автоматически уступает место во время выпуска, поэтому освобождать порт 80 самому не нужно. Продлевается автоматически.","**Cloudflare (рекомендуется):** подключите Cloudflare один раз, вставив API-токен с ограниченными правами (используйте помощник «Получить токен»: он открывает Cloudflare, вы выбираете шаблон «Edit zone DNS» и свою зону). Затем Nova создаёт DNS-запись и выпускает сертификат за вас, без порта 80 и с поддержкой wildcard. Полностью автоматически и без участия при продлении.","**Сертификат Origin:** вставьте сертификат и ключ Cloudflare Origin."]},"Когда домен задан, он применяется везде: ссылка подписки каждого пользователя и все входящие подключения по TLS используют новый сертификат. На этой странице также находятся безопасный DNS, обход цензуры, чистые IP и лимиты для узла."]}},{id:"tunnel",icon:"tunnel",title:{en:"Tunnel (Iran bridge to foreign exit)",fa:"تونل (پل ایران به خروج خارجی)",ru:"Туннель (мост в Иране к зарубежному выходу)"},body:{en:["If Iran throttles the direct link to your foreign server, put a cheap server inside Iran in front of it. Clients connect to the clean Iran IP and their traffic tunnels out to your real Nova exit abroad. There is a full step-by-step wizard on the page. The steps:",{ul:["Pick a backend, transport, tunnel port and a shared token, once, on this foreign panel.","Set this foreign server as the Exit: those settings plus the Bridge address (the Iran server's IP and port).","Click Generate the Iran bridge command and run it on the Iran VPS. It installs only the tunnel, no full Nova or panel needed there. Then open the tunnel port, 443 and 8443/udp in the Iran firewall.","Point clients at the Iran server (set the foreign node's Host to the Iran IP)."]},"Backends: Backhaul and BackPack are recommended (widest transports, carry UDP so Hysteria2 keeps working); rathole is lightweight; wstunnel hides behind a CDN. Both sides must match on backend, transport, port, and token."],fa:["اگر ایران لینک مستقیم به سرور خارجی شما را کند کند، یک سرور ارزان داخل ایران جلوی آن قرار دهید. کلاینت‌ها به IP تمیز ایران متصل می‌شوند و ترافیکشان از طریق تونل به خروج واقعی Nova شما در خارج می‌رود. یک دستیار کامل قدم‌به‌قدم روی همین صفحه هست. مراحل:",{ul:["یک‌بار یک بک‌اند، ترنسپورت، پورت تونل و یک توکن مشترک را همین‌جا روی پنل خارج انتخاب کنید.","این سرور خارج را به‌عنوان خروج (Exit) تنظیم کنید: همان تنظیمات به‌علاوهٔ آدرس پل (IP و پورت سرور ایران).","روی «ساخت دستور پل ایران» کلیک کنید و آن را روی وی‌پی‌اس ایران اجرا کنید. فقط تونل را نصب می‌کند و نیازی به نصب کامل Nova یا پنل روی آن نیست. سپس پورت تونل، 443 و 8443/udp را در فایروال ایران باز کنید.","کلاینت‌ها را به سرور ایران بفرستید (میزبان نود خارجی را روی IP ایران بگذارید)."]},"بک‌اند‌ها: Backhaul و BackPack پیشنهاد می‌شوند (بیشترین ترنسپورت‌ها، UDP را حمل می‌کنند پس Hysteria2 به کار خود ادامه می‌دهد)؛ rathole سبک است؛ wstunnel پشت یک CDN پنهان می‌شود. هر دو طرف باید در بک‌اند، ترنسپورت، پورت و توکن یکسان باشند."],ru:["Если Иран замедляет прямой канал к вашему зарубежному серверу, поставьте перед ним дешёвый сервер внутри Ирана. Клиенты подключаются к чистому иранскому IP, а их трафик по туннелю выходит на ваш настоящий выход Nova за рубежом. На странице есть полный пошаговый мастер. Шаги:",{ul:["Выберите один раз бэкенд, транспорт, порт туннеля и общий токен, здесь, на зарубежной панели.","Назначьте этот зарубежный сервер выходом (Exit): те же настройки плюс адрес моста (IP и порт иранского сервера).","Нажмите «Сгенерировать команду для иранского моста» и запустите её на иранском VPS. Она ставит только туннель, полная установка Nova или панель там не нужны. Затем откройте порт туннеля, 443 и 8443/udp в фаерволе Ирана.","Направьте клиентов на иранский сервер (укажите в поле Host зарубежного узла иранский IP)."]},"Бэкенды: рекомендуются Backhaul и BackPack (самый широкий выбор транспортов, несут UDP, поэтому Hysteria2 продолжает работать); rathole лёгкий; wstunnel прячется за CDN. Обе стороны должны совпадать по бэкенду, транспорту, порту и токену."]}},{id:"nodes",icon:"nodes",title:{en:"Nodes (fleet)",fa:"نودها (ناوگان)",ru:"Узлы (несколько серверов)"},body:{en:["Run more than one server from one panel, without setting up a panel on every server.",'**Add a node with one command (easiest).** On the Nodes page, click "Generate command". You get a single line to run on a fresh Ubuntu or Debian VPS. That server installs in managed-node mode: it has no panel of its own (just a plain page, no sign-in), registers itself with this panel automatically, and is then driven entirely from here. The command works once and expires in 24 hours, so generate a fresh one for each node.','**Add a node manually.** Open "Add a node manually" and enter another Nova server\'s address and an API token from that server (create one in Settings > API tokens on that server). If that server has no domain (a self-signed certificate), turn on "This node has no domain" so this panel can reach it.',"Either way, this panel then lists and manages every node's users alongside yours and can create users on any node. Each node keeps serving traffic even if this panel is offline. Useful if you or a reseller runs several servers."],fa:["بیش از یک سرور را از یک پنل اجرا کنید، بدون اینکه روی هر سرور یک پنل راه‌اندازی کنید.","**افزودن نود با یک دستور (ساده‌ترین راه).** در صفحهٔ نودها روی «ساخت دستور» بزنید. یک خط دستور می‌گیرید که روی یک سرور تازهٔ Ubuntu یا Debian اجرا می‌کنید. آن سرور در حالت نود مدیریت‌شده نصب می‌شود: پنل جداگانه‌ای ندارد (فقط یک صفحهٔ ساده، بدون ورود)، خودش را به‌طور خودکار به این پنل ثبت می‌کند و از همین‌جا کنترل می‌شود. این دستور فقط یک‌بار کار می‌کند و بعد از ۲۴ ساعت منقضی می‌شود، پس برای هر نود یک دستور تازه بسازید.","**افزودن دستی نود.** بخش «افزودن دستی نود» را باز کنید و آدرس یک سرور Nova دیگر و یک توکن API از آن سرور را وارد کنید (روی همان سرور در تنظیمات > توکن‌های API یکی بسازید). اگر آن سرور دامنه ندارد (گواهی self-signed دارد)، گزینهٔ «این نود دامنه ندارد» را روشن کنید تا این پنل بتواند به آن دسترسی پیدا کند.","در هر دو حالت، این پنل کاربران همهٔ نودها را در کنار کاربران شما فهرست و مدیریت می‌کند و می‌تواند روی هر نود کاربر بسازد. هر نود حتی اگر این پنل آفلاین باشد به سرویس‌دهی ادامه می‌دهد. زمانی مفید است که شما یا یک نماینده چند سرور را اداره می‌کنید."],ru:["Управляйте несколькими серверами из одной панели, не устанавливая панель на каждом сервере.","**Добавить узел одной командой (проще всего).** На странице «Узлы» нажмите «Сгенерировать команду». Вы получите одну строку для запуска на новом VPS с Ubuntu или Debian. Этот сервер установится в режиме управляемого узла: у него нет собственной панели (только простая страница без входа), он сам регистрируется в этой панели и затем управляется полностью отсюда. Команда действует один раз и истекает через 24 часа, поэтому для каждого узла создавайте новую.","**Добавить узел вручную.** Откройте «Добавить узел вручную» и введите адрес другого сервера Nova и API-токен с него (создайте его на том сервере в разделе «Настройки > Токены API»). Если у сервера нет домена (самоподписанный сертификат), включите «У этого узла нет домена», чтобы панель могла к нему обращаться.","В любом случае эта панель отображает и ведёт пользователей всех узлов вместе с вашими и может создавать пользователей на любом узле. Каждый узел продолжает обслуживать трафик, даже если панель офлайн. Полезно, если вы или реселлер держите несколько серверов."]}},{id:"settings",icon:"gear",title:{en:"Settings",fa:"تنظیمات",ru:"Настройки"},body:{en:["General connection details and node basics:",{ul:["**Host and WebSocket path,** the subscription URL (share it to import every user's config at once), and the protocol switches (VLESS, VMess, Trojan, Hysteria2, WireGuard).","**Panel access:** hide the panel behind a secret path, so it answers only at https://your-server/&lt;path&gt;/ and every other address shows a plain 404. A fresh install already sets a random secret path. You can change it, clear it back to the root, or give the panel its own extra HTTPS port here. If you ever lose the path, run nova-passwd over SSH and it prints the current panel URL.","**Two-factor authentication:** protect sign-in with a 6-digit code from Google Authenticator (see Security).","**Automation:** automatic backups, Telegram alerts, automatic updates, and clean-IP refresh (see Automation).","**Per-ISP client optimization:** Nova clients auto-tune fingerprint and fragmentation per carrier."]},"Settings also holds the API tokens, Admins, Notifications, and Info sub-tabs."],fa:["جزئیات کلی اتصال و پایه‌های نود:",{ul:["**میزبان و مسیر WebSocket،** آدرس اشتراک (آن را به اشتراک بگذارید تا کانفیگ همهٔ کاربران یک‌جا وارد شود) و کلیدهای پروتکل (VLESS، VMess، Trojan، Hysteria2، WireGuard).","**دسترسی به پنل:** پنل را پشت یک مسیر مخفی پنهان کنید تا فقط روی https://your-server/&lt;path&gt;/ پاسخ دهد و هر آدرس دیگری یک صفحهٔ ساده ۴۰۴ نشان دهد. یک نصب تازه از همان ابتدا یک مسیر مخفی تصادفی می‌گذارد. همین‌جا می‌توانید آن را عوض کنید، به ریشه برگردانید، یا به پنل یک پورت HTTPS اضافه بدهید. اگر مسیر را گم کردید، nova-passwd را روی SSH اجرا کنید تا آدرس فعلی پنل را چاپ کند.","**احراز هویت دومرحله‌ای:** ورود را با یک کد ۶ رقمی از Google Authenticator محافظت کنید (بخش امنیت را ببینید).","**خودکارسازی:** پشتیبان‌گیری خودکار، هشدارهای تلگرام، به‌روزرسانی خودکار و تازه‌سازی IP تمیز (بخش خودکارسازی را ببینید).","**بهینه‌سازی کلاینت برای هر اپراتور:** کلاینت‌های Nova اثر انگشت و قطعه‌سازی را برای هر اپراتور به‌صورت خودکار تنظیم می‌کنند."]},"تنظیمات، زیرتب‌های توکن‌های API، مدیران، اعلان‌ها و اطلاعات را هم در خود دارد."],ru:["Общие сведения о подключении и базовые параметры узла:",{ul:["**Хост и путь WebSocket,** URL подписки (поделитесь им, чтобы импортировать конфигурации всех пользователей сразу), и переключатели протоколов (VLESS, VMess, Trojan, Hysteria2, WireGuard).","**Доступ к панели:** спрячьте панель за секретным путём, чтобы она отвечала только по адресу https://ваш-сервер/&lt;path&gt;/, а любой другой адрес показывал простую страницу 404. Новая установка сразу задаёт случайный секретный путь. Здесь его можно изменить, вернуть к корню или выдать панели отдельный HTTPS-порт. Если вы потеряете путь, запустите nova-passwd по SSH, и он выведет текущий адрес панели.","**Двухфакторная аутентификация:** защитите вход 6-значным кодом из Google Authenticator (см. раздел «Безопасность»).","**Автоматизация:** автоматические резервные копии, оповещения в Telegram, автоматические обновления и обновление чистых IP (см. раздел «Автоматизация»).","**Оптимизация клиента под оператора:** клиенты Nova автоматически подстраивают отпечаток и фрагментацию под каждого оператора."]},"В настройках также есть вложенные вкладки токенов API, администраторов, уведомлений и сведений."]}},{id:"xray",icon:"bolt",title:{en:"Xray settings",fa:"تنظیمات Xray",ru:"Настройки Xray"},body:{en:["Advanced engine controls: log level and which logs to keep, the routing and outbound IP strategy, DNS behavior, and optional Prometheus metrics for Grafana.","Leave the defaults unless you know you need to change them."],fa:["کنترل‌های پیشرفتهٔ موتور: سطح لاگ و اینکه کدام لاگ‌ها نگه داشته شوند، راهبرد IP مسیریابی و خروجی، رفتار DNS و متریک‌های اختیاری Prometheus برای Grafana.","جز در مواردی که مطمئنید باید تغییرشان دهید، پیش‌فرض‌ها را رها کنید."],ru:["Продвинутое управление движком: уровень журналирования и какие журналы хранить, стратегия IP для маршрутизации и исходящих, поведение DNS и необязательные метрики Prometheus для Grafana.","Оставьте значения по умолчанию, если только вы точно не знаете, что их нужно менять."]}},{id:"api",icon:"key",title:{en:"API",fa:"API",ru:"API"},body:{en:['Drive the node from your own tools. Create a token here, then call the REST API at /api/v1 with an "Authorization: Bearer <token>" header to list and manage users, read usage, manage inbounds, and more.',"Owner tokens have full access; reseller tokens see only their own users. The token is shown once at creation, so copy it then. Open /api/v1 in a browser for the endpoint list."],fa:["نود را از ابزارهای خودتان کنترل کنید. اینجا یک توکن بسازید، سپس REST API را در /api/v1 با هدر «Authorization: Bearer <token>» صدا بزنید تا کاربران را فهرست و مدیریت کنید، مصرف را بخوانید، ورودی‌ها را مدیریت کنید و بیشتر.","توکن‌های مالک دسترسی کامل دارند؛ توکن‌های نماینده فقط کاربران خودشان را می‌بینند. توکن فقط یک‌بار هنگام ساخت نشان داده می‌شود، پس همان‌موقع کپی‌اش کنید. برای فهرست endpointها، /api/v1 را در مرورگر باز کنید."],ru:['Управляйте узлом из своих инструментов. Создайте здесь токен, затем обращайтесь к REST API по адресу /api/v1 с заголовком "Authorization: Bearer <token>", чтобы просматривать и управлять пользователями, читать расход, управлять входящими подключениями и не только.',"Токены владельца имеют полный доступ; токены реселлера видят только своих пользователей. Токен показывается один раз при создании, поэтому скопируйте его сразу. Откройте /api/v1 в браузере, чтобы увидеть список конечных точек."]}},{id:"admins",icon:"shield",title:{en:"Admins (resellers)",fa:"مدیران (نمایندگان)",ru:"Администраторы (реселлеры)"},body:{en:["Add more people who can sign in. The owner (you) has full control. A reseller can only manage its own users and cannot change node, network, or routing settings.","Give a reseller their own login when they resell access or run their own server that you register under Nodes. Each admin manages their own 2FA."],fa:["افراد بیشتری که می‌توانند وارد شوند اضافه کنید. مالک (شما) کنترل کامل دارد. یک نماینده فقط می‌تواند کاربران خودش را مدیریت کند و نمی‌تواند تنظیمات نود، شبکه یا مسیریابی را تغییر دهد.","زمانی به یک نماینده ورود جداگانه بدهید که او دسترسی را می‌فروشد یا سرور خودش را اداره می‌کند که شما آن را زیر بخش نودها ثبت می‌کنید. هر مدیر احراز هویت دومرحله‌ای خودش را مدیریت می‌کند."],ru:["Добавьте больше людей, которые могут входить в панель. У владельца (у вас) полный контроль. Реселлер может управлять только своими пользователями и не может менять настройки узла, сети или маршрутизации.","Дайте реселлеру собственный вход, когда он перепродаёт доступ или держит свой сервер, который вы регистрируете в разделе «Узлы». Каждый администратор управляет своей двухфакторной аутентификацией."]}},{id:"notifications",icon:"tg",title:{en:"Notifications and the Telegram bot",fa:"اعلان‌ها و ربات تلگرام",ru:"Уведомления и Telegram-бот"},body:{en:["Connect a Telegram bot to get alerts and control the node from chat:",{ul:["Create a bot with @BotFather, paste the bot token and your chat id here, and turn on the command bot.","Send /menu to the bot for a button menu: list users, add a user, enable, disable, or reset a user, and node status.",'Once this node has a domain with a trusted certificate, the bot also shows an "Open control panel" button that opens the full panel inside Telegram (a Telegram Mini App) and signs you in automatically, so you get complete control with no password and no separate browser.',"Only the admin chat ids you list can command the bot."]}],fa:["یک ربات تلگرام متصل کنید تا هشدار بگیرید و نود را از داخل چت کنترل کنید:",{ul:["با @BotFather یک ربات بسازید، توکن ربات و شناسهٔ چت خود را اینجا بچسبانید و ربات فرمان را روشن کنید.","به ربات /menu بفرستید تا یک منوی دکمه‌ای بگیرید: فهرست کاربران، افزودن کاربر، فعال، غیرفعال یا بازنشانی یک کاربر و وضعیت نود.","به‌محض اینکه این نود یک دامنه با گواهی مورد اعتماد داشته باشد، ربات دکمهٔ «باز کردن پنل کنترل» را هم نشان می‌دهد که پنل کامل را داخل تلگرام باز می‌کند (یک Mini App تلگرام) و شما را به‌صورت خودکار وارد می‌کند، پس بدون رمز و بدون مرورگر جداگانه کنترل کامل دارید.","فقط شناسه‌های چت مدیرانی که فهرست می‌کنید می‌توانند به ربات فرمان بدهند."]}],ru:["Подключите Telegram-бота, чтобы получать оповещения и управлять узлом из чата:",{ul:["Создайте бота у @BotFather, вставьте сюда токен бота и ваш chat id и включите командного бота.","Отправьте боту /menu, чтобы получить меню с кнопками: список пользователей, добавить пользователя, включить, отключить или сбросить пользователя и состояние узла.","Как только у этого узла есть домен с доверенным сертификатом, бот также показывает кнопку «Открыть панель управления», которая открывает полную панель прямо в Telegram (Telegram Mini App) и входит за вас автоматически, так что вы получаете полный контроль без пароля и без отдельного браузера.","Командовать ботом могут только те chat id администраторов, которые вы перечислили."]}]}},{id:"automation",icon:"retry",title:{en:"Automation",fa:"خودکارسازی",ru:"Автоматизация"},body:{en:["Hands-off background tasks (turn on the ones you want in Settings, Automation):",{ul:["**Automatic backups:** back up settings every day, keep the last 7 on the server, and optionally deliver each backup to your Telegram.","**Alerts to Telegram:** get warned before things break (certificate expiring, low disk, a service down, a user about to expire).","**Automatic updates:** install new Nova versions when they are published.","**Auto clean-IP refresh:** pull a fresh Cloudflare clean-IP list into the node daily."]},"These need the Telegram bot configured for the parts that message you."],fa:["کارهای پس‌زمینهٔ بدون دخالت (موارد دلخواه را در تنظیمات، بخش خودکارسازی روشن کنید):",{ul:["**پشتیبان‌گیری خودکار:** هر روز از تنظیمات پشتیبان بگیرید، ۷ نسخهٔ آخر را روی سرور نگه دارید و به‌دلخواه هر پشتیبان را به تلگرام خود بفرستید.","**هشدار به تلگرام:** پیش از خراب‌شدن اوضاع هشدار بگیرید (انقضای گواهی، کم‌بودن فضای دیسک، از کار افتادن یک سرویس، نزدیک‌بودن انقضای یک کاربر).","**به‌روزرسانی خودکار:** نسخه‌های جدید Nova را هنگام انتشار نصب کنید.","**تازه‌سازی خودکار IP تمیز:** هر روز یک فهرست تازهٔ IP تمیز Cloudflare را به نود بکشید."]},"برای بخش‌هایی که به شما پیام می‌دهند، این‌ها به ربات تلگرام پیکربندی‌شده نیاز دارند."],ru:["Фоновые задачи без вашего участия (включите нужные в разделе «Настройки», «Автоматизация»):",{ul:["**Автоматические резервные копии:** резервируйте настройки каждый день, храните последние 7 на сервере и при желании отправляйте каждую копию в ваш Telegram.","**Оповещения в Telegram:** получайте предупреждения до того, как что-то сломается (истекает сертификат, мало места на диске, служба остановлена, скоро истекает срок пользователя).","**Автоматические обновления:** устанавливайте новые версии Nova, когда они выходят.","**Автообновление чистых IP:** ежедневно подтягивайте в узел свежий список чистых IP Cloudflare."]},"Для тех частей, что шлют вам сообщения, нужен настроенный Telegram-бот."]}},{id:"health",icon:"activity",title:{en:"Health check",fa:"بررسی سلامت",ru:"Проверка состояния"},body:{en:['"Run health check" on the Dashboard checks the whole node in one click: Xray and Hysteria2 running, port 443 listening, the certificate valid and how long it has left, disk space, and any Tor, Psiphon, tunnel, or WARP the config uses.',"Green means good, amber is a warning, red is a problem. Run it after any big change."],fa:["«اجرای بررسی سلامت» در داشبورد کل نود را با یک کلیک بررسی می‌کند: در حال اجرا بودن Xray و Hysteria2، گوش‌دادن پورت ۴۴۳، معتبربودن گواهی و مدت باقی‌مانده‌اش، فضای دیسک و هر Tor، Psiphon، تونل یا WARP که کانفیگ استفاده می‌کند.","سبز یعنی خوب، کهربایی یک هشدار است و قرمز یک مشکل. آن را بعد از هر تغییر بزرگ اجرا کنید."],ru:["Кнопка «Запустить проверку состояния» на панели управления проверяет весь узел одним нажатием: запущены ли Xray и Hysteria2, слушается ли порт 443, действителен ли сертификат и сколько ему осталось, место на диске и любые Tor, Psiphon, туннель или WARP, которые использует конфигурация.","Зелёный - это хорошо, янтарный - предупреждение, красный - проблема. Запускайте её после любого крупного изменения."]}},{id:"security",icon:"shield",title:{en:"Security (2FA)",fa:"امنیت (۲FA)",ru:"Безопасность (2FA)"},body:{en:["Turn on Two-factor authentication (Settings, General) to protect sign-in. Scan the QR with Google Authenticator (or any TOTP app), enter the 6-digit code to confirm, and from then on sign-in asks for a code after your password.","To turn it off, enter a current code. Each admin sets up their own 2FA."],fa:["احراز هویت دومرحله‌ای را روشن کنید (تنظیمات، عمومی) تا ورود محافظت شود. QR را با Google Authenticator (یا هر اپ TOTP) اسکن کنید، کد ۶ رقمی را برای تأیید وارد کنید، و از آن پس ورود پس از رمز شما یک کد می‌خواهد.","برای خاموش‌کردنش، یک کد فعلی را وارد کنید. هر مدیر احراز هویت دومرحله‌ای خودش را راه می‌اندازد."],ru:["Включите двухфакторную аутентификацию («Настройки», «Общие»), чтобы защитить вход. Отсканируйте QR приложением Google Authenticator (или любым TOTP-приложением), введите 6-значный код для подтверждения, и с этого момента при входе после пароля будет запрашиваться код.","Чтобы отключить её, введите текущий код. Каждый администратор настраивает свою двухфакторную аутентификацию."]}},{id:"reset-password",icon:"key",title:{en:"Reset a forgotten password",fa:"بازنشانی رمز فراموش‌شده",ru:"Сброс забытого пароля"},body:{en:["If you are locked out of the panel (forgot your password, or lost your 2FA device), you can reset it from the server over SSH. Sign in to the node with SSH and run:",{code:"nova-passwd 'YourNewPassword'"},"To also remove two-factor auth (if you lost your authenticator), add --clear-2fa:",{code:"nova-passwd 'YourNewPassword' --clear-2fa"},"If the nova-passwd shortcut is not available, use the full command:",{code:"node /opt/nova-node-agent/bin/reset-password.mjs 'YourNewPassword' --clear-2fa"},"The new password must be at least 6 characters. Resetting the password also signs out every existing session. Nothing else (users, inbounds, settings) is changed."],fa:["اگر از پنل بیرون مانده‌اید (رمز را فراموش کرده‌اید یا دستگاه احراز هویت دومرحله‌ای‌تان را از دست داده‌اید)، می‌توانید آن را از روی سرور از طریق SSH بازنشانی کنید. با SSH به نود وارد شوید و این را اجرا کنید:",{code:"nova-passwd 'YourNewPassword'"},"برای حذف احراز هویت دومرحله‌ای هم (اگر اپ احراز هویت خود را از دست داده‌اید)، سوییچ ‎--clear-2fa را اضافه کنید:",{code:"nova-passwd 'YourNewPassword' --clear-2fa"},"اگر میان‌بر nova-passwd در دسترس نبود، از فرمان کامل استفاده کنید:",{code:"node /opt/nova-node-agent/bin/reset-password.mjs 'YourNewPassword' --clear-2fa"},"رمز جدید باید حداقل ۶ نویسه باشد. بازنشانی رمز همهٔ نشست‌های موجود را هم خارج می‌کند. هیچ‌چیز دیگری (کاربران، ورودی‌ها، تنظیمات) تغییر نمی‌کند."],ru:["Если вы потеряли доступ к панели (забыли пароль или лишились устройства двухфакторной аутентификации), вы можете сбросить его на сервере по SSH. Войдите на узел по SSH и выполните:",{code:"nova-passwd 'YourNewPassword'"},"Чтобы заодно снять двухфакторную аутентификацию (если вы потеряли приложение-аутентификатор), добавьте --clear-2fa:",{code:"nova-passwd 'YourNewPassword' --clear-2fa"},"Если ярлыка nova-passwd нет, используйте полную команду:",{code:"node /opt/nova-node-agent/bin/reset-password.mjs 'YourNewPassword' --clear-2fa"},"Новый пароль должен быть не короче 6 символов. Сброс пароля также завершает все существующие сессии. Больше ничего (пользователи, входящие подключения, настройки) не меняется."]}},{id:"updating",icon:"download",title:{en:"Updating the node",fa:"به‌روزرسانی نود",ru:"Обновление узла"},body:{en:["The panel checks for new Nova versions and can update in one click (or turn on Automatic updates). Your users, inbounds, and settings are preserved across updates.","Back up first from Settings if you want a safety copy."],fa:["پنل نسخه‌های جدید Nova را بررسی می‌کند و می‌تواند با یک کلیک به‌روزرسانی کند (یا به‌روزرسانی خودکار را روشن کنید). کاربران، ورودی‌ها و تنظیمات شما در طول به‌روزرسانی‌ها حفظ می‌شوند.","اگر یک نسخهٔ ایمن می‌خواهید، ابتدا از بخش تنظیمات پشتیبان بگیرید."],ru:["Панель проверяет новые версии Nova и может обновиться в одно нажатие (или включите автоматические обновления). Ваши пользователи, входящие подключения и настройки сохраняются при обновлениях.","Если хотите страховочную копию, сначала сделайте резервную копию в разделе «Настройки»."]}}];function guideInline(e){return esc(e).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}function guideBodyHTML(e){return(e||[]).map(e=>"string"==typeof e?`<p>${guideInline(e)}</p>`:e&&e.ul?`<ul>${e.ul.map(e=>`<li>${guideInline(e)}</li>`).join("")}</ul>`:e&&e.code?`<div class="gman-code"><code>${esc(e.code)}</code><button type="button" class="gman-copy" data-cmd="${esc(e.code)}" aria-label="${esc(t("copyBtn"))}" title="${esc(t("copyBtn"))}">${IC.copy}</button></div>`:"").join("")}function guideSectionCard(e){const t=state.lang,n=e.title&&(e.title[t]||e.title.en)||"",a=e.body&&(e.body[t]||e.body.en)||[];return el(`<article class="card gsec" id="gsec-${e.id}" data-sec="${e.id}">\n    <div class="gsec-head"><span class="gsec-ic">${IC[e.icon]||IC.guide}</span><h3>${esc(n)}</h3></div>\n    <div class="gsec-body">${guideBodyHTML(a)}</div></article>`)}function viewGuide(){const e=state.lang,n=el('<section class="view active" role="tabpanel"></section>');n.appendChild(el(`<div class="view-head"><div class="htxt"><h2>${esc(t("guideTitle"))}</h2>\n    <p>${esc(t("guideLead"))}</p></div></div>`));const a=el('<div class="gman"></div>'),s=el('<aside class="gman-side"></aside>'),i=el(`<div class="gman-search
