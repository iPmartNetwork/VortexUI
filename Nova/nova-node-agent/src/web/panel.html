in) or a self-signed one (IP only), and turn protocols on or off (VLESS, VMess, Trojan, Shadowsocks, Hysteria2, WireGuard). Add clean IPs here when your main address is throttled.",guideRouting:"Decide where each kind of traffic goes. Every rule sends matching traffic out one path: direct (straight out of the node), block (dropped), or an extra exit like WARP, Tor, or Psiphon. Match on a domain, a category (geosite), a country (geoip), an IP range, or a protocol. Turn on anti-censorship to route sanctioned or filtered sites through a working exit automatically.",guideInbounds:'Inbounds are the entry points clients connect through, in two kinds. The shared 443 front carries your CDN and TLS-fronted protocols (VLESS, VMess and Trojan over WebSocket) together on one port behind Cloudflare, so their port and Reality are fixed; these used to be labeled "main". Standalone inbounds each run on their own port with the full protocol feature set (Reality, gRPC, XHTTP, WS+TLS, Shadowsocks and more). Reality keys and Shadowsocks passwords are generated for you, and each inbound can serve all users or a chosen few.',guideUsers:"Manage who can use the node. For each user you can set a data quota (total, or split upload/download), an expiry date (fixed, or counted from first connection), a device/IP limit, and an automatic reset cycle. Every user gets a personal subscription link and page with all their configs and live usage.",guideNodes:'Run more than one server from this panel. The easiest way is "Add a node with one command": generate the one-line command, run it on a fresh VPS, and that server installs as a managed node and registers itself here automatically, with no panel of its own to set up. You can also add a node manually by its address and an API token. This panel then lists and manages every node\'s users alongside your own and can push new users onto any node. Each node keeps serving traffic even if this panel is offline. Useful when you or a reseller runs several servers.',guideTunnel:"Bridge an Iran server to a foreign one to beat throttling. Run this node as a bridge (the Iran side, where clients connect to a clean domestic IP) or an exit (the foreign side that holds the real Nova exit). Traffic tunnels between them over a censorship-resistant transport. Both sides must share the same backend, transport, port, and token. The default forwards carry both your normal traffic and Hysteria2. Pick Backhaul or BackPack for the widest options, rathole for a light footprint, or wstunnel to hide behind a CDN.",guideSettings:"General node options: fingerprint and fragment tuning, 0-RTT, path randomization, and other client-facing switches. These fine-tune how clients connect for the best speed and stealth on a given network.",guideXray:"Advanced engine controls: log level and which logs to keep, the routing and outbound IP strategy, DNS behavior, and optional Prometheus metrics. Leave the defaults unless you know you need to change them.",guideApi:"Drive this node from your own tools. Create a token, then call the REST API at /api/v1 with an Authorization: Bearer header to list and manage users, read usage, and more. Owner tokens have full access; reseller tokens only see their own users. The token is shown once when created, so copy it then.",guideAdmins:"Add more people who can log in, each with a role and a set of permissions you choose. The owner (you) has full control. A reseller sees only the users they create, so it is the right fit for a partner who resells access. A manager sees every user on the node, which suits a trusted teammate who helps you run it. Neither can touch node, network, routing, or system settings. Use the permission checkboxes to grant exactly what each person needs, and edit them any time.",guideNotifications:"Get alerts and control the node from Telegram. Point it at your bot token and chat id for status alerts. Turn on the command bot to run the node from chat: check status, list users, and add, enable, di e checks for this node.",ndEnrolledBadge:"auto",tnTitle:"Tunnel",tnLead:"Relay traffic through an Iran bridge to a foreign exit so clients reach a fast, unfiltered path.",tnExplain:"Set one server as the bridge (inside Iran, clients connect here) and another as the exit (abroad, runs the real Nova exit). Both sides must share the same backend, transport, token, and tunnel port.",tgSetupTitle:"Set up a tunnel (Iran server to foreign server)",tgSetupSub:"Connect two servers in 4 steps",tgSetupIntro:"Iran throttles direct connections to foreign servers. Put a cheap server inside Iran in front: clients connect to its clean domestic IP, and their traffic tunnels out to your real Nova server abroad.",tgSetupNeed:"What you need",tgSetupIran:"Iran server",tgSetupForeign:"Foreign server",tgSetupBoth:"Both servers",tgSetupNeedForeign:"Foreign server (outside Iran): your real Nova exit, where your users, inbounds and Hysteria2 already run. You already have this one.",tgSetupNeedIran:"Iran server: a cheap VPS inside Iran with a clean public IP. It runs only the tunnel backend, with no full Nova install and no panel of its own. You just run one command on it.",tgSetupStepsH:"Steps",tgStep1T:"Pick your settings once",tgStep1B:"Do this here on the foreign panel. Open Network settings then Tunnel and choose a backend (Backhaul is the default; the four are Backhaul, BackPack, rathole and wstunnel), a transport (tcpmux is the simplest; wssmux disguises the tunnel as normal TLS), and a tunnel port (for example 8443). Generate a shared token with the button. Leave Forwards as 443, 8443/udp (443 carries your normal traffic, 8443/udp carries Hysteria2). You will use the same backend, transport, tunnel port and token on both servers.",tgStep2T:"Set this foreign server as the Exit",tgStep2B:"Still on this foreign panel's Tunnel settings, set:",tgStep2L1:"Role: Exit (this foreign server holds your real Nova exit)",tgStep2L2:"Backend, Transport, Tunnel port, Token: the values you chose in step 1",tgStep2L3:"Bridge address: your-iran-server-ip:tunnel-port (for example 203.0.113.10:8443). Only the Exit sets this.",tgStep2L4:"Forwards: leave 443, 8443/udp",tgStep2B2:"Save. You need the Iran VPS's public IP for the Bridge address, so get the cheap Iran VPS first and note its IP.",tgAddrLabel:"Example bridge address",tgStep3T:"Set up the Iran bridge with one command",tgStep3B:"Click Generate the Iran bridge command in the Tunnel settings above, copy it, and run it once on your Iran VPS. That single command:",tgStep3L1:"Installs only the tunnel backend, with no xray, no sing-box and no panel",tgStep3L2:"Uses the same backend, transport, tunnel port and token you already set, so there is nothing to configure on the Iran side",tgStep3L3:"Starts the bridge automatically",tgStep3B2:"Then open these ports in the Iran VPS firewall: the tunnel port (TCP), 443 (TCP), and 8443 (UDP).",tgStep4T:"Point your clients at the Iran server",tgStep4B:"On this foreign panel, go to Network and IPs and set the Host to your Iran server's IP (or a domain whose DNS points at the Iran IP). Now the subscription links your users import connect to the clean Iran IP, and their traffic enters in Iran and tunnels to your foreign exit.",tgSetupCheck:"Check it worked:",tgSetupCheckB:"The Tunnel status on this foreign panel shows Up, and a client using the Iran IP connects normally.",tgSetupNotes:"Notes",tgNote1:"Both sides must match on backend, transport, tunnel port and token. Only the roles differ (Exit here, Bridge on the Iran VPS) and only the Exit sets the Bridge address. The Iran bridge command carries the matching values for you.",tgNote2:"On the Iran bridge, do not run other services on 443 or 8443; the tunnel uses those ports.",tgNote3:"The wss and wssmux transports generate a self-signed certificate automatically, so no domain is required.",tgNote4:"All four backends carry both TCP and UDP, so Hysteria2 keeps working through the tunnel.",tnStatusTitle:"Status",tnUp:"Tunnel up",tnDown:"Tunnel down",tnNone:"No tunnel configured",tnRole:"Role",tnRoleBridge:"Bridge",tnRoleExit:"Exit",tnRoleBridgeD:"This is my Iran server. Clients connect here.",tnRoleExitD:"This is my foreign server with the real Nova exit.",tnBackend:"Backend",tnBackendHint:"The tunnel engine. tcpmux on backhaul is the simplest default.",tnUnavail:"install pending",tnTransport:"Transport",tnTransportHint:"Wire format for the tunnel. wss variants add TLS.",tnPort:"Tunnel port",tnPortHint:"The port the bridge and exit use to reach each other. Both sides must match.",tnToken:"Shared token",tnTokenPh:"Shared secret for both sides",tnGenerate:"Generate",tnTokenHint:"Both the bridge and the exit must use this exact token.",tnBridgeAddr:"Bridge address",tnBridgeAddrPh:"bridge.example.com:443",tnBridgeAddrHint:"The Iran bridge's address that this exit dials back to. Host and port.",tnForwards:"Forwarded ports",tnForwardsPh:"443, 8443/udp",tnForwardsHint:"Ports carried through the tunnel. 8443/udp carries Hysteria2. Comma separated; add /udp for UDP.",tnMux:"Multiplex",tnMuxD:"Carry many streams over one connection. Recommended.",tnGrpConnection:"Connection",tnGrpLink:"Link settings",tnGrpAdvanced:"Advanced",tnRecommend:"Not sure? Use backend backhaul with transport tcpmux. It is the simplest reliable setup.",tnSave:"Save tunnel",tnSaving:"Saving...",tnDisable:"Disable tunnel",tnSaved:"Tunnel saved.",tnDisabledMsg:"Tunnel disabled.",tnErrPort:"Enter a valid port.",tnErrToken:"Enter a shared token.",tnErrBridge:"Enter the bridge address as host:port.",tnErrBackend:"This backend is not installed on the node yet.",tnLoadFail:"Could not load tunnel settings.",tnDisableT:"Disable the tunnel?",tnDisableB:"Traffic will stop relaying through the bridge and exit. You can re-enable it later.",tnBridgeCmdTitle:"Set up the Iran bridge",tnBridgeCmdBody:"Run this one command on your Iran VPS. It installs only the tunnel, no full Nova needed. It contains your tunnel secret, so keep it private.",tnBridgeCmdGen:"Generate the Iran bridge command",tnBridgeCmdWarn:"This command carries your shared secret. Do not post it publicly.",helpOpen:"Help",navOutbounds:"Outbounds",outTitle:"Outbounds",outLead:"Egress paths that traffic can leave through.",guideOutbound:"Outbounds are the egress paths traffic leaves through. You assign one to an inbound or to a routing rule, and matching traffic exits by that path. The built-in outbounds are always available: direct goes straight out of the node, block drops traffic, and WARP, Tor, and Psiphon change the exit. Add a custom outbound to send traffic on to another server over SOCKS or HTTP, or to paste a full xray outbound as raw JSON.",outAdd:"Add outbound",outBuiltinTitle:"Built-in outbounds",outBuiltinBadge:"Built-in",outCustomTitle:"Custom outbounds",outNoneTitle:"No custom outbounds",outNoneBody:"Add a custom outbound to chain this node's traffic on to another server, or paste a raw xray outbound.",outBiDirect:"Straight out of the node, using the server's own IP.",outBiBlock:"Drops matching traffic.",outBiWarp:"Cloudflare WARP egress, a clean Cloudflare IP.",outBiTor:"Exits over the Tor network for a random IP.",outBiPsiphon:"Exits over Psiphon for a random IP.",outEnableAria:e=>"Enable outbound "+e,outEditAria:e=>"Edit outbound "+e,outDeleteAria:e=>"Delete outbound "+e,outEnabled:"Outbound enabled.",outDisabled:"Outbound disabled.",outCreate:"Create outbound",outEditTitle:"Edit outbound",outSave:"Save outbound",outSaveChanges:"Save changes",outCreated:"Outbound created.",outUpdated:"Outbound updated.",outDeleted:"Outbound deleted.",outFName:"Name / tag",outFNamePh:"my-exit",outFNameHint:"Unique tag for this outbound. Letters, numbers, dot and dash. It cannot be a reserved name (direct, block, warp, tor, psiphon).",outFRemark:"Remark",outFRemarkPh:"Optional note",outFType:"Type",outTypeFreedom:"Freedom (direct)",outTypeBlackhole:"Blackhole (block)",outTypeSocks:"SOCKS",outTypeHttp:"HTTP",outTypeRaw:"Raw JSON",outFAddress:"Address",outFAddressPh:"exit.example.com",outFPort:"Port",outFUser:"Username",outFUserPh:"Optional",outFPass:"Password",outFPassPh:"Optional",outFRawLabel:"Outbound JSON",outFRawHint:"A full xray outbound object. The node validates it with a config test on save.",outTypeNoFields:"This type needs no extra settings.",outErrName:"Enter a name for this outbound.",outErrNameReserved:"That name is reserved for a built-in outbound. Pick another.",outErrNameDup:"An outbound with that name already exists.",outErrAddress:"Enter the server address.",outErrPort:"Enter a valid port.",outErrRaw:"The JSON is not valid.",outSaveFail:"Could not save the outbound.",outLoadFail:"Could not load outbounds.",outDeleteT:"Delete this outbound?",outDeleteB:e=>'The outbound "'+e+'" will be removed. Any inbound or rule using it falls back to direct.',outDelete:"Delete outbound",inbFOutbound:"Outbound (egress)",inbFOutboundHint:"Choose where this inbound's traffic exits. Direct leaves straight out of the node. Tor and Psiphon change the exit IP, WARP is Cloudflare egress, and a custom outbound chains to another server. Tor and Psiphon must be installed and running, which you manage in Routing.",inbEgDirect:"Direct (default)",inbEgWarp:"WARP",inbEgTor:"Tor",inbEgPsiphon:"Psiphon",tnBadgeRecommended:"Recommended",tnBadgeNew:"New",tnBackhaulHelpT:"Backhaul",tnBackhaulHelpB:"A purpose-built Iran-to-foreign reverse tunnel with the widest transport set (tcp, tcpmux, ws, wss, wsmux, wssmux) plus connection pooling. It carries UDP, so Hysteria2 keeps working. Self-signed certificates are fine for the wss transports, so no domain is required. Pick this as the default. Use tcpmux for the simplest setup, or wssmux to disguise the tunnel as normal HTTPS. Both sides must share the same transport, port, and token.",tnBackpackHelpT:"BackPack",tnBackpackHelpB:"A newer Backhaul-class engine written in Go, with nine transports (tcp, tcpmux, ws, wss, wsmux, wssmux, udp, kcp, stealth) plus connection pooling. Its release binaries are published with SHA256 checksums, so the installer verifies them before use. It carries TCP and UDP. The stealth transport uses a Noise handshake with no fixed fingerprint, and kcp adds forward error correction for lossy links. It is very capable but only a few weeks old, so treat it as new. The same rule applies: matching transport, port, and token on both sides.",tnRatholeHelpT:"rathole",tnRatholeHelpB:"A lightweight, well-established Rust reverse tunnel. Low resource use, TCP and UDP, with optional Noise or TLS encryption. It has fewer transports than Backhaul or BackPack, but it is a dependable, low-footprint choice for a simple bridge. Use the noise or tls transport for stealth; plain tcp is fine on a clean link.",tnWstunnelHelpT:"wstunnel",tnWstunnelHelpB:"Tunnels over WebSocket or HTTPS, so it looks like ordinary web traffic and fronts cleanly behind a CDN like Cloudflare. Best when you want to hide the tunnel behind a domain or CDN rather than expose a raw port. It needs a domain and TLS to realize its stealth advantage. It carries UDP, though QUIC-native tools move heavy UDP a bit more efficiently.",tnChooseHelpT:"Which backend to choose",tnChooseHelpB:"- Simplest working setup: Backhaul with tcpmux.\n- Disguise as HTTPS without a domain: Backhaul or BackPack with wssmux (a self-signed cert is generated for you).\n- Hide behind a Cloudflare domain: wstunnel.\n- Smallest footprint: rathole.\n- Newest engine, checksum-verified: BackPack.\nWhatever you pick, set the same backend, transport, tunnel port, and token on both the Iran bridge and the foreign exit.",navSearch:"Search",searchPh:"Search pages, settings, users...",searchEmptyT:"No matches",searchEmptyD:'Try "domain", "tunnel", "2fa", or "backup".',searchJumpTo:"Jump to",searchResults:"Results",searchHintNav:"navigate",searchHintOpen:"open",searchHintClose:"close",srDashT:"Dashboard",srDashD:"Node overview, live status and traffic",srUsersT:"Users",srUsersD:"Add users, set quota, expiry and device limits",srInbT:"Inbounds",srInbD:"Protocols and ports: VLESS, VMess, Trojan, Reality, WireGuard, Hysteria2",srOutT:"Outbounds",srOutD:"Egress and proxy chains: freedom, SOCKS, HTTP, blackhole",srRouteT:"Routing",srRouteD:"Rules, GeoIP and GeoSite, WARP, Tor, ad blocking and DNS",srNetT:"Network & IPs",srNetD:"Add a domain and get a free SSL certificate",srTunT:"Tunnel",srTunD:"Iran bridge to a foreign exit: relay and backhaul",srNodesT:"Nodes",srNodesD:"Manage your multi-node fleet and reseller nodes",srGenT:"General settings",srGenD:"Backup and restore, self-update, admin password",srNotifT:"Notifications",srNotifD:"Telegram bot alerts and chat",srApiT:"API tokens",srApiD:"Bearer tokens for the REST API and integrations",srAdminsT:"Admins & resellers",srAdminsD:"Sub-admins, resellers, roles and staff",srTwoFaT:"Two-factor security",srTwoFaD:"Set up 2FA with an authenticator app",srInfoT:"Node info",srInfoD:"Version, build and node details",srXrayT:"Xray settings",srXrayD:"Logs, log level, metrics and DNS strategy",srActT:"Activity",srActD:"Audit log: sign-ins and change history",srWizT:"Setup wizard",srWizD:"Get started: domain, protocols and your first user",srHealthT:"Run health check",srHealthD:"Diagnose the node: xray, ports, TLS, disk and more",cfGetToken:"Get a token",cfStepsTitle:"Get your token in four quick steps",cfStep1:'Click "Create Token".',cfStep2:'Choose the "Edit zone DNS" template.',cfStep3:"Under Zone Resources, pick your domain's zone.",cfStep4:"Create it, copy the token, and paste it above.",wizTitle:"Setup wizard",wizStepOf:(e,t)=>"Step "+e+" of "+t,wizBack:"Back",wizNext:"Next",wizSkip:"Skip",wizFinish:"Finish",wizClose:"Close wizard",wizGoDash:"Go to dashboard",wizQaT:"Setup wizard",wizQaD:"Guided setup from zero to a working node",wizBannerT:"Finish setting up your node",wizBannerB:"No users yet. The setup wizard walks you through a domain, a recommended protocol and your first user.",wizBannerStart:"Start setup",wizBannerDismi on",srProtD:"Censorship resistance, Reality, Iran block-detection",crDashTitle:"Censorship resistance",crDashSub:"How exposed your server IP is to blocking from Iran.",crChecking:"Checking...",crNotChecked:"Not checked yet",crLastCheckedTs:e=>"Last checked "+e,crTestedIp:"Tested IP",crOpen:"Protect my IP",crRealityHint:"No domain set. Reality is recommended.",crVReachable:"Reachable",crVReachableD:"Iran test points reached your IP. No block detected.",crVBlocked:"Looks blocked",crVBlockedD:"Iran test points could not reach your IP. It looks blocked from inside Iran.",crVUnknown:"Unknown",crVUnknownD:"Could not measure right now. Try the test again in a moment.",protectTitle:"Censorship resistance and IP protection",protectLead:"Keep your server reachable from Iran and stop its IP from being found and blocked.",guideProtect:"Iran blocks servers by IP. This page explains how Nova hides and protects your IP without a domain, gives you a short checklist to harden the setup, and lets you check from inside Iran whether your IP is still reachable.",crWhyTitle:"Why an IP gets blocked, and how Nova protects it",crWhyLead:"Filtering systems look for servers that behave like proxies, then block the IP. Here is what gets an IP found, and the two things that keep yours hidden.",crWhy1T:"How an IP gets found",crWhy1B:"An unusual TLS fingerprint, a bare IP with no real website, and heavy traffic all flag a server. Once flagged, the IP is blocked. Sharing one IP with too many people gets it noticed fast.",crWhy2T:"VLESS-Reality hides the handshake",crWhy2B:"Reality borrows a real website's TLS handshake, so to a censor your server looks like ordinary HTTPS to that site. It needs no certificate and no domain of your own, which makes it the hardest setup to detect.",crWhy3T:"An Iran bridge fronts your IP",crWhy3B:"A bridge tunnel puts a clean domestic IP in front of your foreign exit. Users only ever see the bridge, never the real exit IP, and if a bridge IP does get blocked it is ch ِ ورودی نود شماست. دامنه یا آی‌پی‌ای که کلاینت‌ها به آن وصل می‌شوند را تعیین کنید، انتخاب کنید که نود از گواهی معتبر (دامنه واقعی) استفاده کند یا گواهی خودامضا (فقط آی‌پی)، و پروتکل‌ها را روشن یا خاموش کنید (VLESS، VMess، Trojan، Shadowsocks، Hysteria2، WireGuard). وقتی آدرس اصلی شما محدود شده، آی‌پی‌های تمیز را همین‌جا اضافه کنید.",guideRouting:"تعیین کنید هر نوع ترافیک به کجا برود. هر قاعده، ترافیک منطبق را از یک مسیر خارج می‌کند: مستقیم (مستقیم از خود نود)، مسدود (حذف)، یا یک خروجی اضافی مانند WARP، Tor یا Psiphon. می‌توانید بر اساس دامنه، دسته (geosite)، کشور (geoip)، بازهٔ آی‌پی یا پروتکل تطبیق دهید. ضدسانسور را روشن کنید تا سایت‌های تحریم‌شده یا فیلترشده به‌طور خودکار از یک خروجی سالم عبور کنند.",guideInbounds:"ورودی‌ها نقاط ورودی هستند که کلاینت‌ها از طریق آن‌ها وصل می‌شوند و دو نوع‌اند. Front مشترک روی 443 پروتکل‌های CDN و TLS‌دار شما (VLESS، VMess و Trojan روی WebSocket) را با هم روی یک پورت پشت Cloudflare حمل می‌کند، پس پورت و Reality آن‌ها ثابت است؛ این‌ها قبلاً «main» برچسب می‌خوردند. ورودی‌های مستقل هرکدام روی پورت اختصاصی خودشان با مجموعهٔ کامل امکانات پروتکل (Reality، gRPC، XHTTP، WS+TLS، Shadowsocks و بیشتر) اجرا می‌شوند. کلیدهای Reality و گذرواژه‌های Shadowsocks به‌طور خودکار ساخته می‌شوند و هر ورودی می‌تواند به همهٔ کاربران یا تنها چند کاربر منتخب سرویس دهد.",guideUsers:"مدیریت کنید چه کسانی می‌توانند از نود استفاده کنند. برای هر کاربر می‌توانید سهمیهٔ داده (کل، یا جدا برای آپلود/دانلود)، تاریخ انقضا (ثابت، یا از اولین اتصال شمرده‌شده)، محدودیت دستگاه/آی‌پی و یک چرخهٔ بازنشانی خودکار تعیین کنید. هر کاربر یک لینک و صفحهٔ اشتراک شخصی با همهٔ کانفیگ‌ها و مصرف زندهٔ خود دریافت می‌کند.",guideNodes:"بیش از یک سرور را از همین پنل اداره کنید. ساده‌ترین راه «افزودن نود با یک دستور» است: دستور تک‌خطی را بسازید، روی یک سرور تازه اجرا کنید، و آن سرور به‌عنوان یک نود مدیریت‌شده نصب می‌شود و خودش را همین‌جا به‌طور خودکار ثبت می‌کند، بدون اینکه پنل جداگانه‌ای روی آن راه‌اندازی شود. می‌توانید یک نود را به‌صورت دستی هم با آدرس و یک توکن API اضافه کنید. سپس این پنل کاربران همهٔ نودها را در کنار کاربران خودتان فهرست و مدیریت می‌کند و می‌تواند کاربران جدید را روی هر نود اضافه کند. هر نود حتی اگر این پنل آفلاین باشد به سرویس‌دهی ادامه می‌دهد. برای زمانی مفید است که شما یا یک نماینده چند سرور دارید.",guideTunnel:"یک سرور ایران را به یک سرور خارج پل بزنید تا محدودیت سرعت را دور بزنید. این نود را به‌عنوان پل (سمت ایران، جایی که کلاینت‌ها به یک آی‌پی داخلی تمیز وصل می‌شوند) یا خروجی (سمت خارج که خروجی واقعی Nova را نگه می‌دارد) اجرا کنید. ترافیک از طریق یک ترنسپورت مقاوم در برابر سانسور بین آن‌ها تونل می‌شود. هر دو سمت باید بک‌اند، ترنسپورت، پورت و توکن یکسانی داشته باشند. فورواردهای پیش‌فرض هم ترافیک عادی و هم Hysteria2 شما را منتقل می‌کنند. برای بیشترین گزینه‌ها Backhaul یا BackPack، برای مصرف سبک rathole، و برای پنهان‌شدن پشت CDN از wstunnel استفاده کنید.",guideSettings:"گزینه‌های عمومی نود: تنظیم فینگرپرینت و فرگمنت، 0-RTT، تصادفی‌سازی مسیر و دیگر کلیدهای مربوط به کلاینت. این‌ها نحوهٔ اتصال کلاینت‌ها را برای بهترین سرعت و پنهان‌کاری روی یک شبکهٔ مشخص تنظیم دقیق می‌کنند.",guideXray:"کنترل‌های پیشرفتهٔ موتور: سطح لاگ و اینکه کدام لاگ‌ها نگه داشته شوند، راهبرد مسیریابی و آی‌پی خروجی، رفتار DNS و متریک‌های اختیاری Prometheus. اگر مطمئن نیستید که نیاز به تغییر دارید، مقادیر پیش‌فرض را دست‌نخورده بگذارید.",guideApi:"این نود را از ابزارهای خودتان کنترل کنید. یک توکن بسازید، سپس REST API را در ‎/api/v1‎ با هدر ‎Authorization: Bearer‎ فراخوانی کنید تا کاربران را فهرست و مدیریت کنید، مصرف را بخوانید و بیشتر. توکن‌های مالک دسترسی کامل دارند؛ توکن‌های نماینده فقط کاربران خودشان را می‌بینند. توکن فقط یک بار هنگام ساخت نمایش داده می‌شود، پس همان موقع آن را کپی کنید.",guideAdmins:"افراد بیشتری را که می‌توانند وارد شوند اضافه کنید؛ هرکدام با یک نقش و مجموعه‌ای از دسترسی‌ها که شما انتخاب می‌کنید. مالک (شما) کنترل کامل دارد. یک نماینده فقط کاربرانی را که خودش می‌سازد می‌بیند، پس برای شریکی که دسترسی را می‌فروشد مناسب است. یک مدیر همه کاربران نود را می‌بیند و برای همکار مورد اعتمادی که در اداره نود کمک می‌کند مناسب است. هیچ‌کدام نمی‌توانند تنظیمات نود، شبکه، مسیریابی یا سامانه را تغییر دهند. با کادرهای دسترسی دقیقاً همان چیزی را که هر فرد نیاز دارد بدهید و هر زمان خواستید آن را ویرایش کنید.",guideNotifications:"از طریق تلگرام هشدار بگیرید و نود را کنترل کنید. برای هشدارهای وضعیت، توکن ربات و آیدی چت خود را وارد کنید. ربات فرمان را روشن کنید تا نود را از داخل چت اجرا کنید: بررسی وضعیت، فهرست کاربران، و افزودن، فعال‌کردن، غیرفعال‌کردن یا بازنشانی یک کاربر. فقط آیدی‌های چت مدیری که فهرست می‌کنید می‌توانند به ربات فرمان بدهند.",navNetworkIps:"شبکه و آی‌پی‌ها",navRouting:"مسیریابی",navCleanIps:"آی‌پی‌های تمیز",navProxyCdn:"پروکسی / CDN",navActivity:"فعالیت",socWebsite:"وب‌سایت",dashSub:"وضعیت زندهٔ نود شما.",opOperational:"در حال کار",opOffline:"هستهٔ خاموش",dashLoadFail:"بارگیری آمار زنده ممکن نشد.",kpiLocation:"موقعیت",kpiCpu:"پردازنده",kpiCores:e=>e+" هسته",kpiMemory:"حافظه",kpiTraffic:"ترافیک امروز",kpiTotalSub:e=>"مجموع "+e,kpiDisk:"دیسک",kpiNa:"در دسترس نیست",kpiUptime:"زمان روشن‌بودن",kpiSinceBoot:"از آخرین راه‌اندازی",dashSystem:"سیستم",dashLogs:"لاگ‌ها",dashConfig:"پیکربندی",stXray:"Xray",stActive:e=>e?"فعال "+e:"فعال",stStopped:"متوقف",stOsUptime:"روشن‌بودن سیستم",stXrayUptime:"روشن‌بودن Xray",stLoad:"بار",stConns:"اتصال‌ها",stHost:"نام میزبان",stOn:"روشن",stOff:"خاموش",chartTitle:"ترافیک روزانه",chartSub:"۱۴ روز گذشته",dashTotalUsage:"مصرف کل",dashTotalUsageSub:"ترافیک تجمعی در این بازه",chartTotalLbl:"مجموع",policyTitle:"سیاست مقاومت",policyProfile:"کلیدهای سریع که با تنظیمات شبکهٔ شما هماهنگ‌اند.",policyActive:"فعال",policyHint:"تغییرها بی‌درنگ روی نود اعمال می‌شوند.",policyApply:"اعمال سیاست",autoTitle:"خودکارسازی",autoSubtitle:"کارهای روزمره‌ای که این نود خودش انجام می‌دهد.",autoHint:"این‌ها به‌طور خودکار در پس‌زمینه اجرا می‌شوند. چیزی برای مدیریت نیست.",autoApply:"ذخیرهٔ تغییرها",autoBackupLabel:"پشتیبان‌گیری خودکار",autoBackupDesc:"هر روز از تنظیمات پشتیبان بگیر و ۷ نسخهٔ آخر را روی همین سرور نگه دار.",autoBackupTgLabel:"ارسال پشتیبان‌ها به تلگرام",autoBackupTgDesc:"هر پشتیبان روزانه را به چت تلگر ,tgSetupNeedIran:"سرور ایران: یک وی‌پی‌اس ارزان داخل ایران با آی‌پی عمومی تمیز. فقط بک‌اند تونل روی آن اجرا می‌شود، بدون نصب کامل Nova و بدون پنل مخصوص خودش. کافی است یک دستور روی آن اجرا کنید.",tgSetupStepsH:"گام‌ها",tgStep1T:"تنظیمات را یک بار انتخاب کنید",tgStep1B:"این کار را همین‌جا روی پنل خارج انجام دهید. به تنظیمات شبکه و سپس تونل بروید و یک بک‌اند (Backhaul پیش‌فرض است؛ چهار مورد عبارت‌اند از Backhaul، BackPack، rathole و wstunnel)، یک ترنسپورت (tcpmux ساده‌ترین است؛ wssmux تونل را شبیه TLS معمولی جلوه می‌دهد) و یک پورت تونل (برای مثال 8443) انتخاب کنید. با دکمه یک توکن مشترک بسازید. فورواردها را روی 443 و 8443/udp نگه دارید (443 ترافیک عادی شما و 8443/udp ترافیک Hysteria2 را حمل می‌کند). روی هر دو سرور باید از همان بک‌اند، ترنسپورت، پورت تونل و توکن استفاده کنید.",tgStep2T:"این سرور خارج را به‌عنوان خروجی تنظیم کنید",tgStep2B:"همچنان در تنظیمات تونل همین پنل خارج، تنظیم کنید:",tgStep2L1:"نقش: خروجی (این سرور خارج، خروجی واقعی Nova شما را دارد)",tgStep2L2:"بک‌اند، ترنسپورت، پورت تونل، توکن: همان مقادیری که در گام ۱ انتخاب کردید",tgStep2L3:"آدرس پل: آی‌پی-سرور-ایران:پورت-تونل (برای مثال 203.0.113.10:8443). فقط خروجی این را تنظیم می‌کند.",tgStep2L4:"فورواردها: 443 و 8443/udp را نگه دارید",tgStep2B2:"ذخیره کنید. برای آدرس پل به آی‌پی عمومی وی‌پی‌اس ایران نیاز دارید، پس اول وی‌پی‌اس ارزان ایران را بگیرید و آی‌پی آن را یادداشت کنید.",tgAddrLabel:"نمونهٔ آدرس پل",tgStep3T:"پل ایران را با یک دستور راه‌اندازی کنید",tgStep3B:"در تنظیمات تونل بالا روی «ساخت دستور پل ایران» کلیک کنید، آن را کپی کنید و یک بار روی وی‌پی‌اس ایران خود اجرا کنید. همین یک دستور:",tgStep3L1:"فقط بک‌اند تونل را نصب می‌کند، بدون xray، بدون sing-box و بدون پنل",tgStep3L2:"از همان بک‌اند، ترنسپورت، پورت تونل و توکنی که قبلاً تنظیم کرده‌اید استفاده می‌کند، پس چیزی برای پیکربندی در سمت ایران نمی‌ماند",tgStep3L3:"پل را به‌طور خودکار راه می‌اندازد",tgStep3B2:"سپس این پورت‌ها را در فایروال وی‌پی‌اس ایران باز کنید: پورت تونل (TCP)، پورت 443 (TCP) و پورت 8443 (UDP).",tgStep4T:"کلاینت‌های خود را به سرور جی (egress)",inbFOutboundHint:"انتخاب کنید ترافیک این ورودی از کجا خارج شود. direct مستقیم از خود نود بیرون می‌رود. Tor و Psiphon آی‌پی خروجی را تغییر می‌دهند، WARP خروجی کلودفلر است، و یک خروجی سفارشی به سرور دیگری زنجیر می‌شود. Tor و Psiphon باید نصب و در حال اجرا باشند، که آن را در بخش مسیریابی مدیریت می‌کنید.",inbEgDirect:"مستقیم (پیش‌فرض)",inbEgWarp:"WARP",inbEgTor:"Tor",inbEgPsiphon:"Psiphon",tnBadgeRecommended:"پیشنهادی",tnBadgeNew:"جدید",tnBackhaulHelpT:"Backhaul",tnBackhaulHelpB:"یک تونل معکوس ایران‌به‌خارج ساخته‌شده برای همین کار، با گسترده‌ترین مجموعهٔ ترنسپورت (tcp، tcpmux، ws، wss، wsmux، wssmux) به‌همراه استخر اتصال. UDP را منتقل می‌کند، پس Hysteria2 به کار خود ادامه می‌دهد. برای ترنسپورت‌های wss گواهی خودامضا کافی است، پس به دامنه نیازی نیست. این را به‌عنوان پیش‌فرض انتخاب کنید. برای ساده‌ترین راه‌اندازی از tcpmux، یا برای پنهان‌کردن تونل به‌شکل HTTPS معمولی از wssmux استفاده کنید. هر دو سمت باید ترنسپورت، پورت و توکن یکسانی داشته باشند.",tnBackpackHelpT:"BackPack",tnBackpackHelpB:"یک موتور تازه‌تر از خانوادهٔ Backhaul که با Go نوشته شده، با نه ترنسپورت (tcp، tcpmux، ws، wss، wsmux، wssmux، udp، kcp، stealth) به‌همراه استخر اتصال. باینری‌های انتشار آن با چک‌سام SHA256 منتشر می‌شوند، پس نصب‌کننده پیش از استفاده آن‌ها را بررسی می‌کند. TCP و UDP را منتقل می‌کند. ترنسپورت stealth از یک دست‌دهی Noise بدون اثرانگشت ثابت استفاده می‌کند و kcp برای لینک‌های پرخطا تصحیح خطای رو‌به‌جلو اضافه می‌کند. بسیار توانمند است اما تنها چند هفته از عمرش می‌گذرد، پس آن را جدید در نظر بگیرید. همان قاعده برقرار است: ترنسپورت، پورت و توکن یکسان در هر دو سمت.",tnRatholeHelpT:"rathole",tnRatholeHelpB:"یک تونل معکوس سبک و جاافتاده به زبان Rust. مصرف منابع کم، TCP و UDP، با رمزنگاری اختیاری Noise یا TLS. ترنسپورت‌های کمتری نسبت به Backhaul یا BackPack دارد، اما گزینه‌ای مطمئن و کم‌مصرف برای یک پل ساده است. برای پنهان‌کاری از ترنسپورت noise یا tls استفاده کنید؛ tcp ساده روی یک لینک تمیز کافی است.",tnWstunnelHelpT:"wstunnel",tnWstunnelHelpB:"روی WebSocket یا HTTPS تونل می‌زند، پس مانند ترافیک وب عادی به نظر می‌رسد و به‌خوبی پشت یک CDN مانند کلودفلر قرار می‌گیرد. بهترین انتخاب وقتی است که می‌خواهید تونل را پشت یک دامنه یا CDN پنهان کنید نه اینکه یک پورت خام را در معرض دید بگذارید. برای بهره‌بردن از مزیت پنهان‌کاری‌اش به دامنه و TLS نیاز دارد. UDP را منتقل می‌کند، هرچند ابزارهای مبتنی بر QUIC حجم بالای UDP را کمی بهینه‌تر جابه‌جا می‌کنند.",tnChooseHelpT:"کدام بک‌اند را انتخاب کنیم",tnChooseHelpB:"- ساده‌ترین راه‌اندازی کارآمد: Backhaul با tcpmux.\n- ظاهرشدن مثل HTTPS بدون دامنه: Backhaul یا BackPack با wssmux (یک گواهی خودامضا برایتان ساخته می‌شود).\n- پنهان‌شدن پشت دامنهٔ کلودفلر: wstunnel.\n- کم‌مصرف‌ترین: rathole.\n- تازه‌ترین موتور با تأیید چک‌سام: BackPack.\nهر کدام را که انتخاب کردید، همان بک‌اند، ترنسپورت، پورت تونل و توکن را روی هر دو سمت، پل ایران و خروجی خارج، تنظیم کنید.",navSearch:"جستجو",searchPh:"جستجوی صفحه‌ها، تنظیمات، کاربران...",searchEmptyT:"چیزی پیدا نشد",searchEmptyD:"«دامنه»، «تونل»، «۲مرحله‌ای» یا «پشتیبان» را امتحان کنید.",searchJumpTo:"پرش به",searchResults:"نتایج",searchHintNav:"جابه‌جایی",searchHintOpen:"باز کردن",searchHintClose:"بستن",srDashT:"داشبورد",srDashD:"نمای کلی نود، وضعیت زنده و ترافیک",srUsersT:"کاربران",srUsersD:"افزودن کاربر، تعیین سهمیه، انقضا و محدودیت دستگاه",srInbT:"ورودی‌ها",srInbD:"پروتکل‌ها و پورت‌ها: VLESS، VMess، Trojan، Reality، WireGuard، Hysteria2",srOutT:"خروجی‌ها",srOutD:"خروج و زنجیره‌های پراکسی: freedom، SOCKS، HTTP، blackhole",srRouteT:"مسیریابی",srRouteD:"قوانین، GeoIP و GeoSite، WARP، Tor، مسدودسازی تبلیغات و DNS",srNetT:"شبکه و IPها",srNetD:"یک دامنه اضافه کنید و گواهی SSL رایگان بگیرید",srTunT:"تونل",srTunD:"پل ایران به خروجی خارج: رله و بک‌هال",srNodesT:"نودها",srNodesD:"مدیریت ناوگان چندنودی و نودهای نماینده",srGenT:"تنظیمات عمومی",srGenD:"پشتیبان‌گیری و بازیابی، به‌روزرسانی خودکار، رمز مدیر",srNotifT:"اعلان‌ها",srNotifD:"هشدارها و چت ربات تلگرام",srApiT:"توکن‌های API",srApiD:"توکن‌های Bearer برای REST API و یکپارچه‌سازی‌ها",srAdminsT:"مدیران و نمایندگان",srAdminsD:"زیرمدیرها، نماین ен на этом узле. Переустановите с помощью последней версии установщика узла или выполните: apt install amneziawg amneziawg-tools",awgActive:"AmneziaWG активен",awgEnabledDown:"Включён, но интерфейс не поднят. Попробуйте применить заново.",awgOff:"AmneziaWG выключен",awgEndpoint:"Конечная точка",awgLevel:"Сила обфускации",awgLight:"Лёгкая (низкие накладные расходы)",awgMedium:"Средняя (рекомендуется)",awgHeavy:"Сильная (максимальная обфускация)",awgPort:"UDP-порт",awgEnable:"Включить AmneziaWG",awgDisable:"Отключить",awgReapply:"Применить заново",awgSaved:"Сохранено",awgFail:"Действие не выполнено",awgPeers:"Клиенты",awgNoPeers:"Клиентов пока нет. Добавьте одного ниже, чтобы создать конфигурацию.",awgConnected:"подключён",awgNoHandshake:"рукопожатия ещё не было",awgGetConfig:"Конфигурация",dashAwgTitle:"Конфигурации AmneziaWG",dashAwgEmpty:"Клиентов пока нет. Добавьте одного в разделе WireGuard, чтобы создать конфигурацию.",dashAwgAdd:"Добавить клиента",awgRemovePeer:"Удалить клиента",awgPeerName:"Имя клиента",awgAddPeer:"Добавить клиента",awgConfigFor:"Конфигурация AmneziaWG для",awgConfigHint:"Импортируйте в приложение AmneziaWG (отсканируйте QR или скопируйте текст). Мусорные параметры совпадают с сервером, поэтому DPI не может его распознать.",awgDownload:"Скачать .conf",awgHowImport:"Как импортировать",awgConfigGuide:"Приложение AmneziaWG: нажмите +, затем «Сканировать QR-код» (или «Импорт из файла»). Приложение AmneziaVPN: скачайте .conf, нажмите +, затем «Файл с настройками подключения» (QR-код там не используйте).",guideTitle:"Руководство",guideLead:"Всё в этой панели, с пояснениями. Просматривайте разделы или ищите.",guideSearchPh:"Поиск по руководству",guideTocLabel:"В этом руководстве",guideNoResults:"Ни один раздел не соответствует запросу.",srGuideT:"Руководство",srGuideD:"Открыть полное руководство",guideS1t:"Добавьте пользователя",guideS1b:"Откройте «Пользователи», добавьте человека, затем передайте ему ссылку или QR-код через кнопку «Поделиться».",guideS2t:"Создайте входящее Reality",guideS2b:"Откройте «Входящие», выберите Reality + Vision, задайте порт и заимствованный SNI. Ключи узел создаст сам.",guideS3t:"Включите WARP",guideS3b:"Откройте WARP, зарегистрируйте бесплатный аккаунт, затем включите его. Включите «Обеспечить работу звонков» для голоса и видео.",guideS4t:"Поделитесь подпиской",guideS4b:"Откройте «Распространение» и отправьте ссылку подписки. Она импортирует всех включённых пользователей сразу.",unreachTitle:"Не удаётся связаться с узлом",unreachBody:"Агент узла Nova не ответил.",tryAgain:"Попробовать снова",grpNetset:"Настройки сети",grpSettings:"Настройки",settingsGeneral:"Общие",guideWhat:"Что это?",guideNetwork:"Это парадная дверь вашего узла. Задайте домен или IP, к которому подключаются клиенты, выберите, использует ли узел доверенный сертификат (реальный домен) или самоподписанный (только IP), и включайте или выключайте протоколы (VLESS, VMess, Trojan, Shadowsocks, Hysteria2, WireGuard). Добавляйте здесь чистые IP, когда основной адрес ограничивают.",guideRouting:"Определите, куда идёт каждый вид трафика. Каждое правило направляет подходящий трафик по одному пути: напрямую (прямо из узла), блокировка (отбрасывается) или дополнительный выход, такой как WARP, Tor или Psiphon. Сопоставляйте по домену, категории (geosite), стране (geoip), диапазону IP или протоколу. Включите обход цензуры, чтобы санкционные или заблокированные сайты автоматически шли через рабочий выход.",guideInbounds:'Входящие подключения - это точки входа, через которые подключаются клиенты, двух видов. Общий front на 443 несёт ваши CDN- и TLS-протоколы (VLESS, VMess и Trojan поверх WebSocket) вместе на одном порту за Cloudflare, поэтому их порт и Reality фиксированы; раньше они помечались как "main". Отдельные входящие подключения работают каждое на своём порту с полным набором возможностей протокола (Reality, gRPC, XHTTP, WS+TLS, Shadowsocks и другие). Ключи Reality и пароли Shadowsocks создаются автоматически, и каждое подключение может обслуживать всех пользователей или только выбранных.',guideUsers:"Управляйте тем, кто может пользоваться узлом. Для каждого пользователя можно задать квоту трафика (общую или раздельно на отдачу и приём), срок действия (фиксированный или отсчитываемый от первого подключения), лимит устройств и IP, а также автоматический цикл сброса. Каждый пользователь получает личную ссылку и страницу подписки со всеми своими конфигами и статистикой в реальном времени.",guideNodes:"Управляйте несколькими серверами из одной панели. Самый простой способ - «Добавить узел одной командой»: сгенерируйте однострочную команду, запустите её на новом VPS, и этот сервер установится как управляемый узел и сам зарегистрируется здесь, без отдельной панели на нём. Узел можно добавить и вручную по адресу и API-токену. После этого панель отображает и ведёт пользователей всех узлов вместе с вашими и может добавлять новых на любой узел. Каждый узел продолжает обслуживать трафик, даже если эта панель офлайн. Удобно, когда вы или реселлер держите несколько серверов.",guideTunnel:"Соедините иранский сервер с зарубежным, чтобы обойти ограничение скорости. Запустите этот узел как мост (иранская сторона, где клиенты подключаются к чистому внутреннему IP) или как выход (зарубежная сторона с настоящим выходом Nova). Трафик туннелируется между ними по устойчивому к цензуре транспорту. У обеих сторон должны совпадать бэкенд, транспорт, порт и токен. Форварды по умолчанию несут и обычный трафик, и Hysteria2. Выбирайте Backhaul или BackPack для максимума возможностей, rathole для лёгкого следа или wstunnel, чтобы скрыться за CDN.",guideSettings:"Общие параметры узла: настройка отпечатка и фрагментации, 0-RTT, рандомизация пути и другие переключатели на стороне клиента. Они точно настраивают то, как клиенты подключаются, ради лучшей скорости и незаметности в конкретной сети.",guideXray:"Продвинутое управление движком: уровень логов и какие логи хранить, стратегия маршрутизации и исходящего IP, поведение DNS и опциональные метрики Prometheus. Оставьте значения по умолчанию, если только не уверены, что их нужно менять.",guideApi:"Управляйте этим узлом из собственных инструментов. Создайте токен, затем обращайтесь к REST API по адресу /api/v1 с заголовком Authorization: Bearer, чтобы просматривать и вести пользователей, читать статистику и не только. Токены владельца имеют полный доступ; токены реселлера видят только своих пользователей. Токен показывается один раз при создании, поэтому скопируйте его сразу.",guideAdmins:"Добавьте больше людей, которые могут входить в систему, каждому с ролью и набором прав на ваш выбор. Владелец (вы) имеет полный контроль. Реселлер видит только пользователей, которых сам создаёт, поэтому подходит партнёру, перепродающему доступ. Менеджер видит всех пользователей узла и подходит доверенному коллеге, помогающему вам с управлением. Ни тот, ни другой не могут менять настройки узла, сети, маршрутизации или системы. С помощью флажков прав выдайте ровно то, что нужно каждому, и меняйте это в любой момент.",guideNotifications:"Получайте оповещения и управляйте узлом из Telegram. Укажите токен бота и chat id для оповещений о состоянии. Включите командного бота, чтобы управлять узлом прямо из чата: проверять статус, смотреть список пользователей, а также добавлять, включать, отключать или сбрасывать пользователя. Командовать ботом могут только перечисленные вами chat id администраторов.",navNetworkIps:"Сеть и IP",navRouting:"Маршрутизация",navCleanIps:"Чистые IP",navProxyCdn:"Прокси / CDN",navActivity:"Активность",socWebsite:"Сайт",dashSub:"Актуальное состояние вашего узла.",opOperational:"Работает",opOffline:"Ядро отключено",dashLoadFail:"Не удалось загрузить актуальную статистику.",kpiLocation:"Расположение",kpiCpu:"ЦП",kpiCores:e=>{const t=e%10,n=e%100;let a;return a=1===t&&11!==n?"ядро":t>=2&&t<=4&&(n<12||n>14)?"ядра":"ядер",e+" "+a},kpiMemory:"Память",kpiTraffic:"Трафик за сегодня",kpiTotalSub:e=>"Всего "+e,kpiDisk:"Диск",kpiNa:"Нед ик. Вы назначаете один из них входящему подключению или правилу маршрутизации, и подходящий трафик выходит по этому пути. Встроенные исходящие доступны всегда: direct идёт прямо из узла, block отбрасывает трафик, а WARP, Tor и Psiphon меняют выход. Добавьте свой исходящий, чтобы направить трафик на другой сервер по SOCKS или HTTP, либо вставьте полный исходящий xray как сырой JSON.",outAdd:"Добавить исходящий",outBuiltinTitle:"Встроенные исходящие",outBuiltinBadge:"Встроенный",outCustomTitle:"Свои исходящие",outNoneTitle:"Нет своих исходящих",outNoneBody:"Добавьте свой исходящий, чтобы направить трафик этого узла на другой сервер, или вставьте сырой исходящий xray.",outBiDirect:"Прямо из узла, с собственным IP сервера.",outBiBlock:"Отбрасывает подходящий трафик.",outBiWarp:"Выход через Cloudflare WARP, чистый IP Cloudflare.",outBiTor:"Выходит через сеть Tor со случайным IP.",outBiPsiphon:"Выходит через Psiphon со случайным IP.",outEnableAria:e=>"Включить исходящий "+e,outEditAria:e=>"Изменить исходящий "+e,outDeleteAria:e=>"Удалить исходящий "+e,outEnabled:"Исходящий включён.",outDisabled:"Исходящий отключён.",outCreate:"Создать исходящий",outEditTitle:"Изменить исходящий",outSave:"Сохранить исходящий",outSaveChanges:"Сохранить изменения",outCreated:"Исходящий создан.",outUpdated:"Исходящий обновлён.",outDeleted:"Исходящий удалён.",outFName:"Имя / тег",outFNamePh:"my-exit",outFNameHint:"Уникальный тег для этого исходящего. Буквы, цифры, точка и дефис. Не может совпадать с зарезервированным именем (direct, block, warp, tor, psiphon).",outFRemark:"Заметка",outFRemarkPh:"Необязательная заметка",outFType:"Тип",outTypeFreedom:"Freedom (напрямую)",outTypeBlackhole:"Blackhole (блокировка)",outTypeSocks:"SOCKS",outTypeHttp:"HTTP",outTypeRaw:"Сырой JSON",outFAddress:"Адрес",outFAddressPh:"exit.example.com",outFPort:"Порт",outFUser:"Имя пользователя",outFUserPh:"Необязательно",outFPass:"Пароль",outFPassPh:"Необязательно",outFRawLabel:"JSON исходящего",outFRawHint:"Полный объект исходящего xray. При сохранении узел проверяет его тестом конфигурации.",outTypeNoFields:"Этому типу не нужны дополнительные настройки.",outErrName:"Введите имя для этого исходящего.",outErrNameReserved:"Это имя зарезервировано за встроенным исходящим. Выберите другое.",outErrNameDup:"Исходящий с таким именем уже существует.",outErrAddress:"Введите адрес сервера.",outErrPort:"Введите корректный порт.",outErrRaw:"JSON некорректен.",outSaveFail:"Не удалось сохранить исходящий.",outLoadFail:"Не удалось загрузить исходящие.",outDeleteT:"Удалить этот исходящий?",outDeleteB:e=>"Исходящий «"+e+"» будет удалён. Любое входящее или правило, использующее его, вернётся к direct.",outDelete:"Удалить исходящий",inbFOutbound:"Исходящий (egress)",inbFOutboundHint:"Выберите, где выходит трафик этого входящего. Direct идёт прямо из узла. Tor и Psiphon меняют выходной IP, WARP - это выход Cloudflare, а свой исходящий связывает с другим сервером. Tor и Psiphon должны быть установлены и запущены, чем вы управляете в разделе маршрутизации.",inbEgDirect:"Direct (по умолчанию)",inbEgWarp:"WARP",inbEgTor:"Tor",inbEgPsiphon:"Psiphon",tnBadgeRecommended:"Рекомендуется",tnBadgeNew:"Новый",tnBackhaulHelpT:"Backhaul",tnBackhaulHelpB:"Специально созданный обратный туннель Иран-заграница с самым широким набором транспортов (tcp, tcpmux, ws, wss, wsmux, wssmux) и пулом соединений. Он несёт UDP, поэтому Hysteria2 продолжает работать. Для транспортов wss подходят самоподписанные сертификаты, так что домен не нужен. Выбирайте его по умолчанию. Используйте tcpmux для самой простой настройки или wssmux, чтобы замаскировать туннель под обычный HTTPS. У обеих сторон должны совпадать транспорт, порт и токен.",tnBackpackHelpT:"BackPack",tnBackpackHelpB:"Более новый движок класса Backhaul, написанный на Go, с девятью транспортами (tcp, tcpmux, ws, wss, wsmux, wssmux, udp, kcp, stealth) и пулом соединений. Его релизные бинарники публикуются с контрольными суммами SHA256, поэтому установщик проверяет их перед использованием. Он несёт TCP и UDP. Транспорт stealth использует рукопожатие Noise без фиксированного отпечатка, а kcp добавляет упреждающую коррекцию ошибок для линий с потерями. Он очень мощный, но ему всего несколько недель, так что считайте его новым. Правило то же: совпадающие транспорт, порт и токен на обеих сторонах.",tnRatholeHelpT:"rathole",tnRatholeHelpB:"Лёгкий, хорошо зарекомендовавший себя обратный туннель на Rust. Малое потребление ресурсов, TCP и UDP, с необязательным шифрованием Noise или TLS. Транспортов меньше, чем у Backhaul или BackPack, но это надёжный и экономичный выбор для простого моста. Для маскировки используйте транспорт noise или tls; на чистой линии достаточно обычного tcp.",tnWstunnelHelpT:"wstunnel",tnWstunnelHelpB:"Туннелирует поверх WebSocket или HTTPS, поэтому выглядит как обычный веб-трафик и аккуратно прячется за CDN вроде Cloudflare. Лучше всего, когда вы хотите скрыть туннель за доменом или CDN, а не выставлять сырой порт. Чтобы реализовать преимущество скрытности, нужны домен и TLS. Он несёт UDP, хотя инструменты на базе QUIC перекачивают тяжёлый UDP немного эффективнее.",tnChooseHelpT:"Какой бэкенд выбрать",tnChooseHelpB:"- Самая простая рабочая настройка: Backhaul с tcpmux.\n- Маскировка под HTTPS без домена: Backhaul или BackPack с wssmux (самоподписанный сертификат создаётся за вас).\n- Спрятаться за доменом Cloudflare: wstunnel.\n- Наименьший след: rathole.\n- Новейший движок с проверкой контрольной суммы: BackPack.\nЧто бы вы ни выбрали, задайте одинаковые бэкенд, транспорт, порт туннеля и токен на обеих сторонах: иранском мосту и зарубежном выходе.",navSearch:"Поиск",searchPh:"Поиск по страницам, настройкам, пользователям...",searchEmptyT:"Ничего не найдено",searchEmptyD:"Попробуйте «домен», «туннель», «2fa» или «резервная копия».",searchJumpTo:"Перейти к",searchResults:"Результаты",searchHintNav:"перемещение",searchHintOpen:"открыть",searchHintClose:"закрыть",srDashT:"Панель",srDashD:"Обзор узла, статус в реальном в
