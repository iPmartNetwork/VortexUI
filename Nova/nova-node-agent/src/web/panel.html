/* ============================================================
   Nova Server Agent panel. Single file, no external resources.
   Dark-first control panel: deep near-black, one cyan accent.
   ============================================================ */

/* --- Tokens: Nova design language. Dark-first (root = dark); light via
   data-theme="light" or prefers-color-scheme. Names + values mirror the
   main Nova panel so the node feels like part of the same product. --- */
:root {
  --font-sans: 'Vazirmatn','Inter',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Tahoma,Helvetica,Arial,sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "Vazirmatn", monospace;

  /* Canonical Nova tokens (dark) */
  --bg: #070809;
  --panel: #0c0e12;
  --card: #101319;
  --card2: #0b0d11;
  --bd: #1c2027;
  --bd2: #262b34;
  --tx: #e9edf4;
  --tx2: #aeb6c4;
  --mu: #7c8698;
  --ac: #22d3ee;
  --ac2: #7c5cff;
  --ac-ink: #04121a;
  --ac-hover: #4fdfef;
  --grad: linear-gradient(120deg,#22d3ee,#7c5cff);
  --ok: #34d399;
  --wn: #f5b042;
  --dg: #f87171;
  --ac-soft: color-mix(in srgb, var(--ac) 14%, transparent);
  --ac-line: color-mix(in srgb, var(--ac) 38%, transparent);
  --ok-soft: color-mix(in srgb, var(--ok) 15%, transparent);
  --wn-soft: color-mix(in srgb, var(--wn) 16%, transparent);
  --dg-soft: color-mix(in srgb, var(--dg) 15%, transparent);

  /* Metric hue palette (dark): a small, cohesive set of brand-family hues used for
     per-tile and per-gauge identity so the panel reads colorful but deliberate.
     Status meaning stays on --good / --warn / --bad; these are identity only.
     Light-theme values are defined in the light blocks below. */
  --h-blue: #38bdf8;
  --h-violet: #a78bfa;
  --h-indigo: #818cf8;
  --h-teal: #2dd4bf;
  --h-rose: #fb7185;

  /* Elevation surfaces (dark): whisper-quiet steps above --card */
  --surface-1: var(--card);
  --surface-2: #151a21;
  --surface-3: #1c222b;
  --input-bg: var(--card2);

  --ring: 0 0 0 3px color-mix(in srgb, var(--ac) 35%, transparent);
  --shadow-pop: 0 0 0 1px rgba(255,255,255,0.08), 0 12px 34px -8px rgba(0,0,0,0.66);
  /* Resting elevation for top-level surfaces: a hairline top-light plus a tight,
     soft grounding drop. Dark leans on a near-black drop that reads on the deep bg. */
  --shadow-card: 0 1px 0 rgba(255,255,255,0.02), 0 10px 26px -14px rgba(0,0,0,0.72);
  --shadow-card-hover: 0 1px 0 rgba(255,255,255,0.03), 0 14px 30px -12px rgba(0,0,0,0.78);

  --r-xs: 6px;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r: 12px;
  --rs: 9px;

  --sp: 4px;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);

  /* Aliases: existing component CSS keeps working, now Nova-colored */
  --border: var(--bd);
  --border-strong: var(--bd2);
  --text: var(--tx);
  --text-2: var(--tx2);
  --text-3: var(--mu);
  --accent: var(--ac);
  --accent-hover: var(--ac-hover);
  --accent-ink: var(--ac-ink);
  --accent-soft: var(--ac-soft);
  --accent-line: var(--ac-line);
  --good: var(--ok);
  --good-soft: var(--ok-soft);
  --warn: var(--wn);
  --warn-soft: var(--wn-soft);
  --bad: var(--dg);
  --bad-soft: var(--dg-soft);
}

/* Light palette, shared by an explicit choice and a light system preference. */
html[data-theme="light"] {
  --bg: #f8fafc;
  --panel: #ffffff;
  --card: #ffffff;
  --card2: #f2f5f8;
  --bd: #e6eaf1;
  --bd2: #d6dde8;
  --tx: #101622;
  --tx2: #3a465c;
  --mu: #5f6a7d;
  --ac: #0ea5c4;
  --ac2: #7c3aed;
  --ac-ink: #ffffff;
  --ac-hover: #0b8ca8;
  --grad: linear-gradient(120deg,#0891b2,#7c3aed);
  --ok: #047857;
  --wn: #b45309;
  --dg: #dc2626;

  /* Metric hue palette (light): deeper hues so glyphs and tints stay AA on white. */
  --h-blue: #0284c7;
  --h-violet: #7c3aed;
  --h-indigo: #4f46e5;
  --h-teal: #0d9488;
  --h-rose: #e11d48;

  --surface-1: #ffffff;
  --surface-2: #ffffff;
  --surface-3: #eef2f7;
  --input-bg: #eef2f6;

  --ring: 0 0 0 3px color-mix(in srgb, var(--ac) 26%, transparent);
  --shadow-pop: 0 1px 2px rgba(13,21,32,0.06), 0 12px 30px -10px rgba(13,21,32,0.22);
  --shadow-card: 0 1px 2px rgba(16,24,40,0.05), 0 10px 24px -14px rgba(16,24,40,0.14);
  --shadow-card-hover: 0 2px 4px rgba(16,24,40,0.06), 0 14px 28px -12px rgba(16,24,40,0.20);
}
@media (prefers-color-scheme: light) {
  html:not([data-theme="dark"]) {
    --bg: #f8fafc;
    --panel: #ffffff;
    --card: #ffffff;
    --card2: #f2f5f8;
    --bd: #e6eaf1;
    --bd2: #d6dde8;
    --tx: #101622;
    --tx2: #3a465c;
    --mu: #5f6a7d;
    --ac: #0ea5c4;
    --ac2: #7c3aed;
    --ac-ink: #ffffff;
    --ac-hover: #0b8ca8;
    --grad: linear-gradient(120deg,#0891b2,#7c3aed);
    --ok: #047857;
    --wn: #b45309;
    --dg: #dc2626;

    --h-blue: #0284c7;
    --h-violet: #7c3aed;
    --h-indigo: #4f46e5;
    --h-teal: #0d9488;
    --h-rose: #e11d48;

    --surface-1: #ffffff;
    --surface-2: #ffffff;
    --surface-3: #eef2f7;
    --input-bg: #eef2f6;

    --ring: 0 0 0 3px color-mix(in srgb, var(--ac) 26%, transparent);
    --shadow-pop: 0 1px 2px rgba(13,21,32,0.06), 0 12px 30px -10px rgba(13,21,32,0.22);
    --shadow-card: 0 1px 2px rgba(16,24,40,0.05), 0 10px 24px -14px rgba(16,24,40,0.14);
    --shadow-card-hover: 0 2px 4px rgba(16,24,40,0.06), 0 14px 28px -12px rgba(16,24,40,0.20);
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; overflow-x: clip; }
body { overflow-x: clip; }
body {
  margin: 0;
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }

h1,h2,h3 { margin: 0; font-weight: 600; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
button { font-family: inherit; }
:focus-visible { outline: none; box-shadow: var(--ring); border-radius: var(--r-sm); }

/* Accent-tinted text selection */
::selection { background: color-mix(in srgb, var(--ac) 28%, transparent); color: var(--tx); }

/* Refined, theme-aware scrollbars (thin thumb that surfaces on hover) */
* { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--tx) 16%, transparent) transparent; }
::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: color-mix(in srgb, var(--tx) 15%, transparent);
  border-radius: 999px; border: 3px solid transparent; background-clip: padding-box;
}
::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--tx) 26%, transparent); background-clip: padding-box; }

/* --- App shell: collapsible left sidebar (Nova admin pattern) --- */
.app { min-height: 100dvh; display: flex; --sidebar: 248px; }
.app.app-boot { flex-direction: column; }

/* Sidebar */
.sidebar {
  width: var(--sidebar); flex: 0 0 var(--sidebar);
  background: var(--panel); border-inline-end: 1px solid var(--border);
  position: sticky; top: 0; height: 100dvh; overflow: hidden;
  display: flex; flex-direction: column; padding: 18px 14px; gap: 6px; z-index: 40;
  transition: width .18s var(--ease-out);
}
/* Brand, search and footer stay fixed; only the nav list between them scrolls. */
.sidebar > .brand, .sidebar > .nav-search, .sidebar > .side-foot { flex: none; }

/* Brand block */
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.sidebar .brand { padding: 6px 8px 14px; }
.mark {
  width: 34px; height: 34px; flex: none;
  display: grid; place-items: center;
  filter: drop-shadow(0 2px 10px color-mix(in srgb, var(--ac) 40%, transparent));
}
.mark svg { width: 100%; height: 100%; display: block; }
.brand-txt { min-width: 0; }
.brand-name { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.1; }
.brand-status { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.brand-status span { font-size: 11.5px; color: var(--text-3); white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; position: relative; }
.dot.on { background: var(--good); box-shadow: 0 0 0 0 var(--good-soft); }
.dot.on::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: var(--good); animation: pulse 2.4s var(--ease-out) infinite;
}
.dot.off { background: var(--text-3); }
@keyframes pulse { 0% { opacity: .55; transform: scale(1); } 70%,100% { opacity: 0; transform: scale(2.6); } }
@media (prefers-reduced-motion: reduce) { .dot.on::after { animation: none; } }

/* Nav items */
/* The nav list is the one scrolling region of the sidebar: it flexes to fill the
   space between the fixed header and footer, scrolls on its own with momentum, and
   wears a slim custom scrollbar so the heavy OS bar never jumps into view. */
.side-nav {
  display: flex; flex-direction: column; gap: 2px; margin-top: 4px;
  flex: 1 1 auto; min-height: 0;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent;
  padding-inline-end: 2px;
  /* Isolate the scroller's layout so a group expand/collapse can never reflow the
     rest of the shell, and let the browser keep the list on its own paint layer.
     Native inertial scrolling stays in charge (no scroll-behavior:smooth fighting
     the trackpad), which is what actually makes this feel smooth. */
  contain: layout;
}
.side-nav::-webkit-scrollbar { width: 8px; }
.side-nav::-webkit-scrollbar-track { background: transparent; }
.side-nav::-webkit-scrollbar-thumb {
  background: var(--border); border-radius: 999px;
  border: 2px solid transparent; background-clip: padding-box;
}
.side-nav:hover::-webkit-scrollbar-thumb { background: var(--border-strong); background-clip: padding-box; }
.side-nav::-webkit-scrollbar-thumb:hover { background: var(--text-3); background-clip: padding-box; }
.nav-item {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 9px 12px; border: 0; background: transparent;
  border-radius: var(--r-sm); color: var(--text-2);
  font: inherit; font-size: 13.5px; font-weight: 500; text-align: start;
  position: relative; cursor: pointer;
  transition: background .13s var(--ease-out), color .13s var(--ease-out);
}
.nav-item svg { width: 18px; height: 18px; flex: 0 0 18px; opacity: .85; }
.nav-item > span:not(.count) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item .count {
  margin-inline-start: auto; font-size: 11px; font-weight: 700; color: var(--text-3);
  background: var(--card2); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px;
}
/* Neutral wash on hover (theme-agnostic: lightens on dark, tints on light),
   accent wash on the active tab so the two states never read the same. */
.nav-item:hover { background: color-mix(in srgb, var(--text) 6%, transparent); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--text); }
.nav-item.active::before {
  content: ""; position: absolute; inset-inline-start: 0; top: 8px; bottom: 8px;
  width: 3px; border-radius: 0 3px 3px 0; background: var(--grad);
}
html[dir="rtl"] .nav-item.active::before { border-radius: 3px 0 0 3px; }
.nav-item.active svg { opacity: 1; color: var(--accent); }
.nav-item.active .count {
  color: var(--accent); border-color: var(--accent-line);
  background: color-mix(in srgb, var(--accent) 12%, transparent);
}

/* Sidebar footer */
.side-foot {
  margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 10px;
}
.side-foot .ver { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--text-3); padding: 0 6px 2px; }
.side-foot .ver b { color: var(--text-2); font-weight: 600; font-family: var(--font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Desktop collapse-to-rail toggle */
.nav-collapse {
  display: flex; align-items: center; gap: 11px; width: 100%; padding: 9px 12px;
  border: 1px solid var(--border); background: var(--card2); color: var(--text-2);
  border-radius: var(--r-sm); cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 600;
  transition: color .12s var(--ease-out), border-color .12s var(--ease-out);
}
.nav-collapse:hover { color: var(--accent); border-color: var(--border-strong); }
.nav-collapse svg { width: 18px; height: 18px; flex: 0 0 18px; transition: transform .2s var(--ease-out); }
html[dir="rtl"] .nav-collapse svg { transform: rotate(180deg); }

/* Sidebar logout */
.side-logout {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 38px;
  border: 1px solid var(--border); border-radius: var(--r-sm); background: transparent;
  color: var(--text-2); font: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer;
  transition: color .12s var(--ease-out), border-color .12s var(--ease-out);
}
.side-logout:hover { border-color: var(--bad); color: var(--bad); }
.side-logout svg { width: 16px; height: 16px; flex: none; }

/* Address pill (sidebar + loading header) */
.addr-pill {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 12px; padding: 6px 12px; border-radius: 999px;
  background: var(--surface-1); border: 1px solid var(--border);
  color: var(--text-2); max-width: min(320px, 38vw); overflow: hidden;
}
.side-foot .addr-pill { width: 100%; max-width: 100%; }
.addr-pill .addr-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
.addr-pill b { color: var(--text); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

/* Collapsed icon rail (desktop) */
.app.nav-collapsed { --sidebar: 74px; }
.app.nav-collapsed .sidebar { padding-inline: 12px; }
.app.nav-collapsed .brand { justify-content: center; }
.app.nav-collapsed .brand-txt { display: none; }
.app.nav-collapsed .nav-item { justify-content: center; padding-inline: 0; }
.app.nav-collapsed .nav-item > span { display: none; }
.app.nav-collapsed .side-foot .addr-pill,
.app.nav-collapsed .side-foot .ver { display: none; }
.app.nav-collapsed .side-logout span { display: none; }
.app.nav-collapsed .side-logout { font-size: 0; }
.app.nav-collapsed .nav-collapse { justify-content: center; }
.app.nav-collapsed .nav-collapse span { display: none; }
.app.nav-collapsed .nav-collapse svg { transform: rotate(180deg); }
html[dir="rtl"] .app.nav-collapsed .nav-collapse svg { transform: rotate(0deg); }

/* --- Sidebar search trigger (opens the command palette) --- */
.nav-search {
  display: flex; align-items: center; gap: 10px; width: 100%;
  margin: 2px 0 8px; padding: 9px 12px;
  border: 1px solid var(--border); background: var(--input-bg);
  border-radius: var(--r-sm); color: var(--text-3);
  font: inherit; font-size: 13px; font-weight: 500; text-align: start; cursor: pointer;
  transition: border-color .13s var(--ease-out), color .13s var(--ease-out);
}
.nav-search:hover { border-color: var(--border-strong); color: var(--text-2); }
.nav-search svg { width: 16px; height: 16px; flex: 0 0 16px; opacity: .8; }
.nav-search .ns-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-inline-end: auto; }
.nav-search .ns-kbd {
  flex: none; font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; letter-spacing: .02em;
  color: var(--text-3); background: var(--card2); border: 1px solid var(--border);
  border-radius: 5px; padding: 1px 6px; line-height: 1.55; white-space: nowrap;
}
.app.nav-collapsed .nav-search { justify-content: center; padding-inline: 0; }
.app.nav-collapsed .nav-search .ns-label,
.app.nav-collapsed .nav-search .ns-kbd { display: none; }

/* --- Command palette (Cmd/Ctrl+K) --- */
.cmdk-scrim {
  position: fixed; inset: 0; z-index: 120;
  background: rgba(3,6,10,0.6);
  -webkit-backdrop-filter: saturate(120%) blur(6px); backdrop-filter: saturate(120%) blur(6px);
  display: grid; justify-items: center; align-items: start;
  padding: max(11vh, 56px) 16px 16px;
  animation: fade .13s var(--ease-out);
}
.cmdk {
  width: 100%; max-width: 560px;
  background: var(--surface-2); border: 1px solid var(--border-strong);
  border-radius: var(--r-lg); box-shadow: var(--shadow-pop);
  display: flex; flex-direction: column; overflow: hidden;
  max-height: min(64vh, 560px);
  animation: cmdkpop .16s var(--ease-out);
}
@keyframes cmdkpop { from { opacity: 0; transform: translateY(-6px) scale(.99); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .cmdk-scrim, .cmdk { animation: none; } }
.cmdk-search { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
.cmdk-search > svg { width: 18px; height: 18px; flex: none; color: var(--text-3); }
.cmdk-input {
  flex: 1; min-width: 0; border: 0; background: transparent; outline: none;
  color: var(--text); font: inherit; font-size: 15px; font-weight: 500;
}
.cmdk-input::placeholder { color: var(--text-3); font-weight: 400; }
.cmdk-esc {
  flex: none; font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; color: var(--text-3);
  background: var(--card2); border: 1px solid var(--border); border-radius: 5px; padding: 2px 7px; cursor: pointer;
}
.cmdk-list { overflow-y: auto; padding: 6px; overscroll-behavior: contain; }
.cmdk-group { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); font-weight: 700; padding: 8px 10px 4px; }
.cmdk-item {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 9px 10px; border: 0; background: transparent; border-radius: var(--r-sm);
  color: var(--text-2); font: inherit; text-align: start; cursor: pointer;
  transition: background .1s var(--ease-out);
}
.cmdk-icn {
  width: 34px; height: 34px; flex: none; display: grid; place-items: center;
  border-radius: var(--r-xs); background: var(--card2); border: 1px solid var(--border); color: var(--text-2);
}
.cmdk-icn svg { width: 17px; height: 17px; }
.cmdk-txt { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.cmdk-t { font-size: 13.5px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmdk-d { font-size: 12px; color: var(--text-3); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmdk-go { flex: none; opacity: 0; color: var(--text-3); display: grid; place-items: center; transition: opacity .1s var(--ease-out); }
.cmdk-go svg { width: 16px; height: 16px; }
html[dir="rtl"] .cmdk-go svg { transform: scaleX(-1); }
.cmdk-item:hover:not(.sel) { background: color-mix(in srgb, var(--text) 6%, transparent); }
.cmdk-item.sel { background: var(--accent-soft); color: var(--text); }
.cmdk-item.sel .cmdk-icn { border-color: var(--accent-line); color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.cmdk-item.sel .cmdk-go { opacity: 1; color: var(--accent); }
.cmdk-empty { padding: 34px 20px; text-align: center; }
.cmdk-empty .ce-t { font-size: 13.5px; font-weight: 600; color: var(--text-2); }
.cmdk-empty .ce-d { font-size: 12.5px; color: var(--text-3); margin-top: 4px; }
.cmdk-foot { display: flex; align-items: center; gap: 16px; padding: 9px 14px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.cmdk-hint { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-3); }
.cmdk-hint kbd {
  font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; color: var(--text-2);
  background: var(--card2); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; min-width: 18px; text-align: center; line-height: 1.5;
}
@media (max-width: 560px) { .cmdk-foot { display: none; } }

/* Main column */
.main-col { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }

/* Persistent app header: carries the language + theme controls on every view, and
   the drawer trigger + page title on mobile. Full-bleed sticky bar; its inner
   aligns with the 960px content column so the controls sit above the view head.
   Stays put when the sidebar collapses to the rail (it lives in the main column). */
.app-topbar {
  position: sticky; top: 0; z-index: 30;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  -webkit-backdrop-filter: saturate(140%) blur(12px); backdrop-filter: saturate(140%) blur(12px);
  border-bottom: 1px solid var(--border);
}
.app-topbar-inner {
  max-width: 960px; width: 100%; margin: 0 auto; padding: 10px 20px;
  display: flex; align-items: center; gap: 12px;
}
.app-topbar-inner .head-controls { margin-inline-start: auto; }
.app-topbar .mark { filter: none; flex: none; }
.app-topbar .m-title {
  font-size: 14px; font-weight: 600; letter-spacing: -0.01em;
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* Drawer trigger, logo and page title are mobile-only; desktop shows just the
   controls, right-aligned (mirrored to the left in RTL via inline-start auto). */
.app-topbar .menu-btn, .app-topbar .mark, .app-topbar .m-title { display: none; }
.menu-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 38px; height: 38px; flex: none; border: 1px solid var(--border);
  background: var(--card); border-radius: var(--r-sm); color: var(--text); cursor: pointer;
}
.menu-btn svg { width: 20px; height: 20px; }

/* Mobile drawer scrim (own class so it never collides with the modal overlay). */
.nav-scrim { position: fixed; inset: 0; background: rgba(2,6,12,.55); z-index: 55; opacity: 0; pointer-events: none; transition: opacity .2s var(--ease-out); }
.nav-scrim.show { opacity: 1; pointer-events: auto; }

/* Loading / boot header (reuses .topbar for the column layout) */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  -webkit-backdrop-filter: saturate(140%) blur(12px);
  backdrop-filter: saturate(140%) blur(12px);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: 960px; margin: 0 auto; padding: 12px 20px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.topbar-inner .brand { margin-inline-end: auto; }

/* Content */
main { max-width: 960px; width: 100%; margin: 0 auto; padding: 22px 20px 64px; flex: 1; }
.view { display: none; }
.view.active { display: block; animation: fade .22s var(--ease-out); }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .view.active { animation: none; } }

.view-head { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 18px; }
.view-head .htxt { margin-inline-end: auto; min-width: 0; }
.view-head .btn { flex: none; }
.view-head h2 { font-size: 20px; font-weight: 640; letter-spacing: -0.02em; line-height: 1.15; }
.view-head p { color: var(--text-3); font-size: 13px; line-height: 1.5; margin-top: 4px; max-width: 64ch; }

/* Settings page sub-tab strip: folds Notifications, API, Admins and Info onto the
   Settings page as scannable sub-sections. Reuses the accent tokens. */
.settings-tabs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 18px; padding: 5px;
  border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface-2); }
.settings-tabs button { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px; padding: 8px 13px;
  border-radius: var(--r-sm); border: 1px solid transparent; background: transparent; color: var(--text-2);
  font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
  transition: background .14s var(--ease-out), color .14s var(--ease-out), border-color .14s var(--ease-out); }
.settings-tabs button svg { width: 15px; height: 15px; flex: none; opacity: .85; }
.settings-tabs button:hover { color: var(--text); background: var(--surface-3); }
.settings-tabs button.is-on { color: var(--accent); background: var(--accent-soft); border-color: var(--accent-line); }
.settings-tabs button.is-on svg { opacity: 1; }
.settings-help { margin-inline-start: auto; display: inline-flex; align-items: center; }
.settings-tabs .book-btn { flex: none; padding: 6px; gap: 0; font-weight: 500; }
/* Each sub-section drops its own top margin so it sits flush under the strip. */
.settings-panel > .view { animation: none; }
.settings-panel > .view > .view-head { margin-bottom: 16px; }

/* Cards */
.card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-card);
}
.card + .card { margin-top: 14px; }
.card-pad { padding: 18px; }

/* Buttons */
.btn {
  appearance: none; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 36px; padding: 0 16px;
  white-space: nowrap;
  font-size: 13.5px; font-weight: 500; line-height: 1;
  border-radius: var(--r-sm);
  border: 1px solid transparent;
  background: var(--surface-2); color: var(--text);
  border-color: var(--border-strong);
  transition: background .14s var(--ease-out), border-color .14s var(--ease-out), transform .08s var(--ease-out);
  position: relative;
}
.btn:hover { background: var(--surface-3); }
.btn:active { transform: scale(0.975); }
.btn svg { width: 15px; height: 15px; flex: none; }
.btn.primary { background: var(--grad); color: var(--ac-ink); border-color: transparent; font-weight: 600;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 1px 2px rgba(4,10,20,0.28),
    0 6px 16px -8px color-mix(in srgb, var(--ac) 52%, transparent); }
.btn.primary:hover { background: var(--grad); filter: brightness(1.05);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.26), 0 1px 2px rgba(4,10,20,0.3),
    0 9px 22px -8px color-mix(in srgb, var(--ac) 60%, transparent); }
.btn.primary:active { filter: brightness(0.97);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 1px 2px rgba(4,10,20,0.3); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.danger { color: var(--bad); border-color: transparent; background: transparent; }
.btn.danger:hover { background: var(--bad-soft); }
.btn.sm { min-height: 32px; padding: 0 10px; font-size: 12.5px; }
.btn.icon { padding: 0; width: 34px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.block { width: 100%; }

/* Users */
.users-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.count-pill {
  font-size: 12px; font-weight: 500; color: var(--text-2);
  background: var(--surface-2); border: 1px solid var(--border);
  padding: 3px 9px; border-radius: 999px;
}
.users-head .spacer { margin-inline-start: auto; }

.ulist { display: flex; flex-direction: column; border-radius: var(--r-md); box-shadow: var(--shadow-card); }
.ulist .card { border-radius: 0; border-bottom: 0; box-shadow: none; transition: background .12s var(--ease-out); }
.ulist .card:hover { background: var(--surface-2); }
.ulist .card:first-child { border-top-left-radius: var(--r-md); border-top-right-radius: var(--r-md); }
.ulist .card:last-child { border-bottom: 1px solid var(--border); border-bottom-left-radius: var(--r-md); border-bottom-right-radius: var(--r-md); }
.ulist .card + .card { margin-top: 0; }

.urow { display: grid; grid-template-columns: minmax(0,1.4fr) minmax(0,1.5fr) auto auto; align-items: center; gap: 14px; padding: 14px 16px; }
.uname { display: flex; align-items: center; gap: 11px; min-width: 0; }
.uname .dot { margin-top: 1px; }
.uname-main { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.uname-sub { font-size: 11.5px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.uname-sub.expired { color: var(--bad); }

.meter-head { display: flex; align-items: baseline; gap: 6px; font-size: 12.5px; margin-bottom: 6px; }
.meter-head .used { color: var(--text); font-weight: 500; }
.meter-head .of { color: var(--text-3); }
.bar { height: 5px; border-radius: 999px; background: var(--surface-3); overflow: hidden; position: relative; }
.bar-fill { height: 100%; border-radius: 999px; background: var(--grad); transition: width .5s var(--ease-out); }
.bar-fill.warn { background: var(--warn); }
.bar-fill.bad { background: var(--bad); }
.bar.unlimited { background: repeating-linear-gradient(90deg, var(--surface-3) 0 6px, transparent 6px 12px); }

.uactions { display: flex; align-items: center; gap: 4px; justify-content: flex-end; }

/* Switch */
.switch { display: inline-flex; align-items: center; cursor: pointer; position: relative; }
.switch input { position: absolute; opacity: 0; width: 44px; height: 44px; margin: 0; cursor: pointer; }
.switch .track {
  width: 38px; height: 22px; border-radius: 999px;
  background: var(--surface-3); border: 1px solid var(--border-strong);
  transition: background .16s var(--ease-out), border-color .16s var(--ease-out);
  position: relative; flex: none;
}
.switch .knob {
  position: absolute; top: 2px; inset-inline-start: 2px;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--text-2);
  transition: transform .18s var(--ease-out), background .16s var(--ease-out);
}
.switch input:checked + .track { background: var(--grad); border-color: transparent; }
.switch input:checked + .track .knob { transform: translateX(16px); background: #fff; }
.switch input:focus-visible + .track { box-shadow: var(--ring); }
.switch input:disabled + .track { opacity: .55; cursor: not-allowed; }

/* Toggle rows (protocols) */
.toggle-row { display: flex; align-items: center; gap: 14px; padding: 16px 18px; }
.toggle-row + .toggle-row { border-top: 1px solid var(--border); }
.toggle-row .tr-txt { margin-inline-end: auto; }
.toggle-row .tr-name { font-weight: 500; display: flex; align-items: center; gap: 8px; }
.toggle-row .tr-desc { color: var(--text-3); font-size: 12.5px; margin-top: 2px; }
.locked { font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); border: 1px solid var(--accent-line); padding: 1px 6px; border-radius: 999px; }

/* Field / copy rows */
.frow { padding: 15px 18px; }
.frow + .frow { border-top: 1px solid var(--border); }
.flabel { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--text-3); margin-bottom: 7px; }
.copyfield {
  display: flex; align-items: center; gap: 8px;
  background: var(--input-bg); border: 1px solid var(--border);
  border-radius: var(--r-sm); padding: 8px; padding-inline-start: 12px;
}
.copyfield code { font-family: var(--font-mono); font-size: 12.5px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; direction: ltr; unicode-bidi: plaintext; text-align: start; }
.copyfield .btn { margin-inline-start: auto; }
/* Long shell commands: wrap instead of truncating so the whole line stays visible. */
.copyfield.is-wrap { align-items: flex-start; }
.copyfield.is-wrap code { white-space: pre-wrap; word-break: break-all; overflow: visible; text-overflow: clip; line-height: 1.6; }

.info-grid { display: grid; grid-template-columns: 1fr 1fr; }
.info-cell { padding: 15px 18px; }
.info-cell:nth-child(odd) { border-inline-end: 1px solid var(--border); }
.info-cell:nth-child(n+3) { border-top: 1px solid var(--border); }
.info-cell .k { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--text-3); }
.info-cell .v { margin-top: 5px; font-size: 14px; }

.notice { display: flex; gap: 10px; padding: 13px 15px; border-radius: var(--r-sm); font-size: 12.5px; color: var(--text-2); background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); }
.notice svg { width: 16px; height: 16px; flex: none; color: var(--warn); margin-top: 1px; }
.notice.plain { background: var(--surface-2); border-color: var(--border); }
.notice.plain svg { color: var(--h-blue); }

/* Container (PaaS) mode banner: a single calm, informational strip at the top of
   every view. Uses the same surface/medallion language as the cards so it reads
   native, not as an alert. Tinted with the neutral info hue (blue), never red. */
.paas-banner { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 18px;
  padding: 14px 16px; border-radius: var(--r-md); background: var(--surface-2);
  border: 1px solid var(--border); box-shadow: var(--shadow-card); }
.paas-banner .pb-ic { width: 38px; height: 38px; flex: none; display: grid; place-items: center;
  border-radius: 11px; color: var(--h-blue);
  background: linear-gradient(160deg, color-mix(in srgb, var(--h-blue) 24%, transparent), color-mix(in srgb, var(--h-blue) 11%, transparent));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--h-blue) 32%, transparent); }
.paas-banner .pb-ic svg { width: 18px; height: 18px; }
.paas-banner .pb-tx { min-width: 0; font-size: 12.75px; line-height: 1.6; color: var(--text-2); padding-top: 1px; }

/* Per-section guide: a subtle, expandable "what is this" line that sits under the
   section heading and reveals a short paragraph. Reuses the plain-callout tokens. */
.guide { margin: -4px 0 18px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface-2); }
.guide > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 9px; padding: 10px 14px; font-size: 12.5px; font-weight: 600; color: var(--text-2); }
.guide > summary::-webkit-details-marker { display: none; }
.guide > summary > svg { width: 15px; height: 15px; flex: none; color: var(--h-blue); }
.guide > summary .g-chev { margin-inline-start: auto; width: 15px; height: 15px; color: var(--text-3); transition: transform .18s ease; }
.guide[open] > summary { color: var(--text); }
.guide[open] > summary .g-chev { transform: rotate(180deg); }
.guide > p { margin: 0; padding: 0 14px 12px; padding-inline-start: 38px; font-size: 12.5px; line-height: 1.6; color: var(--text-3); max-width: 78ch; }
.guide.g-inline { margin: 0 0 14px; }

/* Book-icon help popup body + the trigger button. */
.help-doc { font-size: 13px; line-height: 1.65; color: var(--text-2); }
.help-doc p { margin: 0 0 10px; }
.help-doc p:last-child { margin-bottom: 0; }
.help-doc ul { margin: 0 0 10px; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 5px; }
.help-doc ul:last-child { margin-bottom: 0; }
.help-doc li { line-height: 1.5; }
.book-btn { color: var(--text-3); }
.book-btn:hover { color: var(--h-blue); }

/* Tunnel backend picker: label + choose-help, and the selected backend's badges. */
.tn-backend-lbl { display: flex; align-items: center; gap: 4px; margin-bottom: 7px; }
.tn-backend-lbl .book-btn { padding: 3px; }
.tn-backend-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 22px; margin-top: 9px; }
.tn-backend-meta .book-btn { padding: 3px; }
.tn-backend-meta:empty { display: none; }

/* Setup wizard: a prominent, collapsible step-by-step guide (Tunnel view). Built
   from the same card/badge/copyfield tokens so it reads as part of the system.
   Iran and foreign servers each get their own hue via --sg-hue on the pills. */
.setup-guide { margin-bottom: 14px; border: 1px solid var(--border); border-radius: var(--r-md);
  background: var(--surface-1); box-shadow: var(--shadow-card); overflow: hidden; }
.setup-guide > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 11px;
  padding: 14px 16px; font-size: 14px; font-weight: 600; color: var(--text); }
.setup-guide > summary::-webkit-details-marker { display: none; }
.setup-guide .sg-ic { width: 30px; height: 30px; flex: none; border-radius: 9px; display: grid; place-items: center;
  color: var(--h-blue); background: color-mix(in srgb, var(--h-blue) 15%, transparent); }
.setup-guide .sg-ic svg { width: 16px; height: 16px; }
.setup-guide .sg-head-txt { min-width: 0; }
.setup-guide .sg-sub { display: block; font-size: 11.5px; font-weight: 400; color: var(--text-3); margin-top: 1px; }
.setup-guide .sg-chev { margin-inline-start: auto; width: 16px; height: 16px; flex: none; color: var(--text-3);
  transition: transform .18s var(--ease-out); }
.setup-guide[open] > summary .sg-chev { transform: rotate(180deg); }
.sg-body { padding: 2px 16px 18px; border-top: 1px solid var(--border); }
.sg-intro { font-size: 12.5px; line-height: 1.6; color: var(--text-3); margin: 14px 0 16px; max-width: 78ch; }
.sg-sec-h { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); margin: 4px 0 10px; }
.sg-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 700; letter-spacing: .04em;
  text-transform: uppercase; padding: 2px 9px; border-radius: 999px; white-space: nowrap; flex: none;
  color: var(--sg-hue, var(--accent)); background: color-mix(in srgb, var(--sg-hue, var(--accent)) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--sg-hue, var(--accent)) 32%, transparent); }
.sg-pill i { width: 6px; height: 6px; border-radius: 999px; background: currentColor; flex: none; }
.sg-need { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
.sg-need-card { border: 1px solid var(--border); border-radius: var(--r-sm); padding: 12px 13px; background: var(--surface-2); }
.sg-need-card p { font-size: 12px; line-height: 1.55; color: var(--text-3); margin-top: 9px; }
@media (max-width: 560px) { .sg-need { grid-template-columns: 1fr; } }
.sg-steps { display: flex; flex-direction: column; }
.sg-step { display: grid; grid-template-columns: auto 1fr; gap: 14px; padding: 15px 0; }
.sg-step + .sg-step { border-top: 1px solid var(--border); }
.sg-num { width: 28px; height: 28px; flex: none; border-radius: 999px; display: grid; place-items: center;
  font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ac-ink); background: var(--grad);
  box-shadow: 0 2px 9px -3px color-mix(in srgb, var(--accent) 55%, transparent); }
.sg-step-main { min-width: 0; }
.sg-step-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 5px; }
.sg-step-title { font-size: 13.5px; font-weight: 600; color: var(--text); }
.sg-step-body { font-size: 12.5px; line-height: 1.6; color: var(--text-3); }
.sg-step-body + .sg-step-body { margin-top: 8px; }
.sg-step-list { margin: 9px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.sg-step-list li, .sg-notes li { position: relative; padding-inline-start: 16px; font-size: 12.5px; line-height: 1.55; color: var(--text-3); }
.sg-step-list li::before { content: ""; position: absolute; inset-inline-start: 3px; top: 8px; width: 5px; height: 5px;
  border-radius: 999px; background: color-mix(in srgb, var(--accent) 62%, var(--text-3)); }
.sg-step-list li b, .sg-notes li b { color: var(--text-2); font-weight: 600; }
.sg-field-label { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-2); margin: 11px 0 6px; }
.sg-step .copyfield { margin-top: 10px; }
.sg-check { display: flex; gap: 10px; align-items: flex-start; margin-top: 16px; padding: 12px 14px; border-radius: var(--r-sm);
  background: color-mix(in srgb, var(--good) 10%, transparent); border: 1px solid color-mix(in srgb, var(--good) 28%, transparent); }
.sg-check svg { width: 16px; height: 16px; flex: none; color: var(--good); margin-top: 1px; }
.sg-check .sg-check-b { font-size: 12.5px; line-height: 1.55; color: var(--text-2); }
.sg-check .sg-check-b b { color: var(--text); font-weight: 600; }
.sg-notes { margin-top: 18px; }
.sg-notes ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; }
.sg-notes li { font-size: 12px; }
.sg-notes li::before { content: ""; position: absolute; inset-inline-start: 3px; top: 7px; width: 5px; height: 5px;
  border-radius: 999px; background: color-mix(in srgb, var(--h-blue) 70%, transparent); }

/* Domain & TLS card */
.dtls-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.dtls-head h3 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; margin-inline-end: auto; }
.dtls-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--good); background: var(--good-soft); border: 1px solid color-mix(in srgb, var(--good) 30%, transparent); padding: 2px 8px 2px 7px; border-radius: 999px; flex: none; }
.dtls-pill svg { width: 12px; height: 12px; }
.dtls-status { color: var(--text-3); font-size: 12.5px; line-height: 1.55; margin-bottom: 16px; }
.dtls .field:last-of-type { margin-bottom: 14px; }
.dtls-actions { display: flex; flex-direction: column; gap: 9px; }
/* Cloudflare connect sub-panel inside the Domain & TLS card */
.cf-panel { border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface-1); padding: 14px; margin: 2px 0 16px; }
.cf-panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.cf-panel-title { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--text); }
.cf-panel-title svg { width: 18px; height: 18px; color: var(--accent); flex: none; }
.cf-panel-desc { color: var(--text-3); font-size: 12.5px; line-height: 1.5; margin: 8px 0 12px; }
.dtls textarea.input { min-height: 96px; line-height: 1.55; resize: vertical; }
.dtls .pem { font-family: var(--font-mono); font-size: 12px; direction: ltr; text-align: start; unicode-bidi: plaintext; }
.dtls .ltr { direction: ltr; text-align: start; unicode-bidi: plaintext; }
.spinner { width: 15px; height: 15px; border-radius: 50%; border: 2px solid color-mix(in srgb, currentColor 28%, transparent); border-top-color: currentColor; animation: spin .7s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }

/* Inbounds */
.input.ltr { direction: ltr; text-align: start; unicode-bidi: plaintext; }
.inb-row { display: flex; align-items: center; gap: 12px; padding: 15px 18px; }
.inb-txt { min-width: 0; margin-inline-end: auto; }
.inb-name { font-weight: 500; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.inb-name .inb-nm { overflow: hidden; text-overflow: ellipsis; }
.inb-sub { display: flex; gap: 14px; margin-top: 3px; font-size: 12px; color: var(--text-3); }
.inb-sub b { color: var(--text-2); font-weight: 600; }
.inb-transport { text-transform: uppercase; letter-spacing: .03em; font-size: 11px; }
.inb-actions { display: flex; align-items: center; gap: 6px; flex: none; }
.inb-key { padding: 0 18px 15px; }

/* WireGuard inbound card body + peer rows */
.inb-wg { padding: 0 18px 16px; display: flex; flex-direction: column; gap: 10px; }
.inb-wg-lbl { margin-top: 4px; }
.inb-wg-peers { display: flex; flex-direction: column; gap: 8px; }
.inb-wg-peer { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--border);
  border-radius: var(--r-sm); background: var(--surface-2); }
.inb-wg-peer-txt { min-width: 0; margin-inline-end: auto; }
.inb-wg-peer-name { font-size: 13px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.inb-wg-peer-addr { font-size: 12px; color: var(--text-3); margin-top: 2px; direction: ltr; unicode-bidi: plaintext; }
.inb-wg-peer-actions { display: inline-flex; gap: 6px; flex: none; }
/* WireGuard peer editor rows (add-inbound modal) */
.wg-peer-list { display: flex; flex-direction: column; gap: 8px; }
.wg-peer-row { display: flex; align-items: center; gap: 8px; }
.wg-peer-row .input { flex: 1; min-width: 0; }
.wg-peer-row .btn { flex: none; }

/* Multi-profile inbound editor (create/edit modal) */
.prof-sec { margin-top: 4px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface-1); }
.prof-sec > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px;
  padding: 12px 13px; font-size: 13px; font-weight: 600; color: var(--text-2); }
.prof-sec > summary::-webkit-details-marker { display: none; }
.prof-sec > summary:hover { color: var(--text); }
.prof-sec > summary:focus-visible { outline: none; box-shadow: var(--ring); border-radius: var(--r-sm); }
.prof-sec .prof-chev { margin-inline-start: auto; display: inline-flex; color: var(--text-3);
  transition: transform .15s var(--ease-out); }
.prof-sec .prof-chev svg { width: 15px; height: 15px; display: block; }
.prof-sec[open] > summary .prof-chev { transform: rotate(180deg); }
[dir="rtl"] .prof-sec .prof-chev { transform: scaleX(-1); }
[dir="rtl"] .prof-sec[open] > summary .prof-chev { transform: rotate(180deg); }
.prof-sec .prof-body { padding: 0 13px 13px; }
.prof-list { display: flex; flex-direction: column; gap: 10px; }
.prof-empty { color: var(--text-3); font-size: 12.5px; line-height: 1.5; padding: 2px 2px 0; }
.prof-row { border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface-2);
  padding: 10px 11px; display: flex; flex-direction: column; gap: 8px; }
.prof-main { display: flex; align-items: center; gap: 8px; }
.prof-main .input { flex: 1; min-width: 0; }
.prof-main .btn { flex: none; }
.prof-opt { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.prof-opt .input { min-width: 0; font-size: 12.5px; }
.inb-chip.prof { color: color-mix(in srgb, var(--tile, var(--accent)) 74%, var(--text-2));
  background: color-mix(in srgb, var(--tile, var(--accent)) 12%, transparent);
  border-color: color-mix(in srgb, var(--tile, var(--accent)) 24%, transparent); font-weight: 600; }
@media (max-width: 560px) { .prof-opt { grid-template-columns: 1fr 1fr; } }
@media (prefers-reduced-motion: reduce) { .prof-sec .prof-chev { transition: none; } }

.inb-presets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.inb-preset { text-align: start; padding: 11px 12px; border: 1px solid var(--border); background: var(--input-bg); border-radius: var(--r-sm); cursor: pointer; color: var(--text-2); transition: background .12s var(--ease-out), border-color .12s var(--ease-out); }
.inb-preset:hover { background: var(--surface-3); }
.inb-preset[aria-pressed="true"] { border-color: var(--accent-line); background: var(--accent-soft); color: var(--text); }
.inb-preset .pn { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12.5px; font-weight: 600; }
.inb-preset .pd { display: block; font-size: 10.5px; color: var(--text-3); margin-top: 4px; letter-spacing: .02em; text-transform: uppercase; }
.inb-preset .locked { text-transform: uppercase; }
.inb-preset-groups { display: flex; flex-direction: column; gap: 18px; }
.inb-preset-glabel { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 9px; }
.inb-preset-gname { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); }
.inb-preset-gname::before { content: ""; width: 4px; height: 12px; border-radius: 2px; background: var(--border-strong); }
.inb-preset-group.is-front .inb-preset-gname::before { background: var(--h-teal); }
.inb-preset-group.is-domain .inb-preset-gname::before { background: var(--h-blue); }
.inb-preset-gnote { font-size: 11.5px; line-height: 1.45; color: var(--text-3); }
.sni-suggest { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.sni-chip { appearance: none; cursor: pointer; font: inherit; font-size: 11.5px; color: var(--text-2); background: var(--input-bg); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; transition: background .12s var(--ease-out), border-color .12s var(--ease-out); direction: ltr; }
.sni-chip:hover { background: var(--surface-3); border-color: var(--border-strong); }
@media (max-width: 640px) { .inb-presets { grid-template-columns: 1fr; } }

/* Empty / loading / error states */
.state { text-align: center; padding: 46px 20px; color: var(--text-3); }
.state .ic { width: 40px; height: 40px; margin: 0 auto 12px; color: var(--text-3); opacity: .7; }
.state h3 { font-size: 15px; color: var(--text-2); margin-bottom: 5px; }
.state p { font-size: 13px; max-width: 340px; margin: 0 auto 16px; }
.skel { border-radius: var(--r-md); background:
  linear-gradient(90deg, var(--surface-1) 0%, var(--surface-2) 40%, var(--surface-1) 80%);
  background-size: 300% 100%; animation: shim 1.3s linear infinite; }
@keyframes shim { to { background-position: -300% 0; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
.skel-row { height: 66px; margin-bottom: 2px; }

.err-banner { display: flex; align-items: center; gap: 10px; padding: 12px 15px; border-radius: var(--r-sm); background: var(--bad-soft); border: 1px solid color-mix(in srgb, var(--bad) 32%, transparent); color: var(--text); font-size: 13px; margin-bottom: 16px; }

/* --- Login / setup screen (futuristic gate) --- */
.gate { min-height: 100dvh; display: grid; place-items: center; padding: 24px; position: relative; overflow: hidden; }
/* Aurora: oversized, slowly drifting accent blooms behind everything. */
.gate::before {
  content: ""; position: absolute; inset: -40%; z-index: 0; pointer-events: none;
  background:
    radial-gradient(38% 32% at 30% 24%, color-mix(in srgb, var(--ac) 42%, transparent), transparent 62%),
    radial-gradient(42% 36% at 74% 30%, color-mix(in srgb, var(--ac2) 40%, transparent), transparent 66%),
    radial-gradient(52% 42% at 50% 92%, color-mix(in srgb, var(--ac2) 24%, transparent), transparent 72%);
  filter: blur(26px) saturate(120%);
  opacity: .85;
  /* Drift, breathe, and slowly shift hue so the bloom feels alive, not static. */
  animation: gate-aurora 32s ease-in-out infinite alternate;
  will-change: transform, filter, opacity;
}
/* Grid: faint technical lattice, faded toward the edges by a radial mask. */
.gate::after {
  content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(color-mix(in srgb, var(--text) 9%, transparent) 1px, transparent 1px),
    linear-gradient(90deg, color-mix(in srgb, var(--text) 9%, transparent) 1px, transparent 1px);
  background-size: 44px 44px;
  -webkit-mask-image: radial-gradient(68% 58% at 50% 40%, #000, transparent 78%);
          mask-image: radial-gradient(68% 58% at 50% 40%, #000, transparent 78%);
  opacity: .55;
  /* Faint breathing so the lattice softly glows in and out. */
  animation: gate-grid 14s ease-in-out infinite alternate;
  will-change: opacity;
}
@keyframes gate-aurora {
  0%   { transform: translate3d(-3%, -2%, 0) scale(1);    filter: blur(26px) saturate(120%) hue-rotate(0deg);   opacity: .74; }
  50%  { transform: translate3d(3%, 2%, 0) scale(1.08);   filter: blur(31px) saturate(140%) hue-rotate(11deg);  opacity: .92; }
  100% { transform: translate3d(-2%, 3%, 0) scale(1.05);  filter: blur(28px) saturate(128%) hue-rotate(-7deg);  opacity: .8; }
}
@keyframes gate-grid {
  from { opacity: .4; }
  to   { opacity: .62; }
}
/* Ambient light orbs drifting behind the card (below .gate-card, above aurora). */
.gate-fx { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.gate-fx .orb {
  position: absolute; border-radius: 50%;
  filter: blur(40px); opacity: .42;
  will-change: transform, opacity;
}
.gate-fx .orb-1 {
  width: 300px; height: 300px; top: 6%; inset-inline-start: 8%;
  background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--ac) 60%, transparent), transparent 66%);
  animation: gate-orb-1 26s ease-in-out infinite;
}
.gate-fx .orb-2 {
  width: 340px; height: 340px; bottom: 4%; inset-inline-end: 6%;
  background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--ac2) 58%, transparent), transparent 66%);
  animation: gate-orb-2 32s ease-in-out infinite;
}
.gate-fx .orb-3 {
  width: 220px; height: 220px; top: 40%; inset-inline-start: 58%;
  background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--ac) 45%, transparent), transparent 68%);
  animation: gate-orb-3 22s ease-in-out infinite;
}
@keyframes gate-orb-1 {
  0%, 100% { transform: translate3d(0, 0, 0) scale(1);          opacity: .38; }
  50%      { transform: translate3d(7%, -6%, 0) scale(1.14);    opacity: .6; }
}
@keyframes gate-orb-2 {
  0%, 100% { transform: translate3d(0, 0, 0) scale(1.06);       opacity: .34; }
  50%      { transform: translate3d(-6%, 5%, 0) scale(1);       opacity: .56; }
}
@keyframes gate-orb-3 {
  0%, 100% { transform: translate3d(0, 0, 0) scale(1);          opacity: .3; }
  50%      { transform: translate3d(-8%, -7%, 0) scale(1.18);   opacity: .5; }
}
.gate-card { width: 100%; max-width: 380px; position: relative; z-index: 1;
  animation: gate-in .55s var(--ease-out) both; }
@keyframes gate-in { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }
.gate-brand { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; margin-bottom: 26px; }
.gate-brand .mark { width: 52px; height: 52px; position: relative;
  filter: drop-shadow(0 4px 20px color-mix(in srgb, var(--ac) 55%, transparent)); }
.gate-brand .mark svg { width: 100%; height: 100%; position: relative; }
/* Soft halo that breathes behind the logo. */
.gate-brand .mark::after {
  content: ""; position: absolute; inset: -34%; z-index: -1; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--ac) 60%, transparent), transparent 66%);

    var(--grad);

/* Frosted glass over the aurora. */
.gate .card {
  position: relative; overflow: hidden;
  background: color-mix(in srgb, var(--surface-1) 80%, transparent);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
          backdrop-filter: blur(16px) saturate(140%);
  border-color: color-mix(in srgb, var(--text) 12%, transparent);
  box-shadow: 0 26px 64px -28px color-mix(in srgb, var(--ac2) 45%, transparent),

}
.gate .card::before {

  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--ac) 60%, transparent), transparent);
}
.gate .btn.primary { position: relative; overflow: hidden;
  box-shadow: 0 10px 26px -10px color-mix(in srgb, var(--ac2) 62%, transparent); }
/* A soft light sheen that periodically sweeps across the Sign in button. */
.gate .btn.primary::after {
  content: ""; position: absolute; top: 0; bottom: 0; left: -80%; width: 55%; pointer-events: none;
  background: linear-gradient(100deg, transparent, color-mix(in srgb, #fff 42%, transparent), transparent);
  transform: translateX(0) skewX(-20deg); opacity: 0;
  animation: gate-sheen 7s ease-in-out infinite; animation-delay: 1.4s;
}
.gate .btn.primary:disabled::after { animation: none; opacity: 0; }
@keyframes gate-sheen {
  0%        { transform: translateX(0) skewX(-20deg);    opacity: 0; }
  7%        { opacity: 1; }
  24%, 100% { transform: translateX(330%) skewX(-20deg); opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {

  .gate::after,

  /* Rest in a clean static state: wordmark sheen parked off, button sheen hidden. */
  .gate-brand h1 { background-position: -120% 0, 0 0; }
  .gate .btn.primary::after { opacity: 0; }

.field { margin-bottom: 14px; }
