// Minimal v2ray stats StatsService proto, enough for grpcurl to call
// QueryStats against the custom sing-box build's v2ray_api (which reports
// per-user Hysteria2 traffic as user>>><name>>>traffic>>>uplink/downlink).
syntax = "proto3";
package v2ray.core.app.stats.command;

message QueryStatsRequest {
  string pattern = 1;
  bool reset = 2;
}
message Stat {
  string name = 1;
  int64 value = 2;
}
message QueryStatsResponse {
  repeated Stat stat = 1;
}
service StatsService {
  rpc QueryStats(QueryStatsRequest) returns (QueryStatsResponse);
}
